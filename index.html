<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>은하 요리 계산기</title>
<style>
:root {
  --panel:rgba(16,19,48,.9);
  --panel2:rgba(28,32,75,.85);
  --text:#f4f5ff;
  --muted:#b9bddb;
  --line:rgba(255,255,255,.14);
  --accent:#9b8cff;
  --blue:#61d6ff;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:"Malgun Gothic",sans-serif;
  background:
    radial-gradient(circle at 15% 20%,rgba(111,76,255,.38),transparent 28%),
    radial-gradient(circle at 85% 25%,rgba(0,180,255,.23),transparent 25%),
    linear-gradient(135deg,#050614,#101434 55%,#070818);
}
.app{max-width:1150px;margin:auto;padding:25px 16px 45px}
.hero{text-align:center;margin-bottom:18px}
.hero h1{margin:0;font-size:clamp(28px,5vw,48px);text-shadow:0 0 24px #9678ff}
.hero p{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;margin-bottom:16px;backdrop-filter:blur(12px)}
.controls{padding:18px}
.category-tabs{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.category-tab,.btn{
  padding:12px 15px;border:1px solid var(--line);border-radius:11px;
  color:white;background:rgba(255,255,255,.07);cursor:pointer;font-size:15px;
}
.category-tab{flex:1 1 150px;font-weight:bold;font-size:17px}
.category-tab.active{background:rgba(155,140,255,.3);border-color:var(--blue)}
.search{
  width:100%;padding:15px;border-radius:11px;border:1px solid var(--line);
  background:#080a20;color:white;font-size:18px;
}
.recipe-list{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:9px;margin-top:14px;max-height:450px;overflow:auto;
}
.recipe-item{padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.recipe-btn{
  width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;
  background:rgba(255,255,255,.04);color:white;text-align:left;
  font-size:17px;font-weight:bold;cursor:pointer;
}
.recipe-btn:hover,.recipe-btn.active{border-color:var(--blue)}
.grade,.note{font-size:13px;color:var(--muted)}
.grade{display:block;margin-top:6px}
.percent-edit{display:flex;align-items:center;gap:7px;margin-top:10px;color:var(--muted);font-size:14px}
.percent-edit input{
  width:75px;padding:8px;border:1px solid var(--line);border-radius:8px;
  background:#090b23;color:white;text-align:center;
}
.percent-preview{margin-top:7px}
.price-admin-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}
.content{padding:20px}
.selected{font-size:25px;font-weight:bold;margin-bottom:16px}
.result{
  padding:17px;border-radius:14px;
  background:linear-gradient(135deg,rgba(110,85,255,.22),rgba(55,180,255,.14));
  border:1px solid rgba(150,150,255,.28);margin-bottom:16px;font-size:18px;
}
.result strong{font-size:clamp(27px,4vw,40px);display:block;margin-top:6px}
.empty{text-align:center;color:var(--muted);padding:25px;font-size:17px}
.table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:center}
th{color:#d9d7ff;background:rgba(255,255,255,.05)}
td:first-child{text-align:left;font-weight:bold}
input.num{
  width:80px;padding:9px;border-radius:8px;border:1px solid var(--line);
  background:#090b23;color:white;text-align:center;font-size:16px;
}
.btn-primary{background:rgba(155,140,255,.25);border-color:#9b8cff}
.btn-success{background:rgba(104,224,160,.14);border-color:#68e0a0}
.btn-danger{background:rgba(255,100,124,.14);border-color:#ff647c}
.btn-discord{background:rgba(88,101,242,.3);border-color:#5865f2;font-weight:bold}
.top-actions,.discord-send-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.login-box{padding:16px}
.login-row{display:flex;gap:8px;flex-wrap:wrap}
.login-row input{flex:1;min-width:150px;padding:12px;border-radius:8px;border:1px solid var(--line);background:#090b23;color:white}
.status{color:var(--muted);margin-top:10px}
.hidden{display:none!important}
@media(max-width:700px){
  .app{padding:14px 8px 30px}
  .content,.controls{padding:12px}
  .table{font-size:12px}
  input.num{width:58px}
  .login-row{flex-direction:column}
}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <h1>🌌 은하 요리 계산기 🍳</h1>
    <p>64개 = 1세트 · 보유 재료를 세트 + 낱개로 입력하세요</p>
    <div class="top-actions">
      <button class="btn btn-primary" id="loginBtn">🔐 관리자 로그인</button>
      <button class="btn btn-danger hidden" id="logoutBtn">로그아웃</button>
    </div>
  </header>

  <section class="card controls">
    <div id="categoryTabs" class="category-tabs"></div>
    <input id="search" class="search" placeholder="🔎 선택한 카테고리에서 요리 검색">
    <div id="recipeList" class="recipe-list"></div>
    <div id="priceAdminBar" class="price-admin-bar"></div>
  </section>

  <section class="card content">
    <div id="appContent" class="empty">위에서 요리를 선택해주세요.</div>
  </section>

  <section id="loginSection" class="card hidden">
    <div class="login-box">
      <h3>🔐 관리자 인증</h3>
      <div class="login-row">
        <input type="email" id="emailInput" placeholder="관리자 이메일">
        <input type="password" id="passwordInput" placeholder="관리자 비밀번호">
        <button class="btn btn-primary" id="doLoginBtn">로그인</button>
      </div>
      <div id="loginStatus" class="status"></div>
    </div>
  </section>
</div>

    "황금 수박 미역 샐러드":{"수박 미역 샐러드":1,"황금 가루":1},

    "황금 잉걸불":{"초록 잉걸불":20,"푸른 잉걸불":20,"잿빛 잉걸불":20,"붉은 잉걸불":20}
  }
};

const prices={
  "코울슬로":8384,
  "마늘 바게트":11763,
  "감자 대파 수프":8381,
  "치킨 라이스":12733,
  "비프 샌드위치":12453,
  "제육볶음":9073,
  "새우 볶음밥":12492,
  "달콤 오징어 구이":11361,
  "가리비 호박 구이":14012,
  "수박 미역 샐러드":14014,
  "사과 샐러드":16895,
  "호박죽":9214,
  "과일 굴 무침":12468,
  "호박 브륄레":8193,
  "당근 케이크":8450,
  "감자전":5122,
  "수박 주스":8189,
  "애플파이":17537,
  "게살버거":12209
};

let selected=null;
let selectedCategory=null;
let activeCategory=Object.keys(recipes)[0];
let isAdmin=false;
let pricePercentages={};
let pricePercentagesLoaded=false;
let currentPossibleCount=0;
let ownedMaterials=loadOwnedMaterials();

function loadOwnedMaterials(){
  try{return JSON.parse(localStorage.getItem(OWNED_STORAGE_KEY))||{};}
  catch{return {};}
}
function saveOwnedMaterials(){
  localStorage.setItem(OWNED_STORAGE_KEY,JSON.stringify(ownedMaterials));
}
function formatNumber(n){return Number(n||0).toLocaleString("ko-KR");}
function formatWon(n){return formatNumber(Math.round(n||0))+"원";}
function formatStack(n){
  n=Math.floor(Number(n||0));
  const sets=Math.floor(n/STACK),pieces=n%STACK;
  if(sets&&pieces)return `${formatNumber(n)}개 (${sets}세트 + ${pieces}개)`;
  if(sets)return `${formatNumber(n)}개 (${sets}세트)`;
  return `${formatNumber(n)}개`;
}
function escapeHtml(value){
  return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;")
    .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;");
}
function cssId(name){
  return btoa(unescape(encodeURIComponent(name))).replace(/[^a-zA-Z0-9]/g,"");
}
function findRecipe(name){
  for(const group of Object.values(recipes)){
    if(Object.prototype.hasOwnProperty.call(group,name))return group[name];
  }
  return null;
}
function expandRecipe(name,amount=1,result={}){
  const recipe=findRecipe(name);
  if(!recipe||!Object.keys(recipe).length)return result;
  for(const [item,need] of Object.entries(recipe)){
    const total=need*amount;
    const nested=findRecipe(item);
    if(nested&&Object.keys(nested).length)expandRecipe(item,total,result);
    else result[item]=(result[item]||0)+total;
  }
  return result;
}
function getAdjustedPrice(name){
  const base=Number(prices[name]||0);
  const percent=Number(pricePercentages[name]||0);
  return Math.round(base*(1+percent/100));
}

function renderCategoryTabs(){
  const tabs=document.getElementById("categoryTabs");
  tabs.innerHTML="";
  for(const category of Object.keys(recipes)){
    const button=document.createElement("button");
    button.className="category-tab"+(activeCategory===category?" active":"");
    button.textContent=category;
    button.onclick=()=>{
      activeCategory=category;
      selected=null;
      selectedCategory=category;
      document.getElementById("search").value="";
      document.getElementById("appContent").innerHTML='<div class="empty">요리를 선택해주세요.</div>';
      renderCategoryTabs();
      renderList();
    };
    tabs.appendChild(button);
  }
}

function renderList(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const list=document.getElementById("recipeList");
  list.innerHTML="";
  const group=recipes[activeCategory]||{};
  const matches=Object.keys(group).filter(name=>name.toLowerCase().includes(q));

  for(const name of matches){
    const item=document.createElement("div");
    item.className="recipe-item";

    const button=document.createElement("button");
    button.className="recipe-btn"+(selected===name?" active":"");
    button.innerHTML=`${escapeHtml(name)}${prices[name]?`<span class="grade">원금: ${formatWon(prices[name])}</span>`:""}`;
    button.onclick=()=>selectRecipe(activeCategory,name);
    item.appendChild(button);

    if(activeCategory==="일반 요리"&&isAdmin){
      const edit=document.createElement("label");
      edit.className="percent-edit";
      const text=document.createElement("span");
      text.textContent="추가 비율";
      const input=document.createElement("input");
      input.type="number";
      input.min="-100";
      input.step="1";
      input.value=Number(pricePercentages[name]||0);
      input.dataset.percentName=name;
      input.setAttribute("aria-label",`${name} 추가 비율`);
      input.addEventListener("input",()=>{
        pricePercentages[name]=Number(input.value||0);
        const preview=item.querySelector(".percent-preview");
        if(preview)preview.textContent=`디코 전송 금액: ${formatWon(getAdjustedPrice(name))}`;
      });
      const pct=document.createElement("span");
      pct.textContent="%";
      edit.append(text,input,pct);
      item.appendChild(edit);

      const preview=document.createElement("div");
      preview.className="note percent-preview";
      preview.textContent=`디코 전송 금액: ${formatWon(getAdjustedPrice(name))}`;
      item.appendChild(preview);
    }
    list.appendChild(item);
  }

  if(!list.children.length)list.innerHTML='<div class="empty">검색 결과가 없습니다.</div>';
  renderPriceAdminBar();
}

function renderPriceAdminBar(){
  const bar=document.getElementById("priceAdminBar");
  if(activeCategory==="일반 요리"&&isAdmin){
    bar.innerHTML=`
      <span id="priceSaveStatus" class="note">요리별 비율을 입력한 뒤 저장하세요.</span>
      <button class="btn btn-success" id="savePricePercentagesBtn">💾 비율 저장</button>`;
    document.getElementById("savePricePercentagesBtn").onclick=savePricePercentages;
  }else{
    bar.innerHTML="";
  }
}

async function loadPricePercentages(){
  try{
    const snap=await getDoc(PRICE_PERCENT_REF);
    pricePercentages=snap.exists()&&snap.data().percentages?snap.data().percentages:{};
  }catch(error){
    console.error("추가 비율 불러오기 실패:",error);
    alert("저장된 비율을 불러오지 못했습니다. Firestore 권한을 확인해주세요.");
  }
  pricePercentagesLoaded=true;
  renderList();
  if(selected)renderRecipe();
}

async function savePricePercentages(){
  if(!auth.currentUser||auth.currentUser.uid!==ADMIN_UID){
    alert("관리자만 비율을 저장할 수 있습니다.");
    return;
  }

  document.querySelectorAll("[data-percent-name]").forEach(input=>{
    const value=Number(input.value);
    pricePercentages[input.dataset.percentName]=Number.isFinite(value)?value:0;
  });

  const status=document.getElementById("priceSaveStatus");
  if(status)status.textContent="저장 중...";

  try{
    await setDoc(PRICE_PERCENT_REF,{
      percentages:pricePercentages,
      updatedAt:Date.now(),
      updatedBy:auth.currentUser.uid
    },{merge:true});

    renderList();
    if(selected)renderRecipe();
    const savedStatus=document.getElementById("priceSaveStatus");
    if(savedStatus)savedStatus.textContent="✅ 비율을 저장했습니다.";
  }catch(error){
    console.error(error);
    alert("비율 저장 실패. Firebase Firestore 규칙을 확인해주세요.");
    if(status)status.textContent="❌ 저장 실패";
  }
}

async function postToDiscord(message){
  const user=auth.currentUser;
  if(!user||user.uid!==ADMIN_UID){
    alert("관리자만 디스코드 전송을 사용할 수 있습니다.");
    return false;
  }
  try{
    const token=await user.getIdToken(true);
    const response=await fetch(DISCORD_PROXY_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":`Bearer ${token}`
      },
      body:JSON.stringify({content:message})
    });
    if(!response.ok)throw new Error(`${response.status} ${response.statusText}`);
    alert("디스코드로 전송했습니다.");
    return true;
  }catch(error){
    console.error("Discord 전송 실패:",error);
    alert("디스코드 전송 실패. 로그인 상태와 Worker 설정을 확인해주세요.");
    return false;
  }
}

async function sendSelectedRecipeToDiscord(){
  if(!selected||selectedCategory!=="일반 요리"){
    alert("일반 요리를 선택해주세요.");
    return;
  }
  if(!auth.currentUser||auth.currentUser.uid!==ADMIN_UID){
    alert("관리자만 디스코드 전송을 사용할 수 있습니다.");
    return;
  }
  if(!pricePercentagesLoaded){
    alert("저장된 비율을 불러오는 중입니다. 잠시 후 다시 시도해주세요.");
    return;
  }

  const adjusted=getAdjustedPrice(selected);
  const percent=Number(pricePercentages[selected]||0);
  const message=
    `🌌 **은하 요리 가격**\n`+
    `🍳 **요리명:** ${selected}\n`+
    `💰 **판매 금액:** ${formatWon(adjusted)}`+
    (percent?` (+${percent}%)`:"");

  await postToDiscord(message);
}

function selectRecipe(category,name){
  activeCategory=category;
  selectedCategory=category;
  selected=name;
  renderCategoryTabs();
  renderList();
  renderRecipe();
}

function createIngredientRow(name,need){
  const saved=ownedMaterials[name]||{sets:0,pieces:0};
  return `<tr>
    <td>${escapeHtml(name)}</td>
    <td>${formatNumber(need)}개</td>
    <td id="owned-${cssId(name)}">0개</td>
    <td><input class="num set-input" data-name="${escapeHtml(name)}" type="number" min="0" value="${Math.max(0,Number(saved.sets||0))}"></td>
    <td><input class="num piece-input" data-name="${escapeHtml(name)}" type="number" min="0" value="${Math.max(0,Number(saved.pieces||0))}"></td>
  </tr>`;
}

function renderRecipe(){
  if(!selected)return;
  const content=document.getElementById("appContent");
  const ingredients=expandRecipe(selected);
  const price=prices[selected];
  const isPriceOnly=selectedCategory==="일반 요리";
  const percent=Number(pricePercentages[selected]||0);
  const adjustedPrice=getAdjustedPrice(selected);
  let ingredientsHtml="";

  if(isPriceOnly){
    ingredientsHtml=`
      <div class="empty">
        사이트 표시 금액(원금): <strong>${formatWon(price)}</strong><br><br>
        ${isAdmin?`추가 비율: ${percent}% · 디스코드 전송 금액: ${formatWon(adjustedPrice)}`:"사이트에는 원금이 표시됩니다."}
        <br><br>일반 요리의 재료 정보는 제공되지 않아 가격만 표시합니다.
      </div>`;
  }else if(!Object.keys(ingredients).length){
    ingredientsHtml='<div class="empty">재료 정보가 없습니다.</div>';
  }else{
    ingredientsHtml=`
      <div style="overflow:auto">
        <table class="table">
          <thead><tr><th>재료</th><th>필요량</th><th>보유량</th><th>세트</th><th>낱개</th></tr></thead>
          <tbody>${Object.entries(ingredients).map(([name,need])=>createIngredientRow(name,need)).join("")}</tbody>
        </table>
      </div>`;
  }

  content.innerHTML=`
    <div class="selected">[${escapeHtml(selectedCategory)}] ${escapeHtml(selected)}</div>
    ${price?`<div class="result">💰 사이트 표시 금액 (원금)<strong>${formatWon(price)}</strong></div>`:""}
    ${isPriceOnly&&isAdmin?`
      <div class="discord-send-row">
        <button class="btn btn-discord" id="sendRecipeDiscordBtn">📢 추가 비율 적용 금액을 디스코드로 전송</button>
      </div>`:""}
    ${!isPriceOnly&&Object.keys(ingredients).length?`
      <div class="result">🍲 만들 수 있는 수량<strong id="result">0개</strong>
      <div class="note">보유 재료 기준 · 64개 = 1세트</div></div>`:""}
    ${ingredientsHtml}`;

  const sendButton=document.getElementById("sendRecipeDiscordBtn");
  if(sendButton)sendButton.addEventListener("click",sendSelectedRecipeToDiscord);

  document.querySelectorAll(".set-input,.piece-input").forEach(input=>{
    input.addEventListener("input",updateCalculation);
    input.addEventListener("keydown",handleTab);
  });
  updateCalculation();
}

function updateCalculation(){
  if(!selected)return;
  const ingredients=expandRecipe(selected);
  let possible=Infinity;

  for(const [name,need] of Object.entries(ingredients)){
    const setInput=[...document.querySelectorAll(".set-input")].find(el=>el.dataset.name===name);
    const pieceInput=[...document.querySelectorAll(".piece-input")].find(el=>el.dataset.name===name);
    if(!setInput||!pieceInput)continue;

    const sets=Math.max(0,Math.floor(Number(setInput.value)||0));
    const pieces=Math.max(0,Math.floor(Number(pieceInput.value)||0));
    ownedMaterials[name]={sets,pieces};
    const owned=sets*STACK+pieces;
    possible=Math.min(possible,Math.floor(owned/need));

    const cell=document.getElementById("owned-"+cssId(name));
    if(cell)cell.textContent=formatStack(owned);
  }

  saveOwnedMaterials();
  if(possible===Infinity)possible=0;
  currentPossibleCount=possible;
  const result=document.getElementById("result");
  if(result)result.textContent=formatStack(possible);
}

function handleTab(event){
  if(event.key!=="Tab")return;
  const inputs=[...document.querySelectorAll(".set-input,.piece-input")];
  const index=inputs.indexOf(event.target);
  if(index<0)return;
  event.preventDefault();
  const next=event.shiftKey?inputs[Math.max(0,index-1)]:inputs[Math.min(inputs.length-1,index+1)];
  next.focus();
  next.select();
}

document.getElementById("search").addEventListener("input",renderList);
document.getElementById("search").addEventListener("keydown",event=>{
  if(event.key==="Enter"){
    const first=document.querySelector(".recipe-btn");
    if(first)first.click();
  }
});

const loginBtn=document.getElementById("loginBtn");
const logoutBtn=document.getElementById("logoutBtn");
const loginSection=document.getElementById("loginSection");
const doLoginBtn=document.getElementById("doLoginBtn");
const loginStatus=document.getElementById("loginStatus");

loginBtn.addEventListener("click",()=>loginSection.classList.toggle("hidden"));
logoutBtn.addEventListener("click",async()=>signOut(auth));

doLoginBtn.addEventListener("click",async()=>{
  const email=document.getElementById("emailInput").value.trim();
  const password=document.getElementById("passwordInput").value.trim();
  loginStatus.textContent="로그인 중...";
  try{
    await signInWithEmailAndPassword(auth,email,password);
    loginStatus.textContent="";
    loginSection.classList.add("hidden");
  }catch(error){
    loginStatus.textContent="❌ 로그인 실패: "+(error.message||error);
  }
});

onAuthStateChanged(auth,async user=>{
  isAdmin=Boolean(user&&user.uid===ADMIN_UID);

  if(isAdmin){
    loginBtn.classList.add("hidden");
    logoutBtn.classList.remove("hidden");
    if(!pricePercentagesLoaded)await loadPricePercentages();
  }else{
    loginBtn.classList.remove("hidden");
    logoutBtn.classList.add("hidden");
    pricePercentagesLoaded=false;
    pricePercentages={};
  }

  renderCategoryTabs();
  renderList();
  if(selected)renderRecipe();
});

renderCategoryTabs();
renderList();
</script>
</body>
</html>
