<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>은하 요리 계산기</title>

<style>
:root{
  --bg:#080a1f;
  --panel:rgba(16,19,48,.92);
  --panel2:rgba(28,32,75,.88);
  --line:rgba(120,130,255,.22);
  --text:#f4f5ff;
  --muted:#aeb4d6;
  --accent:#8c7cff;
  --accent2:#55d8ff;
  --green:#65e6a5;
  --yellow:#ffd66b;
  --red:#ff718d;
  --shadow:0 15px 45px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:
    "Pretendard",
    "Noto Sans KR",
    Arial,
    sans-serif;
  background:
    radial-gradient(circle at 15% 15%,rgba(89,74,255,.18),transparent 28%),
    radial-gradient(circle at 85% 10%,rgba(0,203,255,.13),transparent 25%),
    radial-gradient(circle at 50% 100%,rgba(164,67,255,.13),transparent 30%),
    var(--bg);
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.45;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 1px),
    radial-gradient(circle,rgba(130,150,255,.55) 1px,transparent 1px);
  background-size:97px 97px,151px 151px;
  background-position:15px 25px,70px 90px;
}

.container{
  position:relative;
  z-index:1;
  width:min(1200px,94%);
  margin:0 auto;
  padding:30px 0 60px;
}

.header{
  text-align:center;
  margin-bottom:25px;
}

.header h1{
  margin:0;
  font-size:clamp(28px,5vw,48px);
  font-weight:900;
  letter-spacing:-2px;
  background:linear-gradient(90deg,#fff,#9e96ff,#55d8ff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 0 35px rgba(125,105,255,.3);
}

.header p{
  margin:10px 0 0;
  color:var(--muted);
}

/* =========================
   단체주문
========================= */

.order-panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:20px;
  padding:20px;
  box-shadow:var(--shadow);
  margin-bottom:20px;
  backdrop-filter:blur(12px);
}

.order-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:15px;
  flex-wrap:wrap;
}

.order-title{
  display:flex;
  align-items:center;
  gap:10px;
}

.order-title h2{
  margin:0;
  font-size:21px;
}

.order-status{
  font-size:12px;
  color:var(--muted);
}

.order-status.admin{
  color:var(--green);
}

.bonus-area{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.bonus-label{
  color:var(--muted);
  font-size:14px;
  margin-right:4px;
}

.bonus-btn{
  border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  color:var(--text);
  border-radius:10px;
  padding:8px 15px;
  cursor:pointer;
  font-weight:700;
  transition:.18s;
}

.bonus-btn:hover{
  border-color:var(--accent);
  transform:translateY(-1px);
}

.bonus-btn.active{
  background:linear-gradient(135deg,var(--accent),#5c8cff);
  border-color:transparent;
  box-shadow:0 0 18px rgba(124,109,255,.25);
}

.order-list{
  display:grid;
  gap:9px;
}

.order-row{
  display:grid;
  grid-template-columns:60px minmax(150px,1fr) minmax(130px,220px) minmax(130px,220px);
  gap:10px;
  align-items:center;
  padding:10px;
  border:1px solid rgba(130,140,255,.14);
  background:rgba(255,255,255,.025);
  border-radius:13px;
}

.order-number{
  width:40px;
  height:40px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(124,109,255,.15);
  color:#bdb6ff;
  font-weight:900;
}

.order-row input,
.order-row select{
  width:100%;
  height:42px;
  border:1px solid rgba(140,150,255,.2);
  border-radius:9px;
  outline:none;
  background:#10132e;
  color:var(--text);
  padding:0 12px;
  font-size:14px;
}

.order-row input:focus,
.order-row select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(140,124,255,.1);
}

.order-row input[readonly],
.order-row select:disabled{
  opacity:.95;
  cursor:default;
}

.order-price{
  text-align:right;
}

.order-price .original{
  font-size:12px;
  color:var(--muted);
}

.order-price .final{
  margin-top:2px;
  color:var(--green);
  font-size:17px;
  font-weight:900;
}

.order-empty{
  color:var(--muted);
  font-size:13px;
}

.admin-controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}

.btn{
  border:0;
  border-radius:10px;
  padding:10px 15px;
  color:white;
  font-weight:800;
  cursor:pointer;
  background:linear-gradient(135deg,var(--accent),#5b91ff);
  transition:.18s;
}

.btn:hover{
  transform:translateY(-1px);
  filter:brightness(1.08);
}

.btn.secondary{
  background:rgba(255,255,255,.07);
  border:1px solid var(--line);
}

.btn.danger{
  background:rgba(255,80,110,.13);
  color:#ff9caf;
  border:1px solid rgba(255,80,110,.2);
}

.login-box{
  display:none;
  margin-top:12px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(0,0,0,.15);
}

.login-box.show{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:8px;
}

.login-box input{
  min-width:0;
  height:40px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#0d1028;
  color:white;
  padding:0 11px;
  outline:none;
}

.login-message{
  grid-column:1/-1;
  color:var(--red);
  font-size:12px;
  min-height:16px;
}

/* =========================
   계산기
========================= */

.calculator{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:20px;
  padding:20px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(12px);
}

.search-area{
  position:relative;
  margin-bottom:18px;
}

.search-area input{
  width:100%;
  height:50px;
  padding:0 17px;
  border-radius:12px;
  border:1px solid var(--line);
  outline:none;
  background:#0d1028;
  color:var(--text);
  font-size:15px;
}

.search-area input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(140,124,255,.1);
}

.search-results{
  position:absolute;
  top:55px;
  left:0;
  right:0;
  max-height:300px;
  overflow:auto;
  z-index:20;
  background:#11142f;
  border:1px solid var(--line);
  border-radius:12px;
  display:none;
}

.search-results.show{
  display:block;
}

.search-result{
  padding:11px 14px;
  cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,.05);
}

.search-result:last-child{
  border-bottom:0;
}

.search-result:hover{
  background:rgba(140,124,255,.12);
}

.search-result .grade{
  font-size:11px;
  color:var(--muted);
  margin-left:5px;
}

.category-tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.category-btn{
  border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  color:var(--muted);
  border-radius:10px;
  padding:8px 14px;
  cursor:pointer;
  font-weight:800;
}

.category-btn.active{
  color:white;
  background:rgba(140,124,255,.2);
  border-color:rgba(140,124,255,.55);
}

.recipe-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:9px;
  margin-bottom:20px;
}

.recipe-btn{
  min-height:52px;
  padding:9px 11px;
  text-align:left;
  border:1px solid var(--line);
  border-radius:11px;
  background:rgba(255,255,255,.035);
  color:var(--text);
  cursor:pointer;
  transition:.18s;
}

.recipe-btn:hover{
  transform:translateY(-1px);
  border-color:rgba(140,124,255,.6);
}

.recipe-btn.active{
  background:linear-gradient(135deg,rgba(140,124,255,.28),rgba(85,216,255,.1));
  border-color:var(--accent);
  box-shadow:0 0 18px rgba(140,124,255,.12);
}

.recipe-grade{
  display:block;
  font-size:10px;
  color:var(--muted);
  margin-bottom:3px;
}

.recipe-name{
  font-weight:800;
  line-height:1.35;
}

.selected-title{
  margin:15px 0 12px;
  padding-bottom:10px;
  border-bottom:1px solid var(--line);
}

.selected-title h2{
  margin:0;
  font-size:21px;
}

.selected-title .grade{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.input-panel{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:18px;
}

.input-box{
  background:rgba(255,255,255,.035);
  border:1px solid rgba(140,150,255,.15);
  border-radius:13px;
  padding:14px;
}

.input-box label{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:7px;
}

.input-box input{
  width:100%;
  height:43px;
  border:1px solid rgba(140,150,255,.2);
  border-radius:9px;
  outline:none;
  background:#0c0f26;
  color:white;
  padding:0 12px;
  font-size:16px;
  font-weight:800;
}

.input-box input:focus{
  border-color:var(--accent);
}

.result-box{
  padding:17px;
  border:1px solid rgba(101,230,165,.2);
  border-radius:13px;
  background:rgba(101,230,165,.045);
  margin-bottom:18px;
}

.result-main{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

.result-main .label{
  color:var(--muted);
}

.result-main .value{
  color:var(--green);
  font-size:27px;
  font-weight:900;
}

.ingredients{
  display:grid;
  gap:10px;
}

.ingredient-section{
  background:rgba(255,255,255,.025);
  border:1px solid rgba(140,150,255,.13);
  border-radius:13px;
  padding:14px;
}

.ingredient-section h3{
  margin:0 0 10px;
  font-size:15px;
}

.ingredient-list{
  display:grid;
  gap:6px;
}

.ingredient{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:8px 10px;
  border-radius:8px;
  background:rgba(0,0,0,.14);
}

.ingredient-name{
  color:#dfe2ff;
}

.ingredient-count{
  font-weight:900;
  color:#fff;
  white-space:nowrap;
}

.subrecipe{
  padding:10px;
  border-radius:9px;
  background:rgba(140,124,255,.07);
  margin-bottom:7px;
}

.subrecipe:last-child{
  margin-bottom:0;
}

.subrecipe-name{
  font-weight:800;
}

.subrecipe-count{
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

.notice{
  padding:12px;
  border-radius:10px;
  background:rgba(255,214,107,.06);
  border:1px solid rgba(255,214,107,.15);
  color:#ffe6a1;
  font-size:13px;
  margin-top:10px;
}

.hidden{
  display:none!important;
}

@media(max-width:700px){
  .container{
    width:94%;
    padding-top:20px;
  }

  .order-row{
    grid-template-columns:42px 1fr;
  }

  .order-row > *:not(.order-number){
    grid-column:2;
  }

  .order-number{
    grid-row:1 / span 3;
  }

  .order-price{
    text-align:left;
  }

  .login-box.show{
    grid-template-columns:1fr;
  }

  .input-panel{
    grid-template-columns:1fr;
  }

  .recipe-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <header class="header">
    <h1>🌌 은하 요리 계산기</h1>
    <p>보유 재료를 입력하면 만들 수 있는 요리의 개수와 필요한 재료를 계산합니다.</p>
  </header>


  <!-- =========================
       단체주문
  ========================== -->
  <section class="order-panel">

    <div class="order-header">
      <div class="order-title">
        <span>📋</span>
        <h2>단체주문</h2>
      </div>

      <div id="orderStatus" class="order-status">
        주문 정보를 불러오는 중...
      </div>
    </div>


    <div class="bonus-area">
      <span class="bonus-label">판매 보너스</span>

      <button class="bonus-btn active" data-bonus="0">0%</button>
      <button class="bonus-btn" data-bonus="5">5%</button>
      <button class="bonus-btn" data-bonus="10">10%</button>
      <button class="bonus-btn" data-bonus="15">15%</button>
    </div>


    <div id="orderList" class="order-list"></div>


    <div id="adminControls" class="admin-controls hidden">
      <button id="saveOrderBtn" class="btn">
        💾 단체주문 저장
      </button>

      <button id="logoutBtn" class="btn secondary">
        관리자 로그아웃
      </button>
    </div>


    <div id="loginControls" class="admin-controls">
      <button id="loginOpenBtn" class="btn secondary">
        🔐 관리자 로그인
      </button>
    </div>


    <div id="loginBox" class="login-box">

      <input
        id="loginEmail"
        type="email"
        value="ehddnjs5157@naver.com"
        placeholder="관리자 이메일"
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="비밀번호"
      >

      <button id="loginBtn" class="btn">
        로그인
      </button>

      <div id="loginMessage" class="login-message"></div>

    </div>

  </section>


  <!-- =========================
       계산기
  ========================== -->
  <main class="calculator">

    <div class="search-area">

      <input
        id="searchInput"
        type="text"
        placeholder="🔎 요리 이름을 검색하세요..."
        autocomplete="off"
      >

      <div id="searchResults" class="search-results"></div>

    </div>


    <div id="categoryTabs" class="category-tabs"></div>

    <div id="recipeGrid" class="recipe-grid"></div>


    <div id="recipeContent" class="hidden">

      <div class="selected-title">
        <h2 id="selectedName"></h2>
        <div id="selectedGrade" class="grade"></div>
      </div>


      <div class="input-panel">

        <div class="input-box">
          <label for="setInput">보유 세트 수</label>
          <input
            id="setInput"
            type="number"
            min="0"
            step="1"
            value="0"
            data-tab-index="0"
          >
        </div>

        <div class="input-box">
          <label for="pieceInput">보유 개수</label>
          <input
            id="pieceInput"
            type="number"
            min="0"
            step="1"
            value="0"
            data-tab-index="1"
          >
        </div>

      </div>


      <div class="result-box">

        <div class="result-main">

          <div class="label">
            현재 만들 수 있는 요리
          </div>

          <div class="value">
            <span id="craftableCount">0</span>개
          </div>

        </div>

      </div>


      <div id="ingredients" class="ingredients"></div>

    </div>

  </main>

</div>

/* ============================================================
   숫자 표시
============================================================ */

function comma(value){
  return Number(value || 0).toLocaleString("ko-KR");
}


function formatStack(value){

  value = Math.floor(Number(value) || 0);

  const sets = Math.floor(value / STACK);
  const pieces = value % STACK;

  if(sets > 0 && pieces > 0){
    return `${comma(value)}개 (${comma(sets)}세트 ${comma(pieces)}개)`;
  }

  if(sets > 0){
    return `${comma(value)}개 (${comma(sets)}세트)`;
  }

  return `${comma(value)}개`;
}


/* ============================================================
   레시피 재귀 확장
============================================================ */

function findRecipe(name){

  return all.find(recipe => recipe.name === name) || null;

}


function expandRecipe(recipeName, amount, result = {}){

  const recipe = findRecipe(recipeName);

  if(!recipe){

    result[recipeName] =
      (result[recipeName] || 0) + amount;

    return result;
  }


  for(const [ingredient, qty] of Object.entries(recipe.ingredients)){

    const total = qty * amount;

    const subRecipe = findRecipe(ingredient);

    if(subRecipe){

      expandRecipe(
        ingredient,
        total,
        result
      );

    }else{

      result[ingredient] =
        (result[ingredient] || 0) + total;

    }

  }

  return result;
}

/* ============================================================
   제작 가능 개수 계산
============================================================ */

function getTotalOwned(){

  const sets =
    Math.max(0, Number(setInput.value) || 0);

  const pieces =
    Math.max(0, Number(pieceInput.value) || 0);

  return sets * STACK + pieces;

}


function calculateCraftable(recipe){

  if(!recipe){
    return 0;
  }

  /*
    현재 선택한 레시피의 재료별 보유량을
    직접 입력하는 방식이므로,
    아래에서는 입력값을 해당 레시피의 전체 필요량
    기준으로 계산한다.
  */

  const owned = getTotalOwned();

  let possible = Infinity;

  const expanded = expandRecipe(
    recipe.name,
    1,
    {}
  );

  for(const amount of Object.values(expanded)){

    if(amount <= 0){
      continue;
    }

    possible = Math.min(
      possible,
      Math.floor(owned / amount)
    );

  }

  if(possible === Infinity){
    return 0;
  }

  return possible;
}


/*
  기존 계산기의 핵심 방식은
  선택한 요리의 필요한 재료를 보여주는 것이므로
  입력한 총 보유량을 기준으로 제작 가능 개수를 계산한다.
*/
function calculate(){

  if(!selected){
    return;
  }

  const recipe = findRecipe(selected);

  if(!recipe){
    return;
  }


  const count =
    calculateCraftable(recipe);

  craftableCount.textContent =
    comma(count);


  renderIngredients(recipe, count);

}

  }


  /* 기본 재료 */

  const expanded =

    );


  const fish = {};

  for(const [name, amount] of Object.entries(expanded)){

    section.appendChild(heading);

      "ingredient-list";


    for(const [name, amount] of Object.entries(data)){

      const row =
        document.createElement("div");

      row.className =
        "ingredient";


      row.innerHTML = `
        <span class="ingredient-name">
          ${name}
        </span>
        <span class="ingredient-count">
          ${formatStack(amount)}
        </span>
      `;


      list.appendChild(row);

    }


    section.appendChild(list);

    ingredients.appendChild(section);

  }

  addSection("🌱 작물", crops);
  addSection("🧂 가공 재료", processed);

}

/* ============================================================

============================================================ */

function handleTab(event){

  if(event.key !== "Tab"){
    return;
  }

  const inputs = [
    ...document.querySelectorAll(
      ".input-box input"
    )
  ];

  const index =
    inputs.indexOf(event.target);

  if(index === -1){
    return;
  }

  event.preventDefault();

  let next;

  if(event.shiftKey){

    next =
      inputs[
        (index - 1 + inputs.length) %
        inputs.length
      ];

  }else{

    next =
      inputs[
        (index + 1) %
        inputs.length
      ];

  }

  next.focus();
  next.select();

}

  "keydown",
  handleTab
);

      const numeric =
        Number(
          String(raw)
            .replace(/,/g,"")
            .replace(/[^\d]/g,"")
        ) || 0;


      if(numeric > 0){

        priceInput.value =
          comma(numeric);

        original.textContent =
          `입력 금액 ${comma(numeric)}원`;

        final.textContent =
          `${comma(getFinalPrice(numeric))}원`;

      }else{

        original.textContent =
          "금액 미입력";

        final.textContent =
          `${currentBonus}% 적용`;

      }

    }


    updatePrice();


    if(isAdmin){

      nameSelect.disabled = false;
      priceInput.readOnly = false;


      nameSelect.addEventListener(
        "change",
        () => {

          groupFoods[i].name =
            nameSelect.value;

          scheduleOrderSave();

        }
      );


      priceInput.addEventListener(
        "input",
        () => {

          const numeric =
            priceInput.value
              .replace(/[^\d]/g,"");


          groupFoods[i].amount =
            numeric;

          updatePrice();

          scheduleOrderSave();

        }
      );


      priceInput.addEventListener(
        "blur",
        updatePrice
      );

    }else{

      nameSelect.disabled = true;
      priceInput.readOnly = true;

    }


    priceArea.appendChild(original);
    priceArea.appendChild(final);


    row.appendChild(number);
    row.appendChild(nameSelect);
    row.appendChild(priceInput);
    row.appendChild(priceArea);


    orderList.appendChild(row);

  }

}


/* ============================================================
   Firestore 저장
============================================================ */

let saveTimer = null;


function scheduleOrderSave(){

  if(!isAdmin){
    return;
  }


  clearTimeout(saveTimer);


  saveTimer =
    setTimeout(
      saveOrder,
      700
    );

}


async function saveOrder(){

  if(!isAdmin){
    return;
  }


  try{

    await setDoc(
      orderRef,
      {
        foods: groupFoods.map(food => ({
          name: String(food.name || ""),
          amount: String(food.amount || "")
        })),
        updatedAt: serverTimestamp()
      },
      {
        merge:true
      }
    );


    orderStatus.textContent =
      "저장 완료";

    orderStatus.classList.add(
      "admin"
    );


  }catch(error){

    console.error(error);

    orderStatus.textContent =
      "저장 실패";

  }

}


saveOrderBtn.addEventListener(
  "click",
  saveOrder
);


/* ============================================================
   Firestore 실시간 불러오기
============================================================ */

onSnapshot(
  orderRef,
  snapshot => {

    if(snapshot.exists()){

      const data =
        snapshot.data();


      if(Array.isArray(data.foods)){

        groupFoods =
          Array.from(
            {length:5},
            (_, index) => {

              const food =
                data.foods[index] || {};

              return {
                name:
                  String(food.name || ""),
                amount:
                  String(food.amount || "")
              };

            }
          );

      }

    }


    renderOrder();

    if(isAdmin){

      orderStatus.textContent =
        "관리자 모드 · 실시간 저장";

      orderStatus.classList.add(
        "admin"
      );

    }else{

      orderStatus.textContent =
        "실시간 주문 정보";

    }

  },
  error => {

    console.error(error);

    orderStatus.textContent =
      "주문 정보를 불러오지 못했습니다.";

  }
);


/* ============================================================
   관리자 UI
============================================================ */

function setAdminMode(value){

  isAdmin = value;

  if(isAdmin){

    adminControls.classList.remove(
      "hidden"
    );

    loginControls.classList.add(
      "hidden"
    );

    loginBox.classList.remove(
      "show"
    );

    orderStatus.textContent =
      "관리자 모드 · 수정 가능";

    orderStatus.classList.add(
      "admin"
    );

  }else{

    adminControls.classList.add(
      "hidden"
    );

    loginControls.classList.remove(
      "hidden"
    );

    orderStatus.classList.remove(
      "admin"
    );

    orderStatus.textContent =
      "실시간 주문 정보";

  }

  renderOrder();

}


onAuthStateChanged(
  auth,
  user => {

    if(
      user &&
      user.uid === ADMIN_UID
    ){

      setAdminMode(true);

    }else{

      setAdminMode(false);

    }

  }
);


/* ============================================================
   관리자 로그인
============================================================ */

loginOpenBtn.addEventListener(
  "click",
  () => {

    loginBox.classList.toggle(
      "show"
    );

    loginMessage.textContent = "";

  }
);


loginBtn.addEventListener(
  "click",
  async () => {

    const email =
      loginEmail.value.trim();

    const password =
      loginPassword.value;


    if(!email || !password){

      loginMessage.textContent =
        "이메일과 비밀번호를 입력해주세요.";

      return;

    }


    loginMessage.textContent =
      "로그인 중...";


    try{

      const credential =
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


      if(
        credential.user.uid !==
        ADMIN_UID
      ){

        await signOut(auth);

        loginMessage.textContent =
          "관리자 계정이 아닙니다.";

        return;

      }


      loginPassword.value = "";

      loginMessage.textContent = "";

      loginBox.classList.remove(
        "show"
      );


    }catch(error){

      console.error(error);

      loginMessage.textContent =
        "로그인에 실패했습니다. 이메일 또는 비밀번호를 확인해주세요.";

    }

  }
);


/* ============================================================
   관리자 로그아웃
============================================================ */

logoutBtn.addEventListener(
  "click",
  async () => {

    try{

      await signOut(auth);

    }catch(error){

      console.error(error);

    }

  }
);


/* ============================================================
   초기화
============================================================ */

renderCategories();
renderRecipeGrid();
renderOrder();

</script>
