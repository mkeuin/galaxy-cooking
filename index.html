<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>은하 요리 계산기</title>

<style>
:root{
  --bg:#080a1f; --panel:rgba(16,19,48,.88); --panel2:rgba(28,32,75,.82);
  --text:#f4f5ff; --muted:#b9bddb; --line:rgba(255,255,255,.13);
  --accent:#9b8cff; --accent2:#61d6ff;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  background:
    radial-gradient(circle at 15% 20%,rgba(111,76,255,.38),transparent 28%),
    radial-gradient(circle at 85% 25%,rgba(0,180,255,.23),transparent 25%),
    radial-gradient(circle at 50% 90%,rgba(180,50,255,.18),transparent 30%),
    linear-gradient(135deg,#050614,#101434 55%,#070818);
}

body:before,
body:after{
  position:fixed;
  top:0;
  width:50%;
  height:100%;
  pointer-events:none;
  opacity:.45;
  font-size:32px;
  letter-spacing:24px;
  line-height:140px;
  overflow:hidden;
  z-index:0;
}

body:before{
  content:"✦  ·  ✧     ·       ✦       ·  ✧      ·       ✦       ·    ✧";
  left:0;
}

body:after{
  content:"✧  ·  ✦     ·       ✧       ·  ✦       ·  ✧      ·       ✦";
  right:0;
  text-align:right;
}

.app{
  position:relative;
  z-index:1;
  max-width:1150px;
  margin:auto;
  padding:25px 16px 45px;
}

.hero{
  text-align:center;
  margin-bottom:18px;
}

.hero h1{
  margin:0;
  font-size:clamp(28px,5vw,48px);
  text-shadow:0 0 24px rgba(150,120,255,.7);
}

.hero p{
  color:var(--muted);
  margin:8px 0 0;
  font-size:17px;
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  backdrop-filter:blur(14px);
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.controls{
  padding:18px;
  margin-bottom:16px;
}

.search{
  width:100%;
  padding:16px 18px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#080a20;
  color:var(--text);
  font-size:19px;
  outline:none;
}

.recipe-list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:8px;
  margin-top:14px;
  max-height:300px;
  overflow:auto;
}

.recipe-btn{
  padding:15px;
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:12px;
  cursor:pointer;
  text-align:left;
  font-size:19px;
  font-weight:bold;
}

.recipe-btn:hover,
.recipe-btn.active{
  border-color:var(--accent2);
  box-shadow:0 0 16px rgba(97,214,255,.22);
}

.grade{
  font-size:14px;
  opacity:.75;
  display:block;
  margin-bottom:5px;
}

.content{
  padding:20px;
}

.selected{
  font-size:26px;
  font-weight:bold;
  margin:0 0 16px;
}

.result{
  padding:18px;
  border-radius:16px;
  background:linear-gradient(135deg,rgba(110,85,255,.22),rgba(55,180,255,.14));
  border:1px solid rgba(150,150,255,.28);
  margin-bottom:18px;
  font-size:18px;
}

.result strong{
  font-size:clamp(28px,4vw,42px);
  display:block;
  margin-top:6px;
}

.section-title{
  font-size:21px;
  font-weight:bold;
  margin:22px 0 10px;
}

.table{
  width:100%;
  border-collapse:collapse;
  overflow:hidden;
  border-radius:14px;
  font-size:16px;
}

th,
td{
  padding:13px 10px;
  border-bottom:1px solid var(--line);
  text-align:center;
}

th{
  color:#d9d7ff;
  background:rgba(255,255,255,.05);
  font-size:16px;
}

td:first-child{
  text-align:left;
  font-weight:bold;
}

input.num{
  width:90px;
  padding:11px;
  border-radius:9px;
  border:1px solid var(--line);
  background:#090b23;
  color:white;
  text-align:center;
  font-size:17px;
}

input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0;
}

input[type="number"]{
  -moz-appearance:textfield;
  appearance:textfield;
}

.owned{
  white-space:nowrap;
}

.subrecipes{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:8px;
}

.sub{
  padding:13px 14px;
  border-radius:10px;
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  font-size:16px;
}

.note{
  color:var(--muted);
  font-size:14px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px;
  font-size:18px;
}

.category-row td{
  text-align:left!important;
  font-size:18px!important;
  font-weight:bold!important;
  padding:14px 12px!important;
  background:rgba(255,255,255,.08);
  border-top:1px solid var(--line);
}

/* =========================
   단체주문
========================= */

.group-order-card{
  padding:20px;
  margin-bottom:16px;
}

.group-order-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:18px;
}

.group-order-header h2{
  margin:0 0 5px;
  font-size:24px;
}

.group-order-header p{
  margin:0;
  color:var(--muted);
}

.admin-btn,
.save-btn{
  border:none;
  border-radius:10px;
  padding:12px 18px;
  cursor:pointer;
  color:white;
  font-size:16px;
  font-weight:bold;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}

.admin-btn:disabled,
.save-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.logout-btn{
  background:rgba(255,255,255,.12);
}

.discord-btn{
  background:linear-gradient(135deg,#5865F2,#7289DA);
}

.login-box{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:8px;
  margin-bottom:15px;
}

.login-box input,
.group-food input{
  width:100%;
  padding:12px;
  border-radius:9px;
  border:1px solid var(--line);
  background:#090b23;
  color:white;
  font-size:16px;
}

.group-order-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
  margin-bottom:14px;
}

.group-food{
  padding:14px;
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(255,255,255,.04);
}

.group-food label{
  display:block;
  margin-bottom:8px;
  color:#d9d7ff;
  font-weight:bold;
}

.group-food input{
  margin-bottom:7px;
}

.group-order-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.group-order-actions button{
  flex:1;
  min-width:180px;
}

.group-order-view{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
}

.group-order-item{
  padding:15px;
  border-radius:12px;
  background:rgba(110,85,255,.14);
  border:1px solid rgba(150,150,255,.22);
}

.group-order-item strong{
  display:block;
  font-size:18px;
  margin-bottom:7px;
}

.order-price{
  margin-top:6px;
  color:#d9d7ff;
}

.order-price-final{
  margin-top:5px;
  font-weight:bold;

}

.percent-toggle{
  display:flex;
  align-items:center;
  gap:10px;
  margin:12px 0 14px;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:10px;
  background:rgba(255,255,255,.04);
}

.percent-toggle input{
  width:20px;
  height:20px;
  accent-color:#9b8cff;
}

.percent-badge{
  display:inline-block;
  padding:3px 8px;
  border-radius:20px;
  background:rgba(155,140,255,.18);
  font-size:13px;
  margin-left:6px;
}

@media(max-width:700px){
  .app{
    padding:14px 8px 30px;

  .table{

  }

  input.num{

  }

  .recipe-btn{
    font-size:18px;
  }

  body:before,
  body:after{
    font-size:24px;
    letter-spacing:14px;
    line-height:110px;
  }

  .group-order-header{
    flex-direction:column;
    align-items:flex-start;
  }

  .login-box{
    grid-template-columns:1fr;
  }

  .group-order-actions{
    flex-direction:column;
  }

  .group-order-actions button{
    width:100%;
    min-width:0;
  }
}
</style>
</head>

/* =========================
   전체 레시피
========================= */

const all={};

Object.values(recipes)
  .forEach(group=>Object.assign(all,group));

let selected=null;
let selectedGrade=null;


/* =========================
   레시피 확장
========================= */

function expandRecipe(
  name,
  amount=1,
  result={}
){

  if(!all[name]){
    return result;
  }

  for(
    const [item,need]
    of Object.entries(all[name])
  ){

    const total=need*amount;

    if(all[item]){
      expandRecipe(
        item,
        total,
        result
      );
    }
    else{
      result[item]=
        (result[item]||0)+total;
    }

  }

  return result;
}


/* =========================
   세트 표시
========================= */

function formatStack(n){

  const sets=Math.floor(n/STACK);
  const pieces=n%STACK;

  if(sets&&pieces){
    return `${n.toLocaleString()}개 (${sets}세트 + ${pieces}개)`;
  }

  if(sets){
    return `${n.toLocaleString()}개 (${sets}세트)`;
  }

  return `${n.toLocaleString()}개`;
}


/* =========================
   재료 분류
========================= */

const FISH=[
  "요정 피쉬",
  "엔젤 피쉬",
  "다크 피쉬",
  "고스트 피쉬",
  "홀로그램 피쉬"
];

const CROPS=[
  "마나블라썸",
  "피치가지",
  "젤리버섯",
  "팬텀 양배추",
  "레드펄 양파",
  "슬라임 콜라비",
  "엔더 콩",
  "초승달 무"
];

function getIngredientCategory(name){

  return FISH.includes(name)
    ? 1
    : CROPS.includes(name)
      ? 2
      : 3;
}

function getCategoryName(c){

  return c===1
    ? "🐟 피쉬"
    : c===2
      ? "🌱 작물"
      : "🧂 가공재료";
}


/* =========================
   CSS ID
========================= */

function cssId(name){

  return btoa(
    unescape(
      encodeURIComponent(name)
    )
  ).replace(
    /[^a-zA-Z0-9]/g,
    ""
  );
}


/* =========================
   재료 행
========================= */

function createIngredientRow(
  name,
  need
){

  return `<tr>
    <td>${name}</td>
    <td>${need}개</td>
    <td class="owned"
        id="owned-${cssId(name)}">
      0개
    </td>
    <td>
      <input
        class="num set-input"
        data-name="${name}"
        type="number"
        min="0"
        value="0">
    </td>
    <td>
      <input
        class="num piece-input"
        data-name="${name}"
        type="number"
        min="0"
        value="0">
    </td>
  </tr>`;
}


/* =========================
   재료 그룹 행
========================= */

function createGroupedIngredientRows(
  ingredients
){

  const groups={
    1:[],
    2:[],
    3:[]
  };

  Object.entries(ingredients)
    .forEach(([name,need])=>{
      groups[
        getIngredientCategory(name)
      ].push([name,need]);
    });

  let html="";

  for(let c=1;c<=3;c++){

    if(!groups[c].length)continue;

    groups[c].sort(
      ([a],[b])=>
        a.localeCompare(b,"ko")
    );

    html+=`
      <tr class="category-row">
        <td colspan="5">
          ${getCategoryName(c)}
        </td>
      </tr>
    `;

    groups[c].forEach(
      ([name,need])=>{
        html+=createIngredientRow(
          name,
          need
        );
      }
    );
  }

  return html;
}


/* =========================
   요리 목록
========================= */

function renderList(){

  const q=
    document.getElementById("search")
      .value
      .trim()
      .toLowerCase();

  const list=
    document.getElementById("recipeList");

  list.innerHTML="";

  for(
    const [grade,group]
    of Object.entries(recipes)
  ){

    for(
      const name
      of Object.keys(group)
    ){

      if(
        (grade+" "+name)
          .toLowerCase()
          .includes(q)
      ){

        const button=
          document.createElement("button");

        button.className=
          "recipe-btn"+
          (selected===name
            ? " active"
            : "");

        button.innerHTML=
          `<span class="grade">
             ${grade}
           </span>
           ${name}`;

        button.onclick=()=>
          selectRecipe(
            grade,
            name
          );

        list.appendChild(button);
      }
    }
  }
}


/* =========================
   요리 선택
========================= */

function selectRecipe(
  grade,
  name
){

  selected=name;
  selectedGrade=grade;

  renderList();
  renderRecipe();
}


/* =========================
   요리 화면
========================= */

function renderRecipe(){

  if(!selected)return;

  const content=
    document.getElementById("appContent");

  const isHighGrade=
    selectedGrade==="전설" ||
    selectedGrade==="신화";

  const ingredients=
    isHighGrade
      ? expandRecipe(selected)
      : all[selected];

  const sub=
    isHighGrade
      ? all[selected]
      : null;

  let subHtml="";

  if(sub){

    subHtml=`
      <div class="section-title">
        🥘 필요한 하위 요리
      </div>

      <div class="subrecipes">

        ${
          Object.entries(sub)
            .map(
              ([name,amount])=>
                `<div class="sub">
                  ${name} × ${amount}
                </div>`
            )
            .join("")
        }

      </div>

      <div class="section-title">
        📋 실제 기본 재료
      </div>
    `;
  }

  const rows=
    isHighGrade
      ? createGroupedIngredientRows(
          ingredients
        )
      : Object.entries(ingredients)
          .map(
            ([name,need])=>
              createIngredientRow(
                name,
                need
              )
          )
          .join("");

  content.innerHTML=`

    <div class="selected">
      [${selectedGrade}] ${selected}
    </div>

    <div class="result">

      <span>
        🍲 만들 수 있는 요리
      </span>

      <strong id="result">
        0개
      </strong>

      <div id="orderMoneyResult"></div>

    </div>

    ${subHtml}

    <div style="overflow:auto">

      <table class="table">

        <thead>
          <tr>
            <th>재료</th>
            <th>요리 1개 필요량</th>
            <th>보유량</th>
            <th>세트</th>
            <th>낱개</th>
          </tr>
        </thead>

        <tbody>
          ${rows}
        </tbody>

      </table>

    </div>
  `;

  document
    .querySelectorAll(
      ".set-input,.piece-input"
    )
    .forEach(el=>{

      el.addEventListener(
        "input",
        updateCalculation
      );

      el.addEventListener(
        "keydown",
        handleTab
      );

    });

  updateCalculation();
}


/* =========================
   단체주문 가격 찾기
========================= */

function getGroupOrderPrice(
  recipeName
){

  const found=
    groupOrderData.find(
      food=>
        food.name &&
        food.name.trim()===recipeName
    );

  if(!found)return null;

  const price=
    Math.max(
      0,
      Number(found.amount)||0
    );

  return price;
}


/* =========================
   원화 표시
========================= */

function formatWon(n){

  return (
    Math.round(n)
      .toLocaleString()
    + "원"
  );
}


/* =========================
   계산
========================= */

function updateCalculation(){

  if(!selected)return;

  const req=
    (
      selectedGrade==="전설" ||
      selectedGrade==="신화"
    )
      ? expandRecipe(selected)
      : all[selected];

  let possible=Infinity;

  for(
    const [name,need]
    of Object.entries(req)
  ){

    const setInput=
      document.querySelector(
        `.set-input[data-name="${CSS.escape(name)}"]`
      );

    const pieceInput=
      document.querySelector(
        `.piece-input[data-name="${CSS.escape(name)}"]`
      );

    if(!setInput||!pieceInput)continue;

    const sets=
      Math.max(
        0,
        Number(setInput.value)||0
      );

    const pieces=
      Math.max(
        0,
        Number(pieceInput.value)||0
      );

    const owned=
      Math.floor(sets)*STACK+
      Math.floor(pieces);

    possible=
      Math.min(
        possible,
        Math.floor(
          owned/need
        )
      );

    const cell=
      document.getElementById(
        "owned-"+cssId(name)
      );

    if(cell){
      cell.textContent=
        formatStack(owned);
    }
  }

  if(possible===Infinity){
    possible=0;
  }

  document.getElementById(
    "result"
  ).textContent=
    formatStack(possible);


  /* =========================
     단체주문 금액 계산

     음식 개수 × 음식 1개당 주문 금액

     15%는 금액에만 적용
  ========================= */

  const moneyBox=
    document.getElementById(
      "orderMoneyResult"
    );

  if(moneyBox){

    const unitPrice=
      getGroupOrderPrice(
        selected
      );

    if(unitPrice!==null){

      const original=
        possible*unitPrice;

      const finalAmount=
        groupOrderPercentEnabled
          ? Math.round(
              original*1.15
            )
          : original;

      moneyBox.innerHTML=`

        <div
          class="section-title"
          style="margin:14px 0 4px">
          💰 단체주문 금액
        </div>

        <div>
          주문 금액
          ${formatWon(unitPrice)}
          ×
          ${possible.toLocaleString()}개
          =
          <b>
            ${formatWon(original)}
          </b>
        </div>

        ${
          groupOrderPercentEnabled
            ? `
              <div class="order-price-final">
                15% 적용 →
                ${formatWon(finalAmount)}
              </div>
            `
            : `
              <div class="note">
                15% 미적용
              </div>
            `
        }

      `;

    }
    else{

      moneyBox.innerHTML=`

        <div
          class="note"
          style="margin-top:12px">

          📦 이 음식의 단체주문 금액이
          등록되어 있지 않습니다.

        </div>

      `;
    }
  }
}


/* =========================
   Tab 이동
========================= */

function handleTab(e){

  if(e.key!=="Tab")return;

  const inputs=[
    ...document.querySelectorAll(
      ".set-input,.piece-input"
    )
  ];

  const index=
    inputs.indexOf(e.target);

  if(index<0)return;

  e.preventDefault();

  const next=
    e.shiftKey
      ? inputs[
          Math.max(
            0,
            index-1
          )
        ]
      : inputs[
          Math.min(
            inputs.length-1,
            index+1
          )
        ];

  next.focus();
  next.select();
}

   검색
========================= */

document

    "input",
    renderList
  );

document

  .addEventListener(
    "keydown",
    e=>{

      if(e.key==="Enter"){

        const first=
          document.querySelector(
            ".recipe-btn"
          );

        if(first){
          first.click();
        }
      }

    }
  );


/* =========================
   숫자 입력
========================= */

document.addEventListener(
  "focusin",
  e=>{

    if(
      e.target.matches(
        'input[type="number"]'
      )
    ){

      setTimeout(()=>{

        if(
          Number(e.target.value)===0
        ){
          e.target.select();
        }

      },0);
    }

  }
);


document.addEventListener(
  "focusout",
  e=>{

    if(
      e.target.matches(
        'input[type="number"]'
      )
    ){

      if(e.target.value===""){
        e.target.value="0";
      }

      if(
        e.target.matches(
          ".set-input,.piece-input"
        )
      ){
        updateCalculation();
      }

    }

  }
);

  const div=
    document.createElement(
      "div"
    );

  div.textContent=text;

  return div.innerHTML;
}

/* =========================
   Discord용 레시피 등급 찾기
========================= */

function getRecipeGrade(name){

  for(
    const [grade,group]
    of Object.entries(recipes)
  ){

    if(
      Object.prototype.hasOwnProperty.call(
        group,
        name
      )
    ){
      return grade;
    }

  }

  return null;
}


/* =========================
   Discord용 실제 기본 재료
========================= */

function getRecipeIngredientsForDiscord(name){

  if(!all[name]){
    return [];
  }

  const grade=
    getRecipeGrade(name);

  const ingredients=
    grade==="전설" ||
    grade==="신화"
      ? expandRecipe(name)
      : all[name];

  return Object.entries(
    ingredients
  ).map(
    ([ingredientName,amount])=>({

      name:ingredientName,

      amount:
        Number(amount)||0

    })
  );

}


/* =========================
   현재 입력된 단체주문 가져오기
========================= */

function getCurrentGroupOrderForDiscord(){

  const foods=[];

  for(let i=0;i<5;i++){

    const nameInput=
      document.querySelector(
        `.group-food-name[data-index="${i}"]`
      );

    const amountInput=
      document.querySelector(
        `.group-food-amount[data-index="${i}"]`
      );

    if(!nameInput||!amountInput){
      continue;
    }

    const name=
      nameInput.value
        .trim();

    const amount=
      Math.max(
        0,
        Number(
          amountInput.value
        )||0
      );

    if(!name){
      continue;
    }

    foods.push({

      name,

      amount,

      ingredients:
        getRecipeIngredientsForDiscord(
          name
        )

    });

  }

  return foods;
}


/* =========================
   Discord 전송
========================= */

async function sendGroupOrderToDiscord(){

  if(!isAdmin){

    alert(
      "관리자만 디스코드 전송을 사용할 수 있습니다."
    );

    return;
  }

  if(
    !auth ||
    !currentFirebaseUser
  ){

    alert(
      "관리자 로그인 정보를 확인할 수 없습니다.\n다시 로그인해주세요."
    );

    return;
  }

  const foods=
    getCurrentGroupOrderForDiscord();

  if(!foods.length){

    alert(
      "전송할 음식이 없습니다."
    );

    return;
  }


  /* =========================
     레시피 이름 확인
  ========================= */

  const invalidFoods=
    foods.filter(
      food=>!all[food.name]
    );

  if(invalidFoods.length){

    const names=
      invalidFoods
        .map(
          food=>`• ${food.name}`
        )
        .join("\n");

    alert(
      "레시피를 찾을 수 없는 음식이 있습니다.\n\n"+
      names+
      "\n\n레시피 목록에 등록된 이름과 정확히 일치해야 합니다."
    );

    return;
  }


  const sendBtn=
    document.getElementById(
      "sendDiscordBtn"
    );

  const originalText=
    sendBtn
      ? sendBtn.textContent
      : "";


  if(sendBtn){

    sendBtn.disabled=true;

    sendBtn.textContent=
      "📨 전송 중...";

  }


  try{

    /* =========================
       Firebase 로그인 토큰
    ========================= */

    const idToken=
      await currentFirebaseUser.getIdToken();


    /* =========================
       Worker로 전송
    ========================= */

    const response=
      await fetch(
        DISCORD_WORKER_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "Authorization":
              `Bearer ${idToken}`
          },

          body:
            JSON.stringify({
              foods
            })
        }
      );


    let result={};

    try{

      result=
        await response.json();

    }
    catch(error){

      result={};

    }


    if(
      !response.ok ||
      !result.ok
    ){

      console.error(
        "Discord 전송 실패:",
        response.status,
        result
      );

      alert(
        "디스코드 전송에 실패했습니다.\n"+
        (
          result.error ||
          `HTTP ${response.status}`
        )
      );

      return;
    }


    alert(
      "디스코드 전송이 완료되었습니다!"
    );

  }
  catch(error){

    console.error(
      "Discord 전송 오류:",
      error
    );

    alert(
      "디스코드 전송 중 오류가 발생했습니다.\n"+
      "잠시 후 다시 시도해주세요."
    );

  }
  finally{

    if(sendBtn){

      sendBtn.disabled=false;

      sendBtn.textContent=
        originalText;

    }

  }

}


/* =========================
   Firebase 연결 후
   단체주문 감시
========================= */

function setupGroupOrderFirebase(){

  if(
    !db ||
    !doc ||
    !onSnapshot
  ){
    return;
  }

  groupOrderRef=
    doc(
      db,
      "cookingOrder",
      "main"
    );


  onSnapshot(
    groupOrderRef,
    snapshot=>{

      if(snapshot.exists()){

        const data=
          snapshot.data();


        if(
          Array.isArray(
            data.foods
          )
        ){

          groupOrderData=
            Array.from(
              {length:5},
              (_,i)=>({

                name:
                  data.foods[i]?.name ||
                  "",

                amount:
                  Number(
                    data.foods[i]?.amount
                  ) || 0

              })
            );

          groupOrderPercentEnabled=
            Boolean(
              data.percent15
            );
        }
      }


      renderGroupOrderView();


      if(isAdmin){
        fillGroupOrderEditor();
      }


      if(!isAdmin){

        document.getElementById(
          "groupOrderStatus"
        ).textContent=
          "👀 단체주문 내용을 확인할 수 있습니다.";

      }


      if(selected){
        updateCalculation();
      }

    },
    error=>{

      console.error(error);

      document.getElementById(
        "groupOrderStatus"
      ).textContent=
        "⚠️ 단체주문을 불러오지 못했습니다.";

  );

/* =========================
   단체주문 저장
========================= */

document
  .getElementById("saveGroupOrder")
  .addEventListener(
    "click",
    async()=>{

      if(!isAdmin){

        alert(
          "관리자만 수정할 수 있습니다."
        );

        return;
      }


      if(
        !groupOrderRef ||
        !setDoc
      ){

        alert(
          "Firebase 연결을 기다리는 중입니다. 잠시 후 다시 시도해주세요."
        );

        return;
      }


      const foods=[];


      for(let i=0;i<5;i++){

        const name=
          document.querySelector(
            `.group-food-name[data-index="${i}"]`
          )
          .value
          .trim();


        const amount=
          Math.max(
            0,
            Number(
              document.querySelector(
                `.group-food-amount[data-index="${i}"]`
              ).value
            ) || 0
          );


        foods.push({
          name,
          amount
        });

      }


      try{

        groupOrderPercentEnabled=
          document.getElementById(
            "groupOrderPercent"
          ).checked;


        await setDoc(
          groupOrderRef,
          {
            foods,
            percent15:
              groupOrderPercentEnabled,
            updatedAt:
              new Date().toISOString()
          },
          {
            merge:true
          }
        );


        renderGroupOrderView();

        if(selected){
          updateCalculation();
        }


        alert(
          "단체주문이 저장되었습니다!"
        );

      }
      catch(error){

        console.error(error);

        alert(
          "저장에 실패했습니다.\nFirestore 규칙과 관리자 UID를 확인해주세요."
        );

      }

    }
  );

/* =========================

========================= */

async function initFirebase(){

  try{

    const appModule=
      await import(
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"
      );

    const authModule=
      await import(
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"
      );

    const firestoreModule=
      await import(
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
      );


    initializeApp=
      appModule.initializeApp;

    getAuth=
      authModule.getAuth;

    signInWithEmailAndPassword=
      authModule.signInWithEmailAndPassword;

    signOut=
      authModule.signOut;

    onAuthStateChanged=
      authModule.onAuthStateChanged;

    getFirestore=
      firestoreModule.getFirestore;

    doc=
      firestoreModule.doc;

    setDoc=
      firestoreModule.setDoc;

    onSnapshot=
      firestoreModule.onSnapshot;


    const firebaseApp=
      initializeApp(
        firebaseConfig
      );


    auth=
      getAuth(
        firebaseApp
      );


    db=
      getFirestore(
        firebaseApp
      );


    setupGroupOrderFirebase();


    onAuthStateChanged(
      auth,
      user=>{

        /* =========================
           현재 Firebase 사용자 저장
        ========================= */

        currentFirebaseUser=
          user || null;


        const editor=
          document.getElementById(
            "groupOrderEditor"
          );

        const loginBtn=
          document.getElementById(
            "loginBtn"
          );

        const logoutBtn=
          document.getElementById(
            "logoutBtn"
          );

        const loginBox=
          document.getElementById(
            "loginBox"
          );

        const sendDiscordBtn=
          document.getElementById(
            "sendDiscordBtn"
          );

        const status=
          document.getElementById(
            "groupOrderStatus"
          );


        if(
          user &&
          user.uid===ADMIN_UID
        ){

          isAdmin=true;

          editor.style.display=
            "block";

          loginBtn.style.display=
            "none";

          logoutBtn.style.display=
            "inline-block";

          sendDiscordBtn.style.display=
            "inline-block";

          loginBox.style.display=
            "none";

          status.textContent=
            "🔓 관리자 모드 - 단체주문을 수정할 수 있습니다.";

          fillGroupOrderEditor();

        }
        else{

          isAdmin=false;

          editor.style.display=
            "none";

          loginBtn.style.display=
            "inline-block";

          logoutBtn.style.display=
            "none";

          sendDiscordBtn.style.display=
            "none";

          loginBox.style.display=
            "none";

          status.textContent=
            "👀 단체주문 내용을 확인할 수 있습니다.";

          if(user){

            alert(
              "관리자 계정이 아닙니다.\n보기만 가능합니다."
            );

          }

        }

      }
    );

  }
  catch(error){

    console.error(
      "Firebase 연결 오류:",
      error
    );

    document.getElementById(
      "groupOrderStatus"
    ).textContent=
      "⚠️ Firebase 연결 실패 - 계산기는 계속 사용할 수 있습니다.";

    renderGroupOrderView();

  }

}


/* =========================
   초기 실행
========================= */

renderGroupOrderEditor();

renderList();

initFirebase();

</script>
