<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>은하 요리 계산기</title>
<style>
:root{
  --bg:#080a1f;
  --panel:rgba(16,19,48,.88);
  --panel2:rgba(28,32,75,.82);
  --text:#f4f5ff;
  --muted:#b9bddb;
  --line:rgba(255,255,255,.13);
  --accent:#9b8cff;
  --accent2:#61d6ff;
  --success:#68e0a0;
  --danger:#ff647c;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  background:
    radial-gradient(circle at 15% 20%,rgba(111,76,255,.38),transparent 28%),
    radial-gradient(circle at 85% 25%,rgba(0,180,255,.23),transparent 25%),
    radial-gradient(circle at 50% 90%,rgba(180,50,255,.18),transparent 30%),
    linear-gradient(135deg,#050614,#101434 55%,#070818);
}
body:before{
  content:"✦ · ✧     ·       ✦       · ✧      ·       ✦       · ✧";
  position:fixed;
  left:0;
  top:0;
  width:50%;
  height:100%;
  pointer-events:none;
  opacity:.45;
  font-size:32px;
  letter-spacing:24px;
  line-height:140px;
  overflow:hidden;
  z-index:0;
}
body:after{
  content:"✧ · ✦     ·       ✧       · ✦       · ✧      ·       ✦";
  position:fixed;
  right:0;
  top:0;
  width:50%;
  height:100%;
  pointer-events:none;
  opacity:.45;
  font-size:32px;
  letter-spacing:24px;
  line-height:140px;
  overflow:hidden;
  text-align:right;
  z-index:0;
}
.app{
  position:relative;
  z-index:1;
  max-width:1150px;
  margin:auto;
  padding:25px 16px 45px;
}
.hero{
  text-align:center;
  margin-bottom:18px;
}
.hero h1{
  margin:0;
  font-size:clamp(28px,5vw,48px);
  text-shadow:0 0 24px rgba(150,120,255,.7);
}
.hero p{
  color:var(--muted);
  margin:8px 0 0;
  font-size:17px;
}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  backdrop-filter:blur(14px);
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.controls{
  padding:18px;
  margin-bottom:16px;
}
.search{
  width:100%;
  padding:16px 18px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#080a20;
  color:var(--text);
  font-size:19px;
  outline:none;
}
.recipe-list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:8px;
  margin-top:14px;
  max-height:300px;
  overflow:auto;
}
.recipe-btn{
  padding:15px;
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:12px;
  cursor:pointer;
  text-align:left;
  font-size:19px;
  font-weight:bold;
}
.recipe-btn:hover,
.recipe-btn.active{
  border-color:var(--accent2);
  box-shadow:0 0 16px rgba(97,214,255,.22);
}
.grade{
  font-size:14px;
  opacity:.75;
  display:block;
  margin-bottom:5px;
