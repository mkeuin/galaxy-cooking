<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>음식 계산기</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      line-height: 1.6;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: inline-block;
      width: 140px;
      font-weight: bold;
    }
    input, select {
      padding: 5px;
      width: 150px;
    }
    button {
      padding: 8px 16px;
      margin-top: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    .result-box {
      margin-top: 20px;
      padding: 15px;
      background-color: #f9f9f9;
      border: 1px solid #ccc;
      white-space: pre-line;
      font-family: monospace, monospace;
    }
  </style>
</head>
<body>

  <h2>음식 주문 & 협동 선택</h2>

  <div class="form-group">
    <label for="dateInput">날짜 선택:</label>
    <input type="date" id="dateInput">
  </div>

  <div class="form-group">
    <label for="coopSelect">협동 선택:</label>
    <select id="coopSelect">
      <option value="채광">채광</option>
      <option value="벌목">벌목</option>
      <option value="농사">농사</option>
      <option value="낚시" selected>낚시</option>
    </select>
  </div>

  <hr>

  <h3>음식 정보 입력</h3>
  <div id="foodInputs">
    <!-- A~E 음식 입력 필드 -->
    <script>
      const foods = ['A', 'B', 'C', 'D', 'E'];
      foods.forEach(letter => {
        document.write(`
          <div class="form-group">
            <label>${letter} 음식 이름:</label>
            <input type="text" id="name_${letter}" placeholder="예: ${letter} 음식">
            <label style="width: auto;">금액:</label>
            <input type="number" id="price_${letter}" placeholder="금액">
            <label style="width: auto;">재료:</label>
            <input type="text" id="ing_${letter}" placeholder="재료 입력">
          </div>
        `);
      });
    </script>
  </div>

  <button onclick="generateOutput()">양식 출력하기</button>

  <h3>출력 결과</h3>
  <div id="result" class="result-box">버튼을 누르면 결과가 여기에 표시됩니다.</div>

  <script>
    // 오늘 날짜를 YYYY-MM-DD 형식으로 설정
    document.getElementById('dateInput').value = new Date().toISOString().substring(0, 10);

    function generateOutput() {
      const dateVal = document.getElementById('dateInput').value;
      const coopVal = document.getElementById('coopSelect').value;

      let month = '';
      let day = '';

      if (dateVal) {
        const parts = dateVal.split('-');
        month = parseInt(parts[1], 10) + '월';
        day = parseInt(parts[2], 10) + '일';
      }

      const foods = ['A', 'B', 'C', 'D', 'E'];
      let foodSection = '';

      foods.forEach(letter => {
        const name = document.getElementById(`name_${letter}`).value.trim() || `${letter} 음식`;
        const price = document.getElementById(`price_${letter}`).value.trim();
        const priceStr = price ? `${Number(price).toLocaleString()}원` : '금액';
        const ing = document.getElementById(`ing_${letter}`).value.trim() || '재료';

        foodSection += `${name} :  ${priceStr}\n${ing}\n\n`;
      });

      const output = `${month} ${day}
부스트 종목은
${coopVal}!!(납품 점수 3배 적용!)
--------------------------------------------------
${foodSection.trim()}`;

      document.getElementById('result').textContent = output;
    }
  </script>

</body>
</html>
