<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>은하 요리 계산기</title>
<style>
:root{
  --bg:#080a1f;
  --panel:rgba(16,19,48,.88);
  --panel2:rgba(28,32,75,.82);
  --text:#f4f5ff;
  --muted:#b9bddb;
  --line:rgba(255,255,255,.13);
  --accent:#9b8cff;
  --accent2:#61d6ff;
  --success:#68e0a0;
  --danger:#ff647c;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  background:
    radial-gradient(circle at 15% 20%,rgba(111,76,255,.38),transparent 28%),
    radial-gradient(circle at 85% 25%,rgba(0,180,255,.23),transparent 25%),
    radial-gradient(circle at 50% 90%,rgba(180,50,255,.18),transparent 30%),
    linear-gradient(135deg,#050614,#101434 55%,#070818);
}
body:before{
  content:"✦ · ✧        ·        ✦        · ✧     ·        ✦        · ✧";
  position:fixed;
  left:0;
  top:0;
  width:50%;
  height:100%;
  pointer-events:none;
  opacity:.45;
  font-size:32px;
  letter-spacing:24px;
  line-height:140px;
  overflow:hidden;
  z-index:0;
}
body:after{
  content:"✧ · ✦        ·        ✧        · ✦        · ✧     ·        ✦";
  position:fixed;
  right:0;
  top:0;
  width:50%;
  height:100%;
  pointer-events:none;
  opacity:.45;
  font-size:32px;
  letter-spacing:24px;
  line-height:140px;
  overflow:hidden;
  text-align:right;
  z-index:0;
}
.app{
  position:relative;
  z-index:1;
  max-width:1150px;
  margin:auto;
  padding:25px 16px 45px;
}
.hero{
  text-align:center;
  margin-bottom:18px;
}
.hero h1{
  margin:0;
  font-size:clamp(28px,5vw,48px);
  text-shadow:0 0 24px rgba(150,120,255,.7);
}
.hero p{
  color:var(--muted);
  margin:8px 0 0;
  font-size:17px;
}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  backdrop-filter:blur(14px);
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.controls{
  padding:18px;
  margin-bottom:16px;
}
.search{
  width:100%;
  padding:16px 18px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#080a20;
  color:var(--text);
  font-size:19px;
  outline:none;
}
.recipe-list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:8px;
  margin-top:14px;
  max-height:300px;
  overflow:auto;
}
.recipe-btn{
  padding:15px;
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:12px;
  cursor:pointer;
  text-align:left;
  font-size:19px;
  font-weight:bold;
}
.recipe-btn:hover,
.recipe-btn.active{
  border-color:var(--accent2);
  box-shadow:0 0 16px rgba(97,214,255,.22);
}
.grade{
  font-size:14px;
  opacity:.75;
  display:block;
  margin-bottom:5px;
}
.content{padding:20px}
.selected{
  font-size:26px;
  font-weight:bold;
  margin:0 0 16px;
}
.result{
  padding:18px;
  border-radius:16px;
  background:linear-gradient(135deg,rgba(110,85,255,.22),rgba(55,180,255,.14));
  border:1px solid rgba(150,150,255,.28);
  margin-bottom:18px;
  font-size:18px;
}
.result strong{
  font-size:clamp(28px,4vw,42px);
  display:block;
  margin-top:6px;
}
.section-title{
  font-size:21px;
  font-weight:bold;
  margin:22px 0 10px;
}
.table{
  width:100%;
  border-collapse:collapse;
  overflow:hidden;
  border-radius:14px;
  font-size:16px;
}
th,td{
  padding:13px 10px;
  border-bottom:1px solid var(--line);
  text-align:center;
}
th{
  color:#d9d7ff;
  background:rgba(255,255,255,.05);
}
td:first-child{
  text-align:left;
  font-weight:bold;
}
input.num{
  width:90px;
  padding:11px;
  border-radius:9px;
  border:1px solid var(--line);
  background:#090b23;
  color:white;
  text-align:center;
  font-size:17px;
}
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0;
}
input[type="number"]{
  -moz-appearance:textfield;
  appearance:textfield;
}
.owned{white-space:nowrap}
.subrecipes{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:8px;
}
.sub{
  padding:13px 14px;
  border-radius:10px;
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  font-size:16px;
}
.note{
  color:var(--muted);
  font-size:14px;
}
.empty{
  text-align:center;
  color:var(--muted);
  padding:30px;
  font-size:18px;
}
.category-row td{
  text-align:left!important;
  font-size:18px!important;
  font-weight:bold!important;
  padding:14px 12px!important;
  background:rgba(255,255,255,.08);
}
.top-actions{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:15px;
  flex-wrap:wrap;
}
.btn{
  border:1px solid var(--line);
  background:rgba(255,255,255,.07);
  color:white;
  padding:11px 16px;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
}
.btn:hover{filter:brightness(1.15)}
.btn-primary{
  background:rgba(155,140,255,.25);
  border-color:rgba(155,140,255,.6);
}
.btn-success{
  background:rgba(104,224,160,.14);
  border-color:rgba(104,224,160,.4);
}
.btn-danger{
  background:rgba(255,100,124,.14);
  border-color:rgba(255,100,124,.4);
}
.btn-discord{
  background:rgba(88,101,242,.3);
  border-color:rgba(88,101,242,.7);
  color:#fff;
  font-weight:bold;
}
.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}
.hidden{display:none!important}
@media(max-width:700px){
  .app{padding:14px 8px 30px}
  .content,.controls{padding:13px}
  th:nth-child(2),
  td:nth-child(2){display:none}
  .table{font-size:13px}
  input.num{width:60px}
  .recipe-btn{font-size:18px}
  body:before,
  body:after{
    font-size:24px;
    letter-spacing:14px;
    line-height:110px;
  }
  .login-row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <h1>🌌 은하 요리 계산기 🍳</h1>
    <p>64개 = 1세트 · 보유 재료를 세트 + 낱개로 입력하세요</p>
    <div class="top-actions">
      <button class="btn btn-primary" id="loginBtn">🔐 관리자 로그인</button>
      <button class="btn btn-danger hidden" id="logoutBtn">로그아웃</button>
    </div>
  </div>

  <div class="card controls">

        <input type="email" id="emailInput" placeholder="관리자 이메일">
        <input type="password" id="passwordInput" placeholder="관리자 비밀번호">
        <button class="btn btn-primary" id="doLoginBtn">로그인</button>

      <div id="loginStatus" class="status"></div>

</div>

    },
    "황금 잉걸불": {

    }

};

const prices = {
  "코울슬로": 8384,
  "마늘 바게트": 11763,
  "감자 대파 수프": 8381,
  "치킨 라이스": 12733,
  "비프 샌드위치": 12453,
  "제육볶음": 9073,
  "새우 볶음밥": 12492,
  "달콤 오징어 구이": 11361,
  "가리비 호박 구이": 14012,
  "수박 미역 샐러드": 14014,
  "사과 샐러드": 16895,
  "호박죽": 9214,
  "과일 굴 무침": 12468,
  "호박 브륄레": 8193,
  "당근 케이크": 8450,
  "감자전": 5122,
  "수박 주스": 8189,
  "애플파이": 17537,
  "게살버거": 12209
};

let selected = null;
let selectedCategory = null;
let currentPossibleCount = 0;
let ownedMaterials = loadOwnedMaterials();

function loadOwnedMaterials() {
  try {
    return JSON.parse(localStorage.getItem(OWNED_STORAGE_KEY)) || {};
  } catch {
    return {};
  }
}

function saveOwnedMaterials() {
  localStorage.setItem(
    OWNED_STORAGE_KEY,
    JSON.stringify(ownedMaterials)
  );
}

function formatNumber(n) {
  return Number(n || 0).toLocaleString("ko-KR");
}

function formatWon(n) {
  return `${formatNumber(Math.round(n || 0))}원`;
}

function formatStack(n) {
  n = Math.floor(Number(n || 0));

  const sets = Math.floor(n / STACK);
  const pieces = n % STACK;

  if (sets && pieces) {
    return `${formatNumber(n)}개 (${formatNumber(sets)}세트 + ${formatNumber(pieces)}개)`;
  }

  if (sets) {
    return `${formatNumber(n)}개 (${formatNumber(sets)}세트)`;
  }

  return `${formatNumber(n)}개`;
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function cssId(name) {
  return btoa(unescape(encodeURIComponent(name)))
    .replace(/[^a-zA-Z0-9]/g, "");
}

function findRecipe(name) {
  for (const group of Object.values(recipes)) {
    if (group[name]) {
      return group[name];
    }
  }

  return null;
}

function expandRecipe(name, amount = 1, result = {}) {
  const recipe = findRecipe(name);

  if (!recipe || !Object.keys(recipe).length) {
    return result;
  }

  for (const [item, need] of Object.entries(recipe)) {
    const total = need * amount;
    const nested = findRecipe(item);

    if (nested && Object.keys(nested).length) {
      expandRecipe(item, total, result);
    } else {
      result[item] = (result[item] || 0) + total;
    }
  }

  return result;
}

function renderList() {
  const q = document
    .getElementById("search")
    .value.trim()
    .toLowerCase();

  const list = document.getElementById("recipeList");
  list.innerHTML = "";

  for (const [category, group] of Object.entries(recipes)) {
    const matches = Object.keys(group).filter(name =>
      (`${category} ${name}`).toLowerCase().includes(q)
    );

    if (!matches.length) {
      continue;
    }

    const heading = document.createElement("div");
    heading.className = "category-row";
    heading.style.gridColumn = "1 / -1";
    heading.style.padding = "10px 4px";
    heading.style.fontWeight = "bold";
    heading.textContent = category;

    list.appendChild(heading);

    for (const name of matches) {
      const button = document.createElement("button");

      button.className =
        "recipe-btn" + (selected === name ? " active" : "");

      button.innerHTML = `
        <span class="grade">${escapeHtml(category)}</span>
        ${escapeHtml(name)}
        ${
          prices[name]
            ? `<span class="grade" style="margin-top:6px">${formatWon(prices[name])}</span>`
            : ""
        }
      `;

      button.onclick = () => selectRecipe(category, name);
      list.appendChild(button);
    }
  }

  if (!list.children.length) {
    list.innerHTML = `
      <div class="empty">검색 결과가 없습니다.</div>
    `;
  }
}

function selectRecipe(category, name) {
  selectedCategory = category;
  selected = name;

  renderList();
  renderRecipe();
}

function createIngredientRow(name, need) {
  const saved = ownedMaterials[name] || {
    sets: 0,
    pieces: 0
  };

  return `
    <tr>
      <td>${escapeHtml(name)}</td>
      <td>${formatNumber(need)}개</td>
      <td class="owned" id="owned-${cssId(name)}">0개</td>
      <td>
        <input
          class="num set-input"
          data-name="${escapeHtml(name)}"
          type="number"
          min="0"
          value="${Math.max(0, Number(saved.sets || 0))}"
        >
      </td>
      <td>
        <input
          class="num piece-input"
          data-name="${escapeHtml(name)}"
          type="number"
          min="0"
          value="${Math.max(0, Number(saved.pieces || 0))}"
        >
      </td>
    </tr>
  `;
}

function renderRecipe() {
  if (!selected) {
    return;
  }

  const content = document.getElementById("appContent");
  const ingredients = expandRecipe(selected);
  const price = prices[selected];
  const isPriceOnly = selectedCategory === "일반 요리";

  let ingredientsHtml = "";

  if (isPriceOnly) {
    ingredientsHtml = `
      <div class="empty">
        기본 금액:
        <strong>${formatWon(price)}</strong>
        <br><br>
        일반 요리의 재료 정보는 제공되지 않아 가격만 표시합니다.
      </div>
    `;
  } else if (!Object.keys(ingredients).length) {
    ingredientsHtml = `
      <div class="empty">재료 정보가 없습니다.</div>
    `;
  } else {
    ingredientsHtml = `
      <div style="overflow:auto">
        <table class="table">
          <thead>
            <tr>
              <th>재료</th>
              <th>필요량</th>
              <th>보유량</th>
              <th>세트</th>
              <th>낱개</th>
            </tr>
          </thead>
          <tbody>
            ${
              Object.entries(ingredients)
                .map(([name, need]) => createIngredientRow(name, need))
                .join("")
            }
          </tbody>
        </table>
      </div>
    `;
  }

  content.innerHTML = `
    <div class="selected">
      [${escapeHtml(selectedCategory)}] ${escapeHtml(selected)}
    </div>

    ${
      price
        ? `
          <div class="result">
            <span>💰 기본 금액</span>
            <strong>${formatWon(price)}</strong>
          </div>
        `
        : ""
    }

    ${
      !isPriceOnly && Object.keys(ingredients).length
        ? `
          <div class="result">
            <span>🍲 만들 수 있는 수량</span>
            <strong id="result">0개</strong>
            <div class="note">
              보유 재료를 입력하면 가장 부족한 재료를 기준으로 계산합니다.
              64개 = 1세트
            </div>
          </div>
        `
        : ""
    }

    ${ingredientsHtml}
  `;

  document
    .querySelectorAll(".set-input, .piece-input")
    .forEach(el => {
      el.addEventListener("input", updateCalculation);
      el.addEventListener("keydown", handleTab);
    });

  updateCalculation();
}

function updateCalculation() {
  if (!selected) {
    return;
  }

  const ingredients = expandRecipe(selected);
  let possible = Infinity;

  for (const [name, need] of Object.entries(ingredients)) {
    const setInput = [
      ...document.querySelectorAll(".set-input")
    ].find(el => el.dataset.name === name);

    const pieceInput = [
      ...document.querySelectorAll(".piece-input")
    ].find(el => el.dataset.name === name);

    if (!setInput || !pieceInput) {
      continue;
    }

    const sets = Math.max(
      0,
      Math.floor(Number(setInput.value) || 0)
    );

    const pieces = Math.max(
      0,
      Math.floor(Number(pieceInput.value) || 0)
    );

    ownedMaterials[name] = {
      sets,
      pieces
    };

    const owned = sets * STACK + pieces;

    possible = Math.min(
      possible,
      Math.floor(owned / need)
    );

    const cell = document.getElementById(
      "owned-" + cssId(name)
    );

    if (cell) {
      cell.textContent = formatStack(owned);
    }
  }

  saveOwnedMaterials();

  if (possible === Infinity) {
    possible = 0;
  }

  currentPossibleCount = possible;

  const result = document.getElementById("result");

  if (result) {
    result.textContent = formatStack(possible);
  }
}

function handleTab(e) {
  if (e.key !== "Tab") {
    return;
  }

  const inputs = [
    ...document.querySelectorAll(".set-input, .piece-input")
  ];

  const index = inputs.indexOf(e.target);

  if (index < 0) {
    return;
  }

  e.preventDefault();

  const next = e.shiftKey
    ? inputs[Math.max(0, index - 1)]
    : inputs[Math.min(inputs.length - 1, index + 1)];

  next.focus();
  next.select();
}

document
  .getElementById("search")
  .addEventListener("input", renderList);

document
  .getElementById("search")
  .addEventListener("keydown", e => {
    if (e.key === "Enter") {
      const first = document.querySelector(".recipe-btn");

      if (first) {
        first.click();
      }
    }
  });

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const loginSection = document.getElementById("loginSection");
const doLoginBtn = document.getElementById("doLoginBtn");
const loginStatus = document.getElementById("loginStatus");

loginBtn.addEventListener("click", () => {
  loginSection.classList.toggle("hidden");
});

logoutBtn.addEventListener("click", async () => {
  await signOut(auth);
});

doLoginBtn.addEventListener("click", async () => {
  const email = document
    .getElementById("emailInput")
    .value.trim();

  const password = document
    .getElementById("passwordInput")
    .value.trim();

  loginStatus.textContent = "로그인 중...";

  try {
    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    loginStatus.textContent = "";
    loginSection.classList.add("hidden");
  } catch (err) {
    loginStatus.textContent =
      "❌ 로그인 실패: " + (err.message || err);
  }
});

onAuthStateChanged(auth, user => {
  if (user && user.uid === ADMIN_UID) {
    loginBtn.classList.add("hidden");
    logoutBtn.classList.remove("hidden");
  } else {
    loginBtn.classList.remove("hidden");
    logoutBtn.classList.add("hidden");
  }
});

renderList();
</script>
</body>
</html>
