<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>은하 요리 계산기</title>

<style>
:root{
  --bg:#080a1f;
  --panel:rgba(16,19,48,.88);
  --panel2:rgba(28,32,75,.82);
  --text:#f4f5ff;
  --muted:#aeb4d8;
  --line:rgba(255,255,255,.10);
  --accent:#8b7cff;
  --accent2:#5de0ff;
  --danger:#ff647c;
  --success:#68e0a0;
  --gold:#ffd76a;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:
    "Pretendard",
    "Noto Sans KR",
    Arial,
    sans-serif;
  background:
    radial-gradient(circle at 20% 10%,rgba(99,72,255,.18),transparent 30%),
    radial-gradient(circle at 80% 20%,rgba(0,205,255,.10),transparent 28%),
    radial-gradient(circle at 50% 90%,rgba(142,53,255,.10),transparent 35%),
    var(--bg);
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.container{
  width:min(1400px,calc(100% - 32px));
  margin:0 auto;
}

header{
  padding:34px 0 22px;
}

.header-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  color:var(--accent2);
}

.subtitle{
  margin-top:7px;
  color:var(--muted);
  font-size:14px;
}

.header-actions{
  display:flex;
  gap:8px;
  align-items:center;
}

.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 14px 45px rgba(0,0,0,.22);
  backdrop-filter:blur(12px);
}

.search-panel{
  padding:16px;
  margin-bottom:18px;
}

.search-box{
  position:relative;
}

.search-box input{
  width:100%;
  padding:14px 16px;
  border-radius:12px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.055);
  color:var(--text);
  outline:none;
}

.search-box input:focus{
  border-color:rgba(139,124,255,.65);
  box-shadow:0 0 0 3px rgba(139,124,255,.10);
}

.recipe-tabs{
  display:flex;
  gap:8px;
  margin-top:13px;
  flex-wrap:wrap;
}

.tab-btn{
  border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  color:var(--muted);
  border-radius:10px;
  padding:9px 14px;
}

.tab-btn.active{
  background:rgba(139,124,255,.20);
  color:white;
  border-color:rgba(139,124,255,.5);
}

.recipe-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:14px;
}

.recipe-card{
  padding:16px;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--panel);
  transition:.18s;
}

.recipe-card:hover{
  transform:translateY(-2px);
  border-color:rgba(139,124,255,.35);
}

.recipe-card h3{
  margin:0;
  font-size:17px;
}

.recipe-grade{
  display:inline-block;
  margin-bottom:9px;
  font-size:12px;
  color:var(--gold);
}

.recipe-price{
  margin-top:6px;
  color:var(--accent2);
  font-size:13px;
  font-weight:800;
}

.recipe-desc{
  color:var(--muted);
  font-size:12px;
  margin:7px 0 12px;
}

.recipe-materials{
  font-size:13px;
  line-height:1.7;
  color:#dfe2ff;
}

.recipe-btn{
  width:100%;
  margin-top:13px;
  padding:10px;
  border:0;
  border-radius:10px;
  background:linear-gradient(135deg,var(--accent),#6c5ce7);
  color:white;
  font-weight:700;
}

section{
  margin-top:22px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.section-title h2{
  margin:0;
  font-size:20px;
}

.section-title small{
  color:var(--muted);
}

.calculator{
  padding:18px;
}

.calc-top{
  display:grid;
  grid-template-columns:1fr 180px auto;
  gap:10px;
  align-items:end;
}

.field{
  min-width:0;
}

.field label{
  display:block;
  margin-bottom:6px;
  font-size:12px;
  color:var(--muted);
}

input,
select{
  width:100%;
  border:1px solid var(--line);
  background:rgba(255,255,255,.055);
  color:var(--text);
  border-radius:10px;
  padding:11px 12px;
  outline:none;
}

input:focus,
select:focus{
  border-color:rgba(139,124,255,.65);
}

select option{
  background:#151832;
  color:white;
}

.calc-result{
  margin-top:16px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.result-box{
  padding:13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(255,255,255,.035);
}

.result-title{
  color:var(--muted);
  font-size:12px;
  margin-bottom:5px;
}

.result-value{
  font-size:18px;
  font-weight:800;
}

.material-list{
  margin-top:15px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:8px;
}

.material-item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px 12px;
  border-radius:10px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.06);
}

.material-item span:first-child{
  color:#dce0ff;
}

.material-item span:last-child{
  font-weight:700;
  white-space:nowrap;
}

.category-title{
  grid-column:1/-1;
  margin-top:5px;
  color:var(--accent2);
  font-weight:800;
  font-size:13px;
}

/* =========================
   단체 주문
========================= */

.group-panel{
  padding:18px;
}

.group-view-controls{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.rate-select{
  width:170px;
}

.group-total{
  margin-top:16px;
  padding:16px;
  border-radius:14px;
  background:linear-gradient(
    135deg,
    rgba(139,124,255,.16),
    rgba(93,224,255,.08)
  );
  border:1px solid rgba(139,124,255,.22);
}

.group-total-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.group-total-label{
  color:var(--muted);
}

.group-total-value{
  font-size:24px;
  font-weight:900;
  color:white;
}

/* 관리자 음식 5개 가로 배치 */
.group-order-wrap{
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  padding-bottom:6px;
}

.group-order-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(190px,1fr));
  gap:10px;
  min-width:1000px;
}

.group-food{
  min-width:0;
  padding:13px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.035);
}

.group-food-number{
  font-size:15px;
  font-weight:900;
  margin-bottom:12px;
  color:#fff;
  white-space:nowrap;
}

.group-field{
  margin-bottom:10px;
}

.group-field:last-of-type{
  margin-bottom:12px;
}

.group-field .input-title{
  display:block;
  margin-bottom:5px;
  color:var(--muted);
  font-size:11px;
}

.group-food input{
  margin:0;
  min-width:0;
}

.group-food-total{
  padding-top:10px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:12px;
}

.group-food-total strong{
  display:block;
  margin-top:4px;
  color:white;
  font-size:15px;
}

.admin-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}

.btn{
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 14px;
  background:rgba(255,255,255,.05);
  color:white;
}

.btn-primary{
  border-color:rgba(139,124,255,.5);
  background:rgba(139,124,255,.20);
}

.btn-success{
  border-color:rgba(104,224,160,.35);
  background:rgba(104,224,160,.12);
}

.btn-danger{
  border-color:rgba(255,100,124,.35);
  background:rgba(255,100,124,.12);
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.status{
  margin-top:10px;
  min-height:20px;
  color:var(--muted);
  font-size:13px;
}

.login-panel{
  padding:18px;
}

.login-row{
  display:flex;
  gap:10px;
  align-items:end;
}

.login-row .field{
  flex:1;
}

.hidden{
  display:none !important;
}

.empty{
  padding:30px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--line);
  border-radius:14px;
}

footer{
  padding:35px 0 45px;
  text-align:center;
  color:#73799e;
  font-size:12px;
}

/* =========================
   반응형
========================= */

@media(max-width:800px){
  .header-inner{
    align-items:flex-start;
    flex-direction:column;
  }

  .calc-top{
    grid-template-columns:1fr;
  }

  .calc-result{
    grid-template-columns:1fr;
  }

  .group-order-grid{
    grid-template-columns:repeat(5,190px);
  }

  .group-total-row{
    align-items:flex-start;
    flex-direction:column;
  }

  .login-row{
    flex-direction:column;
    align-items:stretch;
  }
}

@media(max-width:500px){
  .container{
    width:min(100% - 20px,1400px);
  }

  header{
    padding-top:22px;
  }

  .logo{
    font-size:23px;
  }

  .recipe-grid{
    grid-template-columns:1fr;
  }

  .material-list{
    grid-template-columns:1fr;
  }
}
</style>

</head>

========================================================= */

function formatNumber(number){
  return Number(number || 0).toLocaleString("ko-KR");
}

function formatWon(number){
  return `${formatNumber(Math.round(number))}원`;
}

/* =========================================================
   레시피 확장
========================================================= */

const recipeMap = new Map(
  recipes.map(recipe => [recipe.name,recipe])
);

/*
  [A] 재료는 완성된 재료로 취급한다.
  또한 사용자가 적어준 레시피 이름의 띄어쓰기 차이 때문에
  다른 레시피로 잘못 분해되는 것을 막기 위해
  실제 레시피 재료 이름만 정확히 일치할 때 확장한다.
*/

function expandRecipe(
  ingredientName,
  amount,
  result = {},
  visited = new Set()
){

  /*
    [A] 재료는 그대로 사용
  */
  if(ingredientName.startsWith("[A]")){

    result[ingredientName] =
      (result[ingredientName] || 0) + amount;

    return result;
  }

  const recipe =
    recipeMap.get(ingredientName);

  /*
    레시피가 아니면 기본 재료
  */
  if(!recipe){

    result[ingredientName] =
      (result[ingredientName] || 0) + amount;

    return result;
  }

  /*
    순환 참조 방지
  */
  if(visited.has(ingredientName)){

    result[ingredientName] =
      (result[ingredientName] || 0) + amount;

    return result;
  }

  const nextVisited =
    new Set(visited);

  nextVisited.add(ingredientName);

  for(
    const [childName,childAmount]
    of Object.entries(recipe.ingredients)
  ){

    expandRecipe(
      childName,
      amount * childAmount,
      result,
      nextVisited
    );

  }

  return result;
}

let currentGrade = "전체";

function renderRecipes(){

  const keyword =
    searchInput.value.trim().toLowerCase();

  const filtered =
    recipes.filter(recipe => {

      const gradeMatch =
        currentGrade === "전체" ||
        recipe.grade === currentGrade;

      const searchMatch =
        !keyword ||
        recipe.name
          .toLowerCase()
          .includes(keyword);

      return gradeMatch && searchMatch;

    });

  recipeCount.textContent =
    `${filtered.length}개`;

  if(!filtered.length){

    recipeGrid.innerHTML =
      `<div class="empty">
        검색 결과가 없습니다.
      </div>`;

    return;
  }

  recipeGrid.innerHTML =
    filtered.map(recipe => {

      const ingredientText =
        Object.entries(recipe.ingredients)
          .map(([name,amount]) =>
            `${escapeHtml(name)} × ${amount}`
          )
          .join("<br>");

      return `
        <div class="recipe-card">

          <div class="recipe-grade">
            ${escapeHtml(recipe.grade)}
          </div>

          <h3>
            ${escapeHtml(recipe.name)}
          </h3>

          <div class="recipe-price">
            ${formatWon(recipe.price)}
          </div>

          <div class="recipe-desc">
            1개 제작 기준
          </div>

          <div class="recipe-materials">
            ${ingredientText}
          </div>

          <button
            class="recipe-btn"
            data-recipe="${escapeHtml(recipe.name)}"
          >
            계산기로 가져오기
          </button>

        </div>
      `;

    }).join("");

  document
    .querySelectorAll(".recipe-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          calcRecipe.value =
            button.dataset.recipe;

          calcAmount.value = 1;

          document
            .getElementById("calcResult")
            .scrollIntoView({
              behavior:"smooth",
              block:"start"
            });

          calculateRecipe();

        }
      );

    });
}

/* =========================================================
   계산
========================================================= */

function calculateRecipe(){

  const recipeName =
    calcRecipe.value;

  const amount =
    Math.max(
      1,
      Number(calcAmount.value || 1)
    );

  const expanded =
    expandRecipe(
      recipeName,
      amount,
      {}
    );

  const entries =
    Object.entries(expanded);

  materialTypeCount.textContent =
    `${entries.length}종`;

  resultFoodAmount.textContent =
    `${formatNumber(amount)}개`;

  materialList.innerHTML =
    entries.map(([name,total]) => {

      const stacks =
        Math.floor(total / 64);

      const remainder =
        total % 64;

      let stackText = "";

      if(stacks > 0){

        stackText +=
          `${formatNumber(stacks)}셋`;

      }

      if(remainder > 0){

        if(stackText){
          stackText += " + ";
        }

        stackText +=
          `${formatNumber(remainder)}개`;

      }

      if(total === 0){
        stackText = "0개";
      }

      return `
        <div class="material-item">

          <span>
            ${escapeHtml(name)}
          </span>

          <span>
            ${formatNumber(total)}개

            <small style="color:var(--muted)">
              (${stackText})
            </small>
          </span>

        </div>
      `;

    }).join("");

  calcResult.classList.remove("hidden");
}

calculateBtn.addEventListener(

  calculateRecipe

/* =========================================================
   HTML escape
========================================================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

        Number(food.amount || 0) > 0
    );

  if(!validOrders.length){

    groupViewerList.innerHTML =
      `<div class="empty">
        현재 등록된 단체주문이 없습니다.
      </div>`;

    groupViewerTotal.textContent =
      "0원";

    return;
  }

  groupViewerList.innerHTML =
    validOrders.map(food => {

      const base =
        Number(food.price || 0) *
        Number(food.amount || 0);

      const finalAmount =
        base * (1 + rate);

      totalAll += finalAmount;

      return `
        <div
          class="result-box"
          style="margin-bottom:10px"
        >

          <div
            style="
              display:flex;
              justify-content:space-between;
              gap:12px;
              align-items:center;
            "
          >

            <div>

              <div
                style="
                  font-weight:800;
                  margin-bottom:5px;
                "
              >
                ${escapeHtml(food.name)}
              </div>

              <div
                style="
                  color:var(--muted);
                  font-size:12px;
                "
              >
                1개 ${formatWon(food.price)}
                ×
                ${formatNumber(food.amount)}배
              </div>

            </div>

            <div
              style="
                text-align:right;
                white-space:nowrap;
              "
            >

              <div
                style="
                  color:var(--muted);
                  font-size:11px;
                "
              >
                기본 ${formatWon(base)}
              </div>

              <div
                style="
                  margin-top:3px;
                  font-size:17px;
                  font-weight:900;
                "
              >
                ${formatWon(finalAmount)}
              </div>

            </div>

          </div>

        </div>
      `;

    }).join("");

  groupViewerTotal.textContent =
    formatWon(totalAll);

}

groupRate.addEventListener(
  "change",
  renderGroupViewer
);

/* =========================================================
   Firestore 실시간 동기화
========================================================= */

onSnapshot(
  groupOrderRef,

  snapshot => {

    if(snapshot.exists()){

      const data =
        snapshot.data();

      if(Array.isArray(data.orders)){

        groupOrders =
          data.orders
            .slice(0,5)
            .map(food => ({

              name:
                food.name || "",

              price:
                Number(
                  food.price || 0
                ),

              amount:
                Number(
                  food.amount || 0
                )

            }));

      }

      while(groupOrders.length < 5){

        groupOrders.push({

          name:"",
          price:0,
          amount:0

        });

      }

    }else{

      groupOrders = [

        {
          name:"",
          price:0,
          amount:0
        },

        {
          name:"",
          price:0,
          amount:0
        },

        {
          name:"",
          price:0,
          amount:0
        },

        {
          name:"",
          price:0,
          amount:0
        },

        {
          name:"",
          price:0,
          amount:0
        }

      ];

    }

    renderGroupOrderEditor();
    renderGroupViewer();

  },

  error => {

    console.error(
      "Firestore 실시간 동기화 오류:",
      error
    );

    adminStatus.textContent =
      "⚠️ 단체주문 정보를 불러오지 못했습니다.";

  }
);

/* =========================================================
   로그인
========================================================= */

loginBtn.addEventListener(
  "click",
  () => {

    loginSection.classList.toggle(
      "hidden"
    );

    if(
      !loginSection.classList.contains(
        "hidden"
      )
    ){

      loginSection.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

    }

  }
);

/* =========================================================
   관리자 로그인
========================================================= */

doLoginBtn.addEventListener(
  "click",
  async () => {

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;

    if(!email || !password){

      loginStatus.textContent =
        "이메일과 비밀번호를 입력해주세요.";

      return;
    }

    try{

      loginStatus.textContent =
        "로그인 중...";

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }catch(error){

      console.error(error);

      loginStatus.textContent =
        "❌ 로그인 실패: " +
        (error.message || error);

    }

  }
);

/* =========================================================
   인증 상태
========================================================= */

onAuthStateChanged(
  auth,

  async user => {

    if(user){

      if(user.uid === ADMIN_UID){

        loginBtn.classList.add(
          "hidden"
        );

        logoutBtn.classList.remove(
          "hidden"
        );

        loginSection.classList.add(
          "hidden"
        );

        groupViewer.classList.add(
          "hidden"
        );

        groupAdmin.classList.remove(
          "hidden"
        );

        adminStatus.textContent =
          "관리자로 로그인되었습니다.";

        renderGroupOrderEditor();

      }else{

        await signOut(auth);

        loginStatus.textContent =
          "관리자 계정만 로그인할 수 있습니다.";

      }

    }else{

      loginBtn.classList.remove(
        "hidden"
      );

      logoutBtn.classList.add(
        "hidden"
      );

      groupViewer.classList.remove(
        "hidden"
      );

      groupAdmin.classList.add(
        "hidden"
      );

    }

  }
);

/* =========================================================
   로그아웃
========================================================= */

logoutBtn.addEventListener(
  "click",
  async () => {

    try{

      await signOut(auth);

    }catch(error){

      console.error(error);

    }

  }
);

/* =========================================================
   초기 실행
========================================================= */

renderRecipes();
renderRecipeSelect();
renderGroupOrderEditor();
renderGroupViewer();

</script>

</body>
</html>
