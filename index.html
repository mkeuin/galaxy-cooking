<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>은하 요리 계산기</title>

<style>
:root{
  --bg:#080a1f;
  --panel:rgba(16,19,48,.92);
  --panel2:rgba(28,32,75,.88);
  --line:rgba(120,130,255,.22);
  --text:#f4f5ff;
  --muted:#aeb4d6;
  --accent:#8c7cff;
  --accent2:#55d8ff;
  --green:#65e6a5;
  --yellow:#ffd66b;
  --red:#ff718d;
  --shadow:0 15px 45px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:
    "Pretendard",
    "Noto Sans KR",
    Arial,
    sans-serif;
  background:
    radial-gradient(circle at 15% 15%,rgba(89,74,255,.18),transparent 28%),
    radial-gradient(circle at 85% 10%,rgba(0,203,255,.13),transparent 25%),
    radial-gradient(circle at 50% 100%,rgba(164,67,255,.13),transparent 30%),
    var(--bg);
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.45;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 1px),
    radial-gradient(circle,rgba(130,150,255,.55) 1px,transparent 1px);
  background-size:97px 97px,151px 151px;
  background-position:15px 25px,70px 90px;
}

.container{
  position:relative;
  z-index:1;
  width:min(1200px,94%);
  margin:0 auto;
  padding:30px 0 60px;
}

.header{
  text-align:center;
  margin-bottom:25px;
}

.header h1{
  margin:0;
  font-size:clamp(28px,5vw,48px);
  font-weight:900;
  letter-spacing:-2px;
  background:linear-gradient(90deg,#fff,#9e96ff,#55d8ff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 0 35px rgba(125,105,255,.3);
}

.header p{
  margin:10px 0 0;
  color:var(--muted);
}


/* =========================================================
   단체주문
========================================================= */

.order-panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:20px;
  padding:20px;
  box-shadow:var(--shadow);
  margin-bottom:20px;
  backdrop-filter:blur(12px);
}

.order-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:15px;
  flex-wrap:wrap;
}

.order-title{
  display:flex;
  align-items:center;
  gap:10px;
}

.order-title h2{
  margin:0;
  font-size:21px;
}

.order-status{
  font-size:12px;
  color:var(--muted);
}

.order-status.admin{
  color:var(--green);
}

.bonus-area{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.bonus-label{
  color:var(--muted);
  font-size:14px;
  margin-right:4px;
}

.bonus-btn{
  border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  color:var(--text);
  border-radius:10px;
  padding:8px 15px;
  cursor:pointer;
  font-weight:700;
  transition:.18s;
}

.bonus-btn:hover{
  border-color:var(--accent);
  transform:translateY(-1px);
}

.bonus-btn.active{
  background:linear-gradient(135deg,var(--accent),#5c8cff);
  border-color:transparent;
  box-shadow:0 0 18px rgba(124,109,255,.25);
}

.order-list{
  display:grid;
  gap:12px;
}

.order-row{
  border:1px solid rgba(130,140,255,.14);
  background:rgba(255,255,255,.025);
  border-radius:15px;
  padding:14px;
}

.order-top{
  display:grid;
  grid-template-columns:50px minmax(180px,1fr) minmax(150px,230px) auto;
  gap:10px;
  align-items:center;
}

.order-number{
  width:40px;
  height:40px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(124,109,255,.15);
  color:#bdb6ff;
  font-weight:900;
}

.order-search-wrap{
  position:relative;
}

.order-search{
  width:100%;
  height:42px;
  border:1px solid rgba(140,150,255,.2);
  border-radius:9px;
  outline:none;
  background:#10132e;
  color:var(--text);
  padding:0 12px;
  font-size:14px;
}

.order-search:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(140,124,255,.1);
}

.order-search-results{
  position:absolute;
  top:47px;
  left:0;
  right:0;
  max-height:260px;
  overflow:auto;
  z-index:100;
  display:none;
  background:#11142f;
  border:1px solid var(--line);
  border-radius:10px;
  box-shadow:var(--shadow);
}

.order-search-results.show{
  display:block;
}

.order-search-result{
  padding:10px 12px;
  cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,.05);
}

.order-search-result:last-child{
  border-bottom:0;
}

.order-search-result:hover{
  background:rgba(140,124,255,.13);
}

.order-search-result .grade{
  color:var(--muted);
  font-size:11px;
  margin-left:5px;
}

.order-price-input{
  width:100%;
  height:42px;
  border:1px solid rgba(140,150,255,.2);
  border-radius:9px;
  outline:none;
  background:#10132e;
  color:var(--text);
  padding:0 12px;
  font-size:14px;
}

.order-price-input:focus{
  border-color:var(--accent);
}

.order-price-display{
  min-width:145px;
  text-align:right;
}

.order-price-display .original{
  font-size:12px;
  color:var(--muted);
}

.order-price-display .final{
  margin-top:2px;
  color:var(--green);
  font-size:17px;
  font-weight:900;
}

.order-edit-section{
  margin-top:13px;
  padding-top:13px;
  border-top:1px solid rgba(130,140,255,.12);
}

.order-section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:9px;
}

.order-section-title strong{
  font-size:14px;
}

.ingredient-editor{
  display:grid;
  gap:7px;
}

.ingredient-edit-row{
  display:grid;
  grid-template-columns:minmax(150px,1fr) 130px auto;
  gap:7px;
}

.ingredient-edit-row input{
  width:100%;
  height:38px;
  border:1px solid rgba(140,150,255,.18);
  border-radius:8px;
  outline:none;
  background:#0d1028;
  color:white;
  padding:0 10px;
}

.ingredient-edit-row input:focus{
  border-color:var(--accent);
}

.ingredient-view{
  display:grid;
  gap:6px;
}

.ingredient-view-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:8px 10px;
  border-radius:8px;
  background:rgba(0,0,0,.14);
}

.ingredient-view-name{
  color:#dfe2ff;
}

.ingredient-view-amount{
  color:#fff;
  font-weight:800;
  white-space:nowrap;
}

.no-ingredient{
  color:var(--muted);
  font-size:13px;
  padding:5px 0;
}

.add-ingredient-btn{
  border:1px solid var(--line);
  background:rgba(140,124,255,.08);
  color:#c9c4ff;
  border-radius:8px;
  padding:6px 10px;
  cursor:pointer;
  font-size:12px;
  font-weight:800;
}

.add-ingredient-btn:hover{
  background:rgba(140,124,255,.16);
}

.remove-ingredient-btn{
  width:38px;
  height:38px;
  border:1px solid rgba(255,100,130,.2);
  background:rgba(255,80,110,.08);
  color:#ff9caf;
  border-radius:8px;
  cursor:pointer;
  font-weight:900;
}

.remove-ingredient-btn:hover{
  background:rgba(255,80,110,.15);
}

.order-selected-info{
  margin-top:8px;
  font-size:11px;
  color:var(--muted);
}

.admin-controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}

.btn{
  border:0;
  border-radius:10px;
  padding:10px 15px;
  color:white;
  font-weight:800;
  cursor:pointer;
  background:linear-gradient(135deg,var(--accent),#5b91ff);
  transition:.18s;
}

.btn:hover{
  transform:translateY(-1px);
  filter:brightness(1.08);
}

.btn.secondary{
  background:rgba(255,255,255,.07);
  border:1px solid var(--line);
}

.login-box{
  display:none;
  margin-top:12px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(0,0,0,.15);
}

.login-box.show{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:8px;
}

.login-box input{
  min-width:0;
  height:40px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#0d1028;
  color:white;
  padding:0 11px;
  outline:none;
}

.login-message{
  grid-column:1/-1;
  color:var(--red);
  font-size:12px;
  min-height:16px;
}


/* =========================================================
   계산기
========================================================= */

.calculator{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:20px;
  padding:20px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(12px);
}

.search-area{
  position:relative;
  margin-bottom:18px;
}

.search-area input{
  width:100%;
  height:50px;
  padding:0 17px;
  border-radius:12px;
  border:1px solid var(--line);
  outline:none;
  background:#0d1028;
  color:var(--text);
  font-size:15px;
}

.search-area input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(140,124,255,.1);
}

.search-results{
  position:absolute;
  top:55px;
  left:0;
  right:0;
  max-height:300px;
  overflow:auto;
  z-index:20;
  background:#11142f;
  border:1px solid var(--line);
  border-radius:12px;
  display:none;
}

.search-results.show{
  display:block;
}

.search-result{
  padding:11px 14px;
  cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,.05);
}

.search-result:last-child{
  border-bottom:0;
}

.search-result:hover{
  background:rgba(140,124,255,.12);
}

.search-result .grade{
  font-size:11px;
  color:var(--muted);
  margin-left:5px;
}

.category-tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.category-btn{
  border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  color:var(--muted);
  border-radius:10px;
  padding:8px 14px;
  cursor:pointer;
  font-weight:800;
}

.category-btn.active{
  color:white;
  background:rgba(140,124,255,.2);
  border-color:rgba(140,124,255,.55);
}

.recipe-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:9px;
  margin-bottom:20px;
}

.recipe-btn{
  min-height:52px;
  padding:9px 11px;
  text-align:left;
  border:1px solid var(--line);
  border-radius:11px;
  background:rgba(255,255,255,.035);
  color:var(--text);
  cursor:pointer;
  transition:.18s;
}

.recipe-btn:hover{
  transform:translateY(-1px);
  border-color:rgba(140,124,255,.6);
}

.recipe-btn.active{
  background:linear-gradient(135deg,rgba(140,124,255,.28),rgba(85,216,255,.1));
  border-color:var(--accent);
  box-shadow:0 0 18px rgba(140,124,255,.12);
}

.recipe-grade{
  display:block;
  font-size:10px;
  color:var(--muted);
  margin-bottom:3px;
}

.recipe-name{
  font-weight:800;
  line-height:1.35;
}

.selected-title{
  margin:15px 0 12px;
  padding-bottom:10px;
  border-bottom:1px solid var(--line);
}

.selected-title h2{
  margin:0;
  font-size:21px;
}

.selected-title .grade{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.input-panel{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:18px;
}

.input-box{
  background:rgba(255,255,255,.035);
  border:1px solid rgba(140,150,255,.15);
  border-radius:13px;
  padding:14px;
}

.input-box label{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:7px;
}

.input-box input{
  width:100%;
  height:43px;
  border:1px solid rgba(140,150,255,.2);
  border-radius:9px;
  outline:none;
  background:#0c0f26;
  color:white;
  padding:0 12px;
  font-size:16px;
  font-weight:800;
}

.input-box input:focus{
  border-color:var(--accent);
}

.result-box{
  padding:17px;
  border:1px solid rgba(101,230,165,.2);
  border-radius:13px;
  background:rgba(101,230,165,.045);
  margin-bottom:18px;
}

.result-main{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

.result-main .label{
  color:var(--muted);
}

.result-main .value{
  color:var(--green);
  font-size:27px;
  font-weight:900;
}

.ingredients{
  display:grid;
  gap:10px;
}

.ingredient-section{
  background:rgba(255,255,255,.025);
  border:1px solid rgba(140,150,255,.13);
  border-radius:13px;
  padding:14px;
}

.ingredient-section h3{
  margin:0 0 10px;
  font-size:15px;
}

.ingredient-list{
  display:grid;
  gap:6px;
}

.ingredient{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:8px 10px;
  border-radius:8px;
  background:rgba(0,0,0,.14);
}

.ingredient-name{
  color:#dfe2ff;
}

.ingredient-count{
  font-weight:900;
  color:#fff;
  white-space:nowrap;
}

.subrecipe{
  padding:10px;
  border-radius:9px;
  background:rgba(140,124,255,.07);
  margin-bottom:7px;
}

.subrecipe:last-child{
  margin-bottom:0;
}

.subrecipe-name{
  font-weight:800;
}

.subrecipe-count{
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

.hidden{
  display:none!important;
}


/* =========================================================
   모바일
========================================================= */

@media(max-width:800px){

  .order-top{
    grid-template-columns:45px 1fr;
  }

  .order-price-input{
    grid-column:2;
  }

  .order-price-display{
    grid-column:2;
    text-align:left;
  }

  .ingredient-edit-row{
    grid-template-columns:1fr 100px auto;
  }

  .login-box.show{
    grid-template-columns:1fr;
  }

  .login-message{
    grid-column:auto;
  }

  .input-panel{
    grid-template-columns:1fr;
  }

  .recipe-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:500px){

  .container{
    width:94%;
    padding-top:20px;
  }

  .order-panel,
  .calculator{
    padding:14px;
  }

  .ingredient-edit-row{
    grid-template-columns:1fr 85px auto;
  }

  .order-price-display .final{
    font-size:16px;
  }
}
</style>
</head>

<body>

<div class="container">

<header class="header">
  <h1>🌌 은하 요리 계산기</h1>
  <p>보유 재료를 입력하면 만들 수 있는 요리의 개수와 필요한 재료를 계산합니다.</p>
</header>


<!-- =========================================================
     단체주문
========================================================== -->

<section class="order-panel">

  <div class="order-header">

    <div class="order-title">
      <span>📋</span>
      <h2>단체주문</h2>
    </div>

    <div id="orderStatus" class="order-status">
      주문 정보를 불러오는 중...
    </div>

  </div>


  <div class="bonus-area">

    <span class="bonus-label">
      판매 보너스
    </span>

    <button class="bonus-btn active" data-bonus="0">
      0%
    </button>

    <button class="bonus-btn" data-bonus="5">
      5%
    </button>

    <button class="bonus-btn" data-bonus="10">
      10%
    </button>

    <button class="bonus-btn" data-bonus="15">
      15%
    </button>

  </div>


  <div id="orderList" class="order-list"></div>


  <div id="adminControls" class="admin-controls hidden">

    <button id="saveOrderBtn" class="btn">
      💾 단체주문 저장
    </button>

    <button id="logoutBtn" class="btn secondary">
      관리자 로그아웃
    </button>

  </div>


  <div id="loginControls" class="admin-controls">

    <button id="loginOpenBtn" class="btn secondary">
      🔐 관리자 로그인
    </button>

  </div>


  <div id="loginBox" class="login-box">

    <input
      id="loginEmail"
      type="email"
      value="ehddnjs5157@naver.com"
      placeholder="관리자 이메일"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="비밀번호"
    >

    <button id="loginBtn" class="btn">
      로그인
    </button>

    <div id="loginMessage" class="login-message"></div>

  </div>

</section>


<!-- =========================================================
     계산기
========================================================== -->

<main class="calculator">

  <div class="search-area">

    <input
      id="searchInput"
      type="text"
      placeholder="🔎 요리 이름을 검색하세요..."
      autocomplete="off"
    >

    <div id="searchResults" class="search-results"></div>

  </div>


  <div id="categoryTabs" class="category-tabs"></div>

  <div id="recipeGrid" class="recipe-grid"></div>


  <div id="recipeContent" class="hidden">

    <div class="selected-title">

      <h2 id="selectedName"></h2>

      <div id="selectedGrade" class="grade"></div>

    </div>


    <div class="input-panel">

      <div class="input-box">

        <label for="setInput">
          보유 세트 수
        </label>

        <input
          id="setInput"
          type="number"
          min="0"
          step="1"
          value="0"
        >

      </div>


      <div class="input-box">

        <label for="pieceInput">
          보유 개수
        </label>

        <input
          id="pieceInput"
          type="number"
          min="0"
          step="1"
          value="0"
        >

      </div>

    </div>


    <div class="result-box">

      <div class="result-main">

        <div class="label">
          현재 만들 수 있는 요리
        </div>

        <div class="value">
          <span id="craftableCount">0</span>개
        </div>

      </div>

    </div>


    <div id="ingredients" class="ingredients"></div>

  </div>

</main>

</div>


<script type="module">

/* =========================================================
   Firebase
========================================================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  onSnapshot,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBi3CTzTaWPdCJ9gwuRgpROac45Ag-54Y",

  authDomain:
    "galaxy-cooking.firebaseapp.com",

  projectId:
    "galaxy-cooking",

  storageBucket:
    "galaxy-cooking.firebasestorage.app",

  messagingSenderId:
    "885308286326",

  appId:
    "1:885308286326:web:ceeec8b4491cd9385a0657"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


const ADMIN_UID =
  "5xfn6hpdXHeZ73wSYhHKkyLPnmF2";


const orderRef =
  doc(
    db,
    "cookingOrder",
    "main"
  );


/* =========================================================
   기본 설정
========================================================= */

const STACK = 64;


/* =========================================================
   레시피
========================================================= */

const recipes = {

  "일반": [

    {
      name:"요정 피쉬 꽃튀김",
      ingredients:{

/* =========================================================
   숫자
========================================================= */

function comma(value){

  return Number(
    value || 0
  ).toLocaleString("ko-KR");

}


function formatStack(value){

  value =
    Math.floor(
      Number(value) || 0
    );

  const sets =
    Math.floor(
      value / STACK
    );

  const pieces =
    value % STACK;


  if(
    sets > 0 &&
    pieces > 0
  ){

    return `${comma(value)}개 (${comma(sets)}세트 ${comma(pieces)}개)`;

  }


  if(sets > 0){

    return `${comma(value)}개 (${comma(sets)}세트)`;

  }


  return `${comma(value)}개`;

}


/* =========================================================
   레시피 찾기
========================================================= */

function findRecipe(name){

  return all.find(
    recipe => recipe.name === name
  ) || null;

}


/* =========================================================
   레시피 확장
========================================================= */

function expandRecipe(
  recipeName,
  amount,
  result={}
){

  const recipe =
    findRecipe(recipeName);


  if(!recipe){

    result[recipeName] =
      (result[recipeName] || 0) +
      amount;

    return result;

  }


  for(
    const [ingredient, qty]
    of Object.entries(recipe.ingredients)
  ){

    const total =
      qty * amount;

    const subRecipe =
      findRecipe(ingredient);


    if(subRecipe){

      expandRecipe(
        ingredient,
        total,
        result
      );

    }else{

      result[ingredient] =
        (result[ingredient] || 0) +
        total;

    }

  }


  return result;

}

  renderRecipeGrid();

  calculate();

/* =========================================================
   계산
========================================================= */

function getTotalOwned(){

  const sets =
    Math.max(
      0,
      Number(setInput.value) || 0
    );


  const pieces =
    Math.max(
      0,
      Number(pieceInput.value) || 0
    );


  return (
    sets * STACK +
    pieces
  );

}


function calculateCraftable(recipe){

  if(!recipe){

    return 0;

  }


  const owned =
    getTotalOwned();


  let possible =
    Infinity;


  const expanded =
    expandRecipe(
      recipe.name,
      1,
      {}
    );


  for(
    const amount
    of Object.values(expanded)
  ){

    if(amount <= 0){

      continue;

    }


    possible =
      Math.min(
        possible,
        Math.floor(
          owned / amount
        )
      );

  }


  if(
    possible === Infinity
  ){

    return 0;

  }


  return possible;

}


function calculate(){

  if(!selected){

    return;

  }


  const recipe =
    findRecipe(selected);


  if(!recipe){

    return;

  }


  const count =
    calculateCraftable(
      recipe
    );


  craftableCount.textContent =
    comma(count);


  renderIngredients(
    recipe,
    count
  );

}

========================================================= */

function renderIngredients(
  recipe,
  craftCount
){

  ingredients.innerHTML = "";


  const subRecipes = [];


  for(
    const [name, amount]
    of Object.entries(recipe.ingredients)
  ){

    if(findRecipe(name)){

      subRecipes.push({
        name,
        amount
      });

    }

  }


  if(
    subRecipes.length > 0
  ){

    const section =
      document.createElement(
        "section"
      );

    section.className =
      "ingredient-section";


    const title =
      document.createElement("h3");

    title.textContent =
      "🍳 필요한 하위 요리";


    section.appendChild(
      title
    );


    const list =
      document.createElement("div");

    list.className =
      "ingredient-list";


    for(
      const item
      of subRecipes
    ){

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "subrecipe";


      row.innerHTML = `
        <div class="subrecipe-name">
          ${item.name}
        </div>

        <div class="subrecipe-count">
          ${formatStack(
            item.amount *
            craftCount
          )}
        </div>
      `;


      list.appendChild(
        row
      );

    }


    section.appendChild(
      list
    );

    ingredients.appendChild(
      section
    );

  }


  const expanded =
    expandRecipe(
      recipe.name,
      craftCount,
      {}
    );


  const fish = {};
  const crops = {};
  const processed = {};


  for(
    const [name, amount]
    of Object.entries(expanded)
  ){

    if(FISH.includes(name)){

      fish[name] =
        amount;

    }else if(
      CROPS.includes(name)
    ){

      crops[name] =
        amount;

    }else{

      processed[name] =
        amount;

    }

  }


  function addSection(
    title,
    data
  ){

    if(
      Object.keys(data).length === 0
    ){

      return;

    }


    const section =
      document.createElement(
        "section"
      );

    section.className =
      "ingredient-section";


    const heading =
      document.createElement("h3");

    heading.textContent =
      title;


    section.appendChild(
      heading
    );


    const list =
      document.createElement(
        "div"
      );

    list.className =
      "ingredient-list";


    for(
      const [name, amount]
      of Object.entries(data)
    ){

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "ingredient";


      row.innerHTML = `
        <span class="ingredient-name">
          ${name}
        </span>

        <span class="ingredient-count">
          ${formatStack(amount)}
        </span>
      `;


      list.appendChild(
        row
      );

    }


    section.appendChild(
      list
    );


    ingredients.appendChild(
      section
    );

  }


  addSection(
    "🐟 생선",
    fish
  );

  addSection(
    "🌱 작물",
    crops
  );

  addSection(
    "🧂 가공 재료",
    processed
  );

}

/* =========================================================
   금액
========================================================= */

function cleanPrice(value){

  return String(
    value || ""
  )
    .replace(/[^\d]/g,"");

}


function getFinalPrice(
  amount
){

  const price =
    Number(
      cleanPrice(amount)
    ) || 0;


  return Math.round(
    price *
    (
      1 +
      currentBonus / 100
    )
  );

}


/* =========================================================
   단체주문 기본 데이터 보정
========================================================= */

function normalizeFood(
  food
){

  const normalized = {

    name:
      String(
        food?.name || ""
      ),

    amount:
      String(
        food?.amount || ""
      ),

    ingredients:[]

  };


  if(
    Array.isArray(
      food?.ingredients
    )
  ){

    normalized.ingredients =
      food.ingredients
        .map(
          item => ({

            name:
              String(
                item?.name || ""
              ),

            amount:
              String(
                item?.amount || ""
              )

          })
        )
        .filter(
          item =>
            item.name ||
            item.amount
        );

  }


  /*
    예전 데이터에 ingredients가 없는 경우
    기존 레시피가 있으면 자동으로 가져온다.
  */

  if(
    normalized.ingredients.length === 0 &&
    normalized.name
  ){

    const recipe =
      findRecipe(
        normalized.name
      );


    if(recipe){

      normalized.ingredients =
        Object.entries(
          recipe.ingredients
        )
        .map(
          ([name, amount]) => ({

            name,
            amount:String(amount)

          })
        );

    }

  }


  return normalized;

}


/* =========================================================
   단체주문 음식 검색
========================================================= */

function renderOrderSearchResults(
  index,
  keyword
){

  const resultBox =
    document.getElementById(
      `orderSearchResults-${index}`
    );


  if(!resultBox){

    return;

  }


  const value =
    String(keyword || "")
      .trim()
      .toLowerCase();


  resultBox.innerHTML = "";


  if(!value){

    resultBox.classList.remove(
      "show"
    );

    return;

  }


  const results =
    all.filter(
      recipe =>
        recipe.name
          .toLowerCase()
          .includes(value)
    )
    .slice(0,20);


  if(
    results.length === 0
  ){

    resultBox.innerHTML = `
      <div class="order-search-result">
        검색 결과가 없습니다.
      </div>
    `;

  }else{

    results.forEach(
      recipe => {

        const row =
          document.createElement(
            "div"
          );

        row.className =
          "order-search-result";


        row.innerHTML = `
          ${recipe.name}

          <span class="grade">
            ${recipe.grade}
          </span>
        `;


        row.addEventListener(
          "click",
          () => {

            groupFoods[index].name =
              recipe.name;


            /*
              음식 선택 시 기존 레시피 재료를
              자동으로 넣어준다.
            */

            groupFoods[index].ingredients =
              Object.entries(
                recipe.ingredients
              )
              .map(
                ([name, amount]) => ({

                  name,
                  amount:String(amount)

                })
              );


            renderOrder();

            scheduleOrderSave();

          }
        );


        resultBox.appendChild(
          row
        );

      }
    );

  }


  resultBox.classList.add(
    "show"
  );

}


/* =========================================================
   단체주문 재료 추가
========================================================= */

function addOrderIngredient(
  foodIndex
){

  if(
    !groupFoods[foodIndex]
  ){

    return;

  }


  if(
    !Array.isArray(
      groupFoods[foodIndex]
        .ingredients
    )
  ){

    groupFoods[foodIndex]
      .ingredients = [];

  }


  groupFoods[foodIndex]
    .ingredients
    .push({

      name:"",
      amount:""

    });


  renderOrder();

}


/* =========================================================
   단체주문 화면
========================================================= */

function renderOrder(){

  orderList.innerHTML = "";


  for(
    let i = 0;
    i < 5;
    i++
  ){

    const food =
      normalizeFood(
        groupFoods[i]
      );


    groupFoods[i] =
      food;


    const row =
      document.createElement(
        "div"
      );

    row.className =
      "order-row";


    /* ---------------------------------------------
       상단
    --------------------------------------------- */

    const top =
      document.createElement(
        "div"
      );

    top.className =
      "order-top";


    const number =
      document.createElement(
        "div"
      );

    number.className =
      "order-number";

    number.textContent =
      i + 1;


    /* 음식 검색 */

    const searchWrap =
      document.createElement(
        "div"
      );

    searchWrap.className =
      "order-search-wrap";


    const foodSearch =
      document.createElement(
        "input"
      );

    foodSearch.className =
      "order-search";

    foodSearch.placeholder =
      "🔎 음식 이름 검색";

    foodSearch.value =
      food.name;


    const resultBox =
      document.createElement(
        "div"
      );

    resultBox.className =
      "order-search-results";

    resultBox.id =
      `orderSearchResults-${i}`;


    searchWrap.appendChild(
      foodSearch
    );

    searchWrap.appendChild(
      resultBox
    );


    /* 금액 */

    const priceInput =
      document.createElement(
        "input"
      );

    priceInput.className =
      "order-price-input";

    priceInput.type =
      "text";

    priceInput.inputMode =
      "numeric";

    priceInput.placeholder =
      "💰 금액 입력";

    priceInput.value =
      food.amount
        ? comma(
            cleanPrice(
              food.amount
            )
          )
        : "";


    /* 가격 표시 */

    const priceDisplay =
      document.createElement(
        "div"
      );

    priceDisplay.className =
      "order-price-display";


    const original =
      document.createElement(
        "div"
      );

    original.className =
      "original";


    const final =
      document.createElement(
        "div"
      );

    final.className =
      "final";


    function updatePrice(){

      const numeric =
        Number(
          cleanPrice(
            priceInput.value
          )
        ) || 0;


      if(numeric > 0){

        original.textContent =
          `입력 금액 ${comma(numeric)}원`;

        final.textContent =
          `${comma(
            getFinalPrice(
              numeric
            )
          )}원`;

      }else{

        original.textContent =
          "금액 미입력";

        final.textContent =
          `${currentBonus}% 적용`;

      }

    }


    updatePrice();


    priceDisplay.appendChild(
      original
    );

    priceDisplay.appendChild(
      final
    );


    top.appendChild(
      number
    );

    top.appendChild(
      searchWrap
    );

    top.appendChild(
      priceInput
    );

    top.appendChild(
      priceDisplay
    );


    row.appendChild(
      top
    );


    /* ---------------------------------------------
       선택된 음식 안내
    --------------------------------------------- */

    if(food.name){

      const info =
        document.createElement(
          "div"
        );

      info.className =
        "order-selected-info";

      const recipe =
        findRecipe(
          food.name
        );


      info.textContent =
        recipe
          ? `선택된 요리 · ${recipe.grade}`
          : "등록된 요리 정보";

      row.appendChild(
        info
      );

    }


    /* ---------------------------------------------
       재료
    --------------------------------------------- */

    const editSection =
      document.createElement(
        "div"
      );

    editSection.className =
      "order-edit-section";


    const sectionTitle =
      document.createElement(
        "div"
      );

    sectionTitle.className =
      "order-section-title";


    const sectionName =
      document.createElement(
        "strong"
      );

    sectionName.textContent =
      "🧾 음식 재료";


    sectionTitle.appendChild(
      sectionName
    );


    if(isAdmin){

      const addButton =
        document.createElement(
          "button"
        );

      addButton.type =
        "button";

      addButton.className =
        "add-ingredient-btn";

      addButton.textContent =
        "+ 재료 추가";


      addButton.addEventListener(
        "click",
        () => {

          addOrderIngredient(
            i
          );

        }
      );


      sectionTitle.appendChild(
        addButton
      );

    }


    editSection.appendChild(
      sectionTitle
    );


    if(isAdmin){

      const editor =
        document.createElement(
          "div"
        );

      editor.className =
        "ingredient-editor";


      if(
        food.ingredients.length === 0
      ){

        const empty =
          document.createElement(
            "div"
          );

        empty.className =
          "no-ingredient";

        empty.textContent =
          "등록된 재료가 없습니다. '+ 재료 추가'를 눌러 입력하세요.";

        editor.appendChild(
          empty
        );

      }else{

        food.ingredients.forEach(
          (ingredient, ingredientIndex) => {

            const ingredientRow =
              document.createElement(
                "div"
              );

            ingredientRow.className =
              "ingredient-edit-row";


            const nameInput =
              document.createElement(
                "input"
              );

            nameInput.type =
              "text";

            nameInput.placeholder =
              "재료 이름";

            nameInput.value =
              ingredient.name;


            const amountInput =
              document.createElement(
                "input"
              );

            amountInput.type =
              "text";

            amountInput.inputMode =
              "numeric";

            amountInput.placeholder =
              "재료 양";

            amountInput.value =
              ingredient.amount;


            const removeButton =
              document.createElement(
                "button"
              );

            removeButton.type =
              "button";

            removeButton.className =
              "remove-ingredient-btn";

            removeButton.textContent =
              "×";


            nameInput.addEventListener(
              "input",
              () => {

                groupFoods[i]
                  .ingredients[
                    ingredientIndex
                  ].name =
                    nameInput.value;

                scheduleOrderSave();

              }
            );


            amountInput.addEventListener(
              "input",
              () => {

                groupFoods[i]
                  .ingredients[
                    ingredientIndex
                  ].amount =
                    amountInput.value
                      .replace(
                        /[^\d]/g,
                        ""
                      );

                scheduleOrderSave();

              }
            );


            removeButton.addEventListener(
              "click",
              () => {

                groupFoods[i]
                  .ingredients
                  .splice(
                    ingredientIndex,
                    1
                  );

                renderOrder();

                scheduleOrderSave();

              }
            );


            ingredientRow.appendChild(
              nameInput
            );

            ingredientRow.appendChild(
              amountInput
            );

            ingredientRow.appendChild(
              removeButton
            );


            editor.appendChild(
              ingredientRow
            );

          }
        );

      }


      editSection.appendChild(
        editor
      );

    }else{

      const view =
        document.createElement(
          "div"
        );

      view.className =
        "ingredient-view";


      if(
        food.ingredients.length === 0
      ){

        const empty =
          document.createElement(
            "div"
          );

        empty.className =
          "no-ingredient";

        empty.textContent =
          "등록된 재료가 없습니다.";

        view.appendChild(
          empty
        );

      }else{

        food.ingredients.forEach(
          ingredient => {

            const ingredientRow =
              document.createElement(
                "div"
              );

            ingredientRow.className =
              "ingredient-view-row";


            const name =
              document.createElement(
                "span"
              );

            name.className =
              "ingredient-view-name";

            name.textContent =
              ingredient.name ||
              "재료";


            const amount =
              document.createElement(
                "span"
              );

            amount.className =
              "ingredient-view-amount";

            amount.textContent =
              ingredient.amount
                ? `${comma(
                    ingredient.amount
                  )}개`
                : "-";


            ingredientRow.appendChild(
              name
            );

            ingredientRow.appendChild(
              amount
            );


            view.appendChild(
              ingredientRow
            );

          }
        );

      }


      editSection.appendChild(
        view
      );

    }


    row.appendChild(
      editSection
    );


    /* ---------------------------------------------
       관리자 이벤트
    --------------------------------------------- */

    if(isAdmin){

      foodSearch.addEventListener(
        "input",
        () => {

          groupFoods[i].name =
            foodSearch.value;

          renderOrderSearchResults(
            i,
            foodSearch.value
          );

          scheduleOrderSave();

        }
      );


      foodSearch.addEventListener(
        "focus",
        () => {

          if(
            foodSearch.value.trim()
          ){

            renderOrderSearchResults(
              i,
              foodSearch.value
            );

          }

        }
      );


      priceInput.addEventListener(
        "input",
        () => {

          const numeric =
            cleanPrice(
              priceInput.value
            );


          groupFoods[i].amount =
            numeric;


          priceInput.value =
            numeric
              ? comma(numeric)
              : "";


          updatePrice();

          scheduleOrderSave();

        }
      );


      priceInput.addEventListener(
        "blur",
        updatePrice
      );


      foodSearch.disabled =
        false;

      priceInput.readOnly =
        false;

    }else{

      foodSearch.readOnly =
        true;

      priceInput.readOnly =
        true;

    }


    orderList.appendChild(
      row
    );

  }

}


/* =========================================================
   Firestore 저장 예약
========================================================= */

let saveTimer =
  null;


function scheduleOrderSave(){

  if(!isAdmin){

    return;

  }


  clearTimeout(
    saveTimer
  );


  saveTimer =
    setTimeout(
      saveOrder,
      700
    );

}


/* =========================================================
   Firestore 저장
========================================================= */

async function saveOrder(){

  if(!isAdmin){

    return;

  }


  try{

    await setDoc(
      orderRef,
      {

        foods:
          groupFoods
            .slice(0,5)
            .map(
              food => ({

                name:
                  String(
                    food.name || ""
                  ),

                amount:
                  String(
                    cleanPrice(
                      food.amount
                    )
                  ),

                ingredients:
                  Array.isArray(
                    food.ingredients
                  )
                    ? food.ingredients
                        .map(
                          item => ({

                            name:
                              String(
                                item.name || ""
                              ),

                            amount:
                              String(
                                item.amount || ""
                              )

                          })
                        )
                        .filter(
                          item =>
                            item.name ||
                            item.amount
                        )
                    : []

              })
            ),

        updatedAt:
          serverTimestamp()

      },

      {
        merge:true
      }
    );


    orderStatus.textContent =
      "저장 완료";

    orderStatus.classList.add(
      "admin"
    );


  }catch(error){

    console.error(
      "Firestore 저장 오류:",
      error
    );


    orderStatus.textContent =
      "저장 실패 · Firestore 권한을 확인하세요.";

  }

}


saveOrderBtn.addEventListener(
  "click",
  saveOrder
);


/* =========================================================
   Firestore 실시간 수신
========================================================= */

onSnapshot(
  orderRef,

  snapshot => {

    if(
      snapshot.exists()
    ){

      const data =
        snapshot.data();


      if(
        Array.isArray(
          data.foods
        )
      ){

        groupFoods =
          Array.from(
            {length:5},
            (_, index) =>
              normalizeFood(
                data.foods[index]
              )
          );

      }

    }


    renderOrder();


    if(isAdmin){

      orderStatus.textContent =
        "관리자 모드 · 실시간 저장";

      orderStatus.classList.add(
        "admin"
      );

    }else{

      orderStatus.textContent =
        "실시간 주문 정보";

      orderStatus.classList.remove(
        "admin"
      );

    }

  },

  error => {

    console.error(
      "Firestore 읽기 오류:",
      error
    );


    orderStatus.textContent =
      "주문 정보를 불러오지 못했습니다.";

  }
);


/* =========================================================
   관리자 모드
========================================================= */

function setAdminMode(
  value
){

  isAdmin =
    value;


  if(isAdmin){

    adminControls.classList.remove(
      "hidden"
    );

    loginControls.classList.add(
      "hidden"
    );

    loginBox.classList.remove(
      "show"
    );

    orderStatus.textContent =
      "관리자 모드 · 수정 가능";

    orderStatus.classList.add(
      "admin"
    );

  }else{

    adminControls.classList.add(
      "hidden"
    );

    loginControls.classList.remove(
      "hidden"
    );

    orderStatus.textContent =
      "실시간 주문 정보";

    orderStatus.classList.remove(
      "admin"
    );

  }


  renderOrder();

}

/* =========================================================

========================================================= */

loginBtn.addEventListener(
  "click",
  async () => {

    const email =
      loginEmail.value.trim();

    const password =
      loginPassword.value;


    if(
      !email ||
      !password
    ){

      loginMessage.textContent =
        "이메일과 비밀번호를 입력해주세요.";

      return;

    }


    loginMessage.textContent =
      "로그인 중...";


    try{

      const credential =
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


      if(
        credential.user.uid !==
        ADMIN_UID
      ){

        await signOut(
          auth
        );


        loginMessage.textContent =
          "관리자 계정이 아닙니다.";

        return;

      }


      loginPassword.value =
        "";

      loginMessage.textContent =
        "";

      loginBox.classList.remove(
        "show"
      );


    }catch(error){

      console.error(
        error
      );


      loginMessage.textContent =
        "로그인에 실패했습니다. 이메일 또는 비밀번호를 확인해주세요.";

    }

  }
);

      );

    }catch(error){

      );

    }

  }
);


/* =========================================================

renderCategories();

renderRecipeGrid();

renderOrder();
