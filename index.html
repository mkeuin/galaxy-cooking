<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>은하 요리 계산기</title>

<style>

:root{
  --bg:#080a1f;
  --panel:rgba(16,19,48,.88);
  --panel2:rgba(28,32,75,.82);
  --text:#f4f5ff;
  --muted:#b9bddb;
  --line:rgba(255,255,255,.13);
  --accent:#9b8cff;
  --accent2:#61d6ff;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);

  font-family:
    "Malgun Gothic",
    "Apple SD Gothic Neo",
    sans-serif;

  background:
    radial-gradient(circle at 15% 20%,rgba(111,76,255,.38),transparent 28%),
    radial-gradient(circle at 85% 25%,rgba(0,180,255,.23),transparent 25%),
    radial-gradient(circle at 50% 90%,rgba(180,50,255,.18),transparent 30%),
    linear-gradient(135deg,#050614,#101434 55%,#070818);
}

body:before{
  content:"✦  ·  ✧     ·       ✦       ·  ✧      ·       ✦       ·    ✧";
  position:fixed;
  left:0;
  top:0;
  width:50%;
  height:100%;
  pointer-events:none;
  opacity:.45;
  font-size:32px;
  letter-spacing:24px;
  line-height:140px;
  overflow:hidden;
  z-index:0;
}

body:after{
  content:"✧  ·  ✦     ·       ✧       ·  ✦       ·  ✧      ·       ✦";
  position:fixed;
  right:0;
  top:0;
  width:50%;
  height:100%;
  pointer-events:none;
  opacity:.45;
  font-size:32px;
  letter-spacing:24px;
  line-height:140px;
  overflow:hidden;
  text-align:right;
  z-index:0;
}

.app{
  position:relative;
  z-index:1;
  max-width:1150px;
  margin:auto;
  padding:25px 16px 45px;
}

.hero{
  text-align:center;
  margin-bottom:18px;
}

.hero h1{
  margin:0;
  font-size:clamp(28px,5vw,48px);
  text-shadow:0 0 24px rgba(150,120,255,.7);
}

.hero p{
  color:var(--muted);
  margin:8px 0 0;
  font-size:17px;
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  backdrop-filter:blur(14px);
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.controls{
  padding:18px;
  margin-bottom:16px;
}

.search{
  width:100%;
  padding:16px 18px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#080a20;
  color:var(--text);
  font-size:19px;
  outline:none;
}

.recipe-list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:8px;
  margin-top:14px;
  max-height:300px;
  overflow:auto;
}

.recipe-btn{
  padding:15px;
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:12px;
  cursor:pointer;
  text-align:left;
  font-size:19px;
  font-weight:bold;
}

.recipe-btn:hover,
.recipe-btn.active{
  border-color:var(--accent2);
  box-shadow:0 0 16px rgba(97,214,255,.22);
}

.grade{
  font-size:14px;
  opacity:.75;
  display:block;
  margin-bottom:5px;
}

.content{
  padding:20px;
}

.selected{
  font-size:26px;
  font-weight:bold;
  margin:0 0 16px;
}

.result{
  padding:18px;
  border-radius:16px;
  background:
    linear-gradient(
      135deg,
      rgba(110,85,255,.22),
      rgba(55,180,255,.14)
    );
  border:1px solid rgba(150,150,255,.28);
  margin-bottom:18px;
  font-size:18px;
}

.result strong{
  font-size:clamp(28px,4vw,42px);
  display:block;
  margin-top:6px;
}

.section-title{
  font-size:21px;
  font-weight:bold;
  margin:22px 0 10px;
}

.table{
  width:100%;
  border-collapse:collapse;
  overflow:hidden;
  border-radius:14px;
  font-size:16px;
}

th,
td{
  padding:13px 10px;
  border-bottom:1px solid var(--line);
  text-align:center;
}

th{
  color:#d9d7ff;
  background:rgba(255,255,255,.05);
  font-size:16px;
}

td:first-child{
  text-align:left;
  font-weight:bold;
}

input.num{
  width:90px;
  padding:11px;
  border-radius:9px;
  border:1px solid var(--line);
  background:#090b23;
  color:white;
  text-align:center;
  font-size:17px;
}

input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0;
}

input[type="number"]{
  -moz-appearance:textfield;
  appearance:textfield;
}

.owned{
  white-space:nowrap;
}

.subrecipes{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:8px;
}

.sub{
  padding:13px 14px;
  border-radius:10px;
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  font-size:16px;
}

.note{
  color:var(--muted);
  font-size:14px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px;
  font-size:18px;
}

.category-row td{
  text-align:left !important;
  font-size:18px !important;
  font-weight:bold !important;
  padding:14px 12px !important;
  background:rgba(255,255,255,.08);
  border-top:1px solid var(--line);
}


/* ==================================================
   단체주문
================================================== */

.group-card{
  padding:20px;
  margin-bottom:16px;
}

.group-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.group-title{
  font-size:25px;
  font-weight:bold;
}

.group-subtitle{
  color:var(--muted);
  font-size:14px;
  margin-top:4px;
}

.discount-buttons{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.discount-btn{
  border:1px solid var(--line);
  background:rgba(255,255,255,.06);
  color:var(--text);
  border-radius:10px;
  padding:10px 15px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.discount-btn:hover{
  border-color:var(--accent2);
}

.discount-btn.active{
  background:linear-gradient(
    135deg,
    rgba(110,85,255,.45),
    rgba(55,180,255,.25)
  );
  border-color:var(--accent2);
  box-shadow:0 0 14px rgba(97,214,255,.2);
}

.group-orders{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-top:15px;
}

.order-box{
  padding:15px;
  border-radius:13px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.05);
}

.order-number{
  color:var(--accent2);
  font-weight:bold;
  font-size:14px;
  margin-bottom:8px;
}

.order-food{
  font-size:18px;
  font-weight:bold;
  margin-bottom:6px;
  min-height:26px;
}

.order-amount{
  color:var(--muted);
}

.order-discount{
  margin-top:9px;
  color:#d9d7ff;
  font-size:14px;
}

.admin-area{
  margin-top:18px;
  padding:15px;
  border-radius:13px;
  background:rgba(0,0,0,.2);
  border:1px solid var(--line);
}

.admin-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
}

.admin-order{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.admin-order label{
  font-size:13px;
  color:var(--muted);
}

.admin-order input{
  width:100%;
  padding:10px;
  border-radius:9px;
  border:1px solid var(--line);
  background:#090b23;
  color:white;
  font-size:15px;
  outline:none;
}

.admin-save{
  margin-top:12px;
  padding:11px 18px;
  border:0;
  border-radius:10px;
  background:linear-gradient(135deg,#7463ff,#45cfff);
  color:white;
  font-weight:bold;
  cursor:pointer;
  font-size:15px;
}

.admin-save:hover{
  filter:brightness(1.1);
}

.login-area{
  margin-top:12px;
}

.login-btn{
  padding:9px 14px;
  border-radius:9px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.06);
  color:var(--text);
  cursor:pointer;
}

.admin-status{
  color:var(--muted);
  font-size:13px;
}

.hidden{
  display:none !important;
}


/* 모바일 */

@media(max-width:850px){

  .group-orders{
    grid-template-columns:repeat(2,1fr);
  }

  .admin-grid{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:700px){

  .app{
    padding:14px 8px 30px;
  }

  .content,
  .controls,
  .group-card{
    padding:13px;
  }

  th:nth-child(2),
  td:nth-child(2){
    display:none;
  }

  .table{
    font-size:13px;
  }

  input.num{
    width:60px;
  }

  .recipe-btn{
    font-size:18px;
  }

  body:before,
  body:after{
    font-size:24px;
    letter-spacing:14px;
    line-height:110px;
  }

}

</style>

</head>


<body>

<div class="app">


  <div class="hero">

    <h1>
      🌌 은하 요리 계산기 🍳
    </h1>

    <p>
      64개 = 1세트 · 보유 재료를 세트 + 낱개로 입력하세요
    </p>

  </div>


  <!-- ==================================================
       단체주문
  ================================================== -->

  <div class="card group-card">

    <div class="group-header">

      <div>
        <div class="group-title">
          📦 단체주문
        </div>

        <div class="group-subtitle">
          현재 단체주문 정보를 확인하세요
        </div>
      </div>


      <div>

        <div class="discount-buttons">

          <button
            class="discount-btn active"
            data-discount="0"
            onclick="selectDiscount(0)"
          >
            0%
          </button>

          <button
            class="discount-btn"
            data-discount="5"
            onclick="selectDiscount(5)"
          >
            5%
          </button>

          <button
            class="discount-btn"
            data-discount="10"
            onclick="selectDiscount(10)"
          >
            10%
          </button>

          <button
            class="discount-btn"
            data-discount="15"
            onclick="selectDiscount(15)"
          >
            15%
          </button>

        </div>

      </div>

    </div>


    <div
      id="groupOrders"
      class="group-orders"
    >

      <div class="empty">
        단체주문 정보를 불러오는 중...
      </div>

    </div>


    <!-- 관리자 영역 -->

    <div
      id="adminArea"
      class="admin-area hidden"
    >

      <div class="section-title" style="margin-top:0">
        ⚙️ 관리자 단체주문 수정
      </div>

      <div
        id="adminGrid"
        class="admin-grid"
      ></div>

      <button
        class="admin-save"
        onclick="saveGroupOrders()"
      >
        💾 단체주문 저장
      </button>

    </div>


    <div class="login-area">

      <span
        id="adminStatus"
        class="admin-status"
      >
        일반 사용자 모드
      </span>

      <button
        id="loginButton"
        class="login-btn"
        onclick="adminLogin()"
      >
        관리자 로그인
      </button>

    </div>

  </div>


  <!-- ==================================================
       검색
  ================================================== -->

  <div class="card controls">

    <input
      id="search"
      class="search"
      placeholder="🔎 요리 이름을 검색하세요"
    >

    <div
      id="recipeList"
      class="recipe-list"
    ></div>

  </div>


  <!-- ==================================================
       계산
  ================================================== -->

  <div class="card content">

    <div
      id="appContent"
      class="empty"
    >
      위에서 요리를 선택해주세요.
    </div>

  </div>

</div>


<script type="module">


/* ==================================================
   FIREBASE
================================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBi3CTzTaWPwDJ9CgwuRgpROac45Ag-54Y",

  authDomain:
    "galaxy-cooking.firebaseapp.com",

  projectId:
    "galaxy-cooking",

  storageBucket:
    "galaxy-cooking.firebasestorage.app",

  messagingSenderId:
    "885308286326",

  appId:
    "1:885308286326:web:ceeec8b4491cd9385a0657"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getFirestore(app);


const auth =
  getAuth(app);


/*
  이전에 지정한 관리자 UID
*/

const ADMIN_UID =
  "5xfn6hpdXHeZ73wSYhHKkyLPnmF2";


let isAdmin = false;


/* ==================================================
   단체주문 기본값
================================================== */

let groupOrders = [

  {
    food:"",
    amount:""
  },

  {
    food:"",
    amount:""
  },

  {
    food:"",
    amount:""
  },

  {
    food:"",
    amount:""
  },

  {
    food:"",
    amount:""
  }

];


let selectedDiscount = 0;


/* ==================================================
   단체주문 Firebase 불러오기
================================================== */

async function loadGroupOrders(){

  try{

    const ref =
      doc(
        db,
        "cookingOrder",
        "main"
      );

    const snap =
      await getDoc(ref);


    if(snap.exists()){

      const data =
        snap.data();


      if(
        Array.isArray(
          data.orders
        )
      ){

        groupOrders =
          data.orders;

      }

    }


  }catch(error){

    console.error(
      "단체주문 불러오기 오류:",
      error
    );

  }


  renderGroupOrders();

}


async function saveGroupOrders(){

  if(!isAdmin){

    alert(
      "관리자만 수정할 수 있습니다."
    );

    return;

  }


  const inputs =
    document.querySelectorAll(
      ".admin-food"
    );

  const amounts =
    document.querySelectorAll(
      ".admin-amount"
    );


  const newOrders = [];


  for(
    let i=0;
    i<5;
    i++
  ){

    newOrders.push({

      food:
        inputs[i].value.trim(),

      amount:
        amounts[i].value.trim()

    });

  }


  try{

    await setDoc(

      doc(
        db,
        "cookingOrder",
        "main"
      ),

      {
        orders:newOrders,
        updatedAt:
          new Date()
      }

    );


    groupOrders =
      newOrders;


    renderGroupOrders();


    alert(
      "단체주문 정보가 저장되었습니다."
    );


  }catch(error){

    console.error(error);

    alert(
      "저장 중 오류가 발생했습니다.\n\n"
      + error.message
    );

  }

}


/* ==================================================
   단체주문 화면
================================================== */

function renderGroupOrders(){

  const container =
    document.getElementById(
      "groupOrders"
    );


  container.innerHTML = "";


  for(
    let i=0;
    i<5;
    i++
  ){

    const order =
      groupOrders[i]
      || {
        food:"",
        amount:""
      };


    const food =
      order.food
      || "주문 없음";


    const amount =
      order.amount
      || "-";


    const box =
      document.createElement(
        "div"
      );


    box.className =
      "order-box";


    box.innerHTML = `

      <div class="order-number">
        ${i+1}번 주문
      </div>

      <div class="order-food">
        ${escapeHtml(food)}
      </div>

      <div class="order-amount">
        수량 : ${escapeHtml(amount)}
      </div>

      <div class="order-discount">
        선택 할인율 : ${selectedDiscount}%
      </div>

    `;


    container.appendChild(box);

  }


  renderAdminEditor();

}


function renderAdminEditor(){

  const grid =
    document.getElementById(
      "adminGrid"
    );


  if(!isAdmin){

    grid.innerHTML = "";

    return;

  }


  grid.innerHTML = "";


  for(
    let i=0;
    i<5;
    i++
  ){

    const order =
      groupOrders[i]
      || {
        food:"",
        amount:""
      };


    grid.innerHTML += `

      <div class="admin-order">

        <label>
          ${i+1}번 음식
        </label>

        <input
          class="admin-food"
          type="text"
          value="${escapeAttribute(order.food || "")}"
          placeholder="음식 이름"
        >

        <label>
          수량
        </label>

        <input
          class="admin-amount"
          type="text"
          value="${escapeAttribute(order.amount || "")}"
          placeholder="수량"
        >

      </div>

    `;

  }

}


function selectDiscount(value){

  selectedDiscount =
    value;


  document
    .querySelectorAll(
      ".discount-btn"
    )
    .forEach(btn=>{

      btn.classList.toggle(

        "active",

        Number(
          btn.dataset.discount
        ) === value

      );

    });


  renderGroupOrders();

}


function escapeHtml(value){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(value){

  return escapeHtml(value);

}


/* ==================================================
   관리자 로그인
================================================== */

window.adminLogin =
  async function(){

    const email =
      prompt(
        "관리자 이메일을 입력하세요."
      );


    if(!email){

      return;

    }


    const password =
      prompt(
        "관리자 비밀번호를 입력하세요."
      );


    if(!password){

      return;

    }


    try{

      await signInWithEmailAndPassword(

        auth,
        email,
        password

      );


    }catch(error){

      console.error(error);

      alert(
        "관리자 로그인에 실패했습니다.\n\n"
        + error.message
      );

    }

  };


onAuthStateChanged(
  auth,
  user=>{

    isAdmin =
      !!user
      &&
      user.uid === ADMIN_UID;


    const area =
      document.getElementById(
        "adminArea"
      );

    const status =
      document.getElementById(
        "adminStatus"
      );

    const button =
      document.getElementById(
        "loginButton"
      );


    if(isAdmin){

      area.classList.remove(
        "hidden"
      );

      status.textContent =
        "🔐 관리자 로그인 상태";

      button.textContent =
        "관리자 로그인됨";

    }else{

      area.classList.add(
        "hidden"
      );

      status.textContent =
        "일반 사용자 모드";

      button.textContent =
        "관리자 로그인";

    }


    renderAdminEditor();

  });


/* ==================================================
   요리 데이터
================================================== */

const STACK = 64;


const recipes = {

"일반":{

"요정 피쉬 꽃튀김":{
"요정 피쉬":1,
"마나블라썸":4,
"밀가루":4,
"빵가루":4
},

"호박 마나푸딩":{
"마나블라썸":4,
"호박 퓌레":4,
"우유":4,
"각설탕":4
},

"젤리 버섯 크림수프":{
"젤리버섯":6,
"우유":4,
"밀가루":4
},

"피치 가지 디저트구이":{
"피치가지":4,
"수박시럽":4,
"각설탕":4,
"우유":4
},

"피치가지 크림닭구이":{
"피치가지":4,

/* ==================================================
   레시피 확장
================================================== */

function expandRecipe(
  name,
  amount=1,
  result={}
){

  for(
    const [item,need]
    of Object.entries(
      all[name]
    )
  ){

    const total =
      need * amount;


    if(all[item]){

      expandRecipe(
        item,
        total,
        result
      );

    }else{

      result[item] =
        (result[item] || 0)
        + total;

    }

  }


  return result;

}


/* ==================================================
   세트 표시
================================================== */

function formatStack(n){

  const sets =
    Math.floor(
      n / STACK
    );

  const pieces =
    n % STACK;


  if(sets && pieces){

    return `${n.toLocaleString()}개 (${sets}세트 + ${pieces}개)`;

  }


  if(sets){

    return `${n.toLocaleString()}개 (${sets}세트)`;

  }


  return `${n.toLocaleString()}개`;

}


/* ==================================================
   카테고리
================================================== */

const FISH = [

  "요정 피쉬",
  "엔젤 피쉬",
  "다크 피쉬",
  "고스트 피쉬",
  "홀로그램 피쉬"

];


const CROPS = [

  "마나블라썸",
  "피치가지",
  "젤리버섯",
  "팬텀 양배추",
  "레드펄 양파",
  "슬라임 콜라비",
  "엔더 콩",
  "초승달 무"

];


function getIngredientCategory(name){

  if(FISH.includes(name)){

    return 1;

  }

  if(CROPS.includes(name)){

    return 2;

  }

  return 3;

}


function getCategoryName(category){

  if(category===1){

    return "🐟 피쉬";

  }

  if(category===2){

    return "🌱 작물";

  }

  return "🧂 가공재료";

}


/* ==================================================
   재료 행
================================================== */

function createIngredientRow(
  name,
  need
){

  return `

    <tr>

      <td>
        ${name}
      </td>

      <td>
        ${need}개
      </td>

      <td
        class="owned"
        id="owned-${cssId(name)}"
      >
        0개
      </td>

      <td>

        <input
          class="num set-input"
          data-name="${name}"
          type="number"
          min="0"
          value="0"
        >

      </td>

      <td>

        <input
          class="num piece-input"
          data-name="${name}"
          type="number"
          min="0"
          value="0"
        >

      </td>

    </tr>

  `;

}


/* ==================================================
   그룹 재료
================================================== */

function createGroupedIngredientRows(
  ingredients
){

  const groups = {
    1:[],
    2:[],
    3:[]
  };


  Object
  .entries(ingredients)
  .forEach(([name,need])=>{

    const category =
      getIngredientCategory(name);

    groups[category].push([
      name,
      need
    ]);

  });


  let html = "";


  for(
    let category=1;
    category<=3;
    category++
  ){

    if(
      groups[category].length===0
    ){

      continue;

    }


    groups[category].sort(
      ([a],[b])=>
        a.localeCompare(b,"ko")
    );


    html += `

      <tr class="category-row">

        <td colspan="5">
          ${getCategoryName(category)}
        </td>

      </tr>

    `;


    groups[category]
    .forEach(([name,need])=>{

      html +=
        createIngredientRow(
          name,
          need
        );

    });

  }


  return html;

}


/* ==================================================
   CSS ID
================================================== */

function cssId(name){

  return btoa(
    unescape(
      encodeURIComponent(name)
    )
  )
  .replace(
    /[^a-zA-Z0-9]/g,
    ""
  );

}


/* ==================================================

================================================== */

function renderList(){

  const q =
    document
    .getElementById("search")
    .value
    .trim()
    .toLowerCase();


  const list =
    document.getElementById(
      "recipeList"
    );


  list.innerHTML = "";


  for(
    const [grade,group]
    of Object.entries(recipes)
  ){

    for(
      const name
      of Object.keys(group)
    ){

      if(
        (grade+" "+name)
        .toLowerCase()
        .includes(q)
      ){

        const button =
          document.createElement(
            "button"
          );


        button.className =
          "recipe-btn"
          +
          (
            selected===name
            ? " active"
            : ""
          );


        button.innerHTML = `

          <span class="grade">
            ${grade}
          </span>

          ${name}

        `;


        button.onclick = ()=>{

          selectRecipe(
            grade,
            name
          );

        };


        list.appendChild(
          button
        );

      }

    }

  }

}

/* ==================================================

================================================== */

function renderRecipe(){

    );


  const isHighGrade =
    selectedGrade==="전설"
    ||

  const ingredients =
    isHighGrade
    ? expandRecipe(selected)
    : all[selected];


  const sub =
    isHighGrade
    ? all[selected]
    : null;


  let subHtml = "";


  if(sub){

    subHtml = `

      <div class="section-title">
        🥘 필요한 하위 요리
      </div>

      <div class="subrecipes">

        ${
          Object.entries(sub)
          .map(
            ([name,amount])=>`

              <div class="sub">
                ${name} × ${amount}
              </div>

            `
          )
          .join("")
        }

      </div>

      <div class="section-title">
        📋 실제 기본 재료
      </div>

    `;

  }


  const ingredientRows =
    isHighGrade

    ?

    createGroupedIngredientRows(
      ingredients
    )

    :

    Object
    .entries(ingredients)
    .map(
      ([name,need])=>
        createIngredientRow(
          name,
          need
        )
    )
    .join("");


  content.innerHTML = `

    <div class="selected">

      [${selectedGrade}]
      ${selected}

    </div>


    <div class="result">

      <span>
        🍲 만들 수 있는 요리
      </span>

      <strong id="result">
        0개
      </strong>

      <div class="note">
        가장 부족한 재료를 기준으로 자동 계산됩니다.
      </div>

    </div>


    ${subHtml}


    <div style="overflow:auto">

      <table class="table">

        <thead>

          <tr>

            <th>재료</th>

            <th>
              요리 1개 필요량
            </th>

            <th>
              보유량
            </th>

            <th>
              세트
            </th>

            <th>
              낱개
            </th>

          </tr>

        </thead>


        <tbody>

          ${ingredientRows}

        </tbody>

      </table>

    </div>

  `;


  document
  .querySelectorAll(
    ".set-input,.piece-input"
  )
  .forEach(el=>{

    el.addEventListener(
      "input",
      updateCalculation
    );


    el.addEventListener(
      "keydown",
      handleTab
    );

  });


  updateCalculation();

}


/* ==================================================
   계산
================================================== */

function updateCalculation(){

  if(!selected){

    return;

  }


  const req =
    (
      selectedGrade==="전설"
      ||
      selectedGrade==="신화"
    )
    ?
    expandRecipe(selected)
    :
    all[selected];


  let possible =
    Infinity;


  for(
    const [name,need]
    of Object.entries(req)
  ){

    const setInput =
      document.querySelector(
        `.set-input[data-name="${CSS.escape(name)}"]`
      );


    const pieceInput =
      document.querySelector(
        `.piece-input[data-name="${CSS.escape(name)}"]`
      );


    if(
      !setInput
      ||
      !pieceInput
    ){

      continue;

    }


    const sets =
      Math.max(
        0,
        Number(
          setInput.value
        ) || 0
      );


    const pieces =
      Math.max(
        0,
        Number(
          pieceInput.value
        ) || 0
      );


    const owned =
      Math.floor(sets)*STACK
      +
      Math.floor(pieces);


    possible =
      Math.min(
        possible,
        Math.floor(
          owned / need
        )
      );


    const cell =
      document.getElementById(
        "owned-"+cssId(name)
      );


    if(cell){

      cell.textContent =
        formatStack(owned);

    }

  }


  if(possible===Infinity){

    possible=0;

  }


  document
  .getElementById("result")
  .textContent =
    formatStack(possible);

}


/* ==================================================
   TAB
================================================== */

function handleTab(e){

  if(e.key!=="Tab"){

    return;

  }


  const inputs = [

    ...document.querySelectorAll(
      ".set-input,.piece-input"
    )

  ];


  const index =
    inputs.indexOf(
      e.target
    );


  if(index<0){

    return;

  }


  e.preventDefault();


  let next;


  if(e.shiftKey){

    next =
      inputs[
        Math.max(
          0,
          index-1
        )
      ];

  }else{

    next =
      inputs[
        Math.min(
          inputs.length-1,
          index+1
        )
      ];

  }


  next.focus();
  next.select();

}
