<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>은하 요리 계산기</title>

<style>
:root{
  --bg:#080a1f;
  --panel:rgba(16,19,48,.88);
  --panel2:rgba(28,32,75,.82);
  --text:#f4f5ff;
  --muted:#b9bddb;
  --line:rgba(255,255,255,.13);
  --accent:#9b8cff;
  --accent2:#61d6ff;
  --success:#68e0a0;
  --danger:#ff647c;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  background:
    radial-gradient(circle at 15% 20%,rgba(111,76,255,.38),transparent 28%),
    radial-gradient(circle at 85% 25%,rgba(0,180,255,.23),transparent 25%),
    radial-gradient(circle at 50% 90%,rgba(180,50,255,.18),transparent 30%),
    linear-gradient(135deg,#050614,#101434 55%,#070818);
}

body:before{
  content:"✦ · ✧     ·       ✦       · ✧      ·       ✦       · ✧";
  position:fixed;
  left:0;
  top:0;
  width:50%;
  height:100%;
  pointer-events:none;
  opacity:.45;
  font-size:32px;
  letter-spacing:24px;
  line-height:140px;
  overflow:hidden;
  z-index:0;
}

body:after{
  content:"✧ · ✦     ·       ✧       · ✦       · ✧      ·       ✦";
  position:fixed;
  right:0;
  top:0;
  width:50%;
  height:100%;
  pointer-events:none;
  opacity:.45;
  font-size:32px;
  letter-spacing:24px;
  line-height:140px;
  overflow:hidden;
  text-align:right;
  z-index:0;
}

.app{
  position:relative;
  z-index:1;
  max-width:1150px;
  margin:auto;
  padding:25px 16px 45px;
}

.hero{
  text-align:center;
  margin-bottom:18px;
}

.hero h1{
  margin:0;
  font-size:clamp(28px,5vw,48px);
  text-shadow:0 0 24px rgba(150,120,255,.7);
}

.hero p{
  color:var(--muted);
  margin:8px 0 0;
  font-size:17px;
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  backdrop-filter:blur(14px);
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.controls{
  padding:18px;
  margin-bottom:16px;
}

.search{
  width:100%;
  padding:16px 18px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#080a20;
  color:var(--text);
  font-size:19px;
  outline:none;
}

.recipe-list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:8px;
  margin-top:14px;
  max-height:300px;
  overflow:auto;
}

.recipe-btn{
  padding:15px;
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:12px;
  cursor:pointer;
  text-align:left;
  font-size:19px;
  font-weight:bold;
}

.recipe-btn:hover,
.recipe-btn.active{
  border-color:var(--accent2);
  box-shadow:0 0 16px rgba(97,214,255,.22);
}

.grade{
  font-size:14px;
  opacity:.75;
  display:block;
  margin-bottom:5px;
}

.content{padding:20px}

.selected{
  font-size:26px;
  font-weight:bold;
  margin:0 0 16px;
}

.result{
  padding:18px;
  border-radius:16px;
  background:linear-gradient(135deg,rgba(110,85,255,.22),rgba(55,180,255,.14));
  border:1px solid rgba(150,150,255,.28);
  margin-bottom:18px;
  font-size:18px;
}

.result strong{
  font-size:clamp(28px,4vw,42px);
  display:block;
  margin-top:6px;
}

.section-title{
  font-size:21px;
  font-weight:bold;
  margin:22px 0 10px;
}

.table{
  width:100%;
  border-collapse:collapse;
  overflow:hidden;
  border-radius:14px;
  font-size:16px;
}

th,td{
  padding:13px 10px;
  border-bottom:1px solid var(--line);
  text-align:center;
}

th{
  color:#d9d7ff;
  background:rgba(255,255,255,.05);
}

td:first-child{
  text-align:left;
  font-weight:bold;
}

input.num{
  width:90px;
  padding:11px;
  border-radius:9px;
  border:1px solid var(--line);
  background:#090b23;
  color:white;
  text-align:center;
  font-size:17px;
}

input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0;
}

input[type="number"]{
  -moz-appearance:textfield;
  appearance:textfield;
}

.owned{white-space:nowrap}

.subrecipes{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:8px;
}

.sub{
  padding:13px 14px;
  border-radius:10px;
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  font-size:16px;
}

.note{
  color:var(--muted);
  font-size:14px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px;
  font-size:18px;
}

.category-row td{
  text-align:left!important;
  font-size:18px!important;
  font-weight:bold!important;
  padding:14px 12px!important;
  background:rgba(255,255,255,.08);
}

/* 상단 관리자 */
.top-actions{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:15px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid var(--line);
  background:rgba(255,255,255,.07);
  color:white;
  padding:11px 16px;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
}

.btn:hover{filter:brightness(1.15)}

.btn-primary{
  background:rgba(155,140,255,.25);
  border-color:rgba(155,140,255,.6);
}

.btn-success{
  background:rgba(104,224,160,.14);
  border-color:rgba(104,224,160,.4);
}

.btn-danger{
  background:rgba(255,100,124,.14);
  border-color:rgba(255,100,124,.4);
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

/* 단체 주문 */
.group-card{
  padding:20px;
  margin-top:16px;
}

.group-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.group-title{
  font-size:23px;
  font-weight:bold;
}

.group-note{
  color:var(--muted);
  font-size:14px;
  margin-top:5px;
}

.group-list{
  margin-top:15px;
}

.group-item{
  padding:15px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  border-radius:13px;
  margin-bottom:9px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.group-item-name{
  font-size:18px;
  font-weight:bold;
}

.group-item-info{
  color:var(--muted);
  font-size:14px;
  margin-top:5px;
}

.group-price{
  text-align:right;
  white-space:nowrap;
}

.group-price .base{
  color:var(--muted);
  font-size:12px;
}

.group-price strong{
  display:block;
  margin-top:4px;
  font-size:19px;
}

.group-total{
  margin-top:15px;
  padding:18px;
  border-radius:15px;
  background:linear-gradient(135deg,rgba(110,85,255,.24),rgba(55,180,255,.13));
  border:1px solid rgba(150,150,255,.3);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.group-total strong{font-size:27px}

.rate-toggle{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:15px;
  padding:13px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);
  border-radius:12px;
}

.switch{
  position:relative;
  width:52px;
  height:28px;
}

.switch input{
  opacity:0;
  width:0;
  height:0;
}

.slider{
  position:absolute;
  inset:0;
  background:#303555;
  border-radius:30px;
  cursor:pointer;
  transition:.2s;
}

.slider:before{
  content:"";
  position:absolute;
  width:20px;
  height:20px;
  left:4px;
  top:4px;
  background:white;
  border-radius:50%;
  transition:.2s;
}

.switch input:checked + .slider{
  background:#8b7cff;
}

.switch input:checked + .slider:before{
  transform:translateX(24px);
}

.admin-grid-wrap{
  overflow-x:auto;
  margin-top:15px;
}

.admin-grid{
  display:grid;
  grid-template-columns:repeat(5,200px);
  gap:10px;
  min-width:1040px;
}

.admin-food{
  padding:14px;
  border-radius:14px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);
}

.admin-food-title{
  font-size:16px;
  font-weight:bold;
  margin-bottom:12px;
}

.field{margin-bottom:10px}

.field label{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:5px;
}

.field input{
  width:100%;
  padding:10px;
  background:#090b23;
  border:1px solid var(--line);
  border-radius:9px;
  color:white;
}

.admin-total{
  padding-top:10px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:12px;
}

.admin-total strong{
  display:block;
  color:white;
  font-size:16px;
  margin-top:5px;
}

.admin-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
}

.status{
  min-height:20px;
  color:var(--muted);
  margin-top:10px;
  font-size:14px;
}

.login-box{
  margin-top:15px;
  padding:16px;
  border-radius:14px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);
}

.login-row{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:10px;
}

.login-row input{
  width:100%;
  padding:12px;
  background:#090b23;
  border:1px solid var(--line);
  border-radius:9px;
  color:white;
}

.hidden{display:none!important}

@media(max-width:700px){

  .app{padding:14px 8px 30px}
  .content,.controls,.group-card{padding:13px}

  th:nth-child(2),
  td:nth-child(2){display:none}

  .table{font-size:13px}
  input.num{width:60px}
  .recipe-btn{font-size:18px}

  body:before,
  body:after{
    font-size:24px;
    letter-spacing:14px;
    line-height:110px;
  }

  .login-row{grid-template-columns:1fr}
  .group-item{align-items:flex-start;flex-direction:column}
  .group-price{text-align:left}
  .group-total{align-items:flex-start;flex-direction:column}
}
</style>
</head>

<body>

<div class="app">

  <div class="hero">
    <h1>🌌 은하 요리 계산기 🍳</h1>
    <p>64개 = 1세트 · 보유 재료를 세트 + 낱개로 입력하세요</p>

    <div class="top-actions">
      <button class="btn btn-primary" id="loginBtn">🔐 관리자 로그인</button>
      <button class="btn btn-danger hidden" id="logoutBtn">로그아웃</button>
    </div>
  </div>

  <!-- 검색 -->
  <div class="card controls">
    <input id="search" class="search" placeholder="🔎 요리 이름을 검색하세요">
    <div id="recipeList" class="recipe-list"></div>
  </div>

  <!-- 계산기 -->
  <div class="card content">
    <div id="appContent" class="empty">
      위에서 요리를 선택해주세요.
    </div>
  </div>

  <!-- 단체 주문 -->
  <div class="card group-card">

    <div class="group-header">
      <div>
        <div class="group-title">👥 단체 주문</div>
        <div class="group-note">
          관리자가 등록한 단체 주문 정보를 확인할 수 있습니다.
        </div>
      </div>
    </div>

    <!-- 일반 사용자 -->
    <div id="groupViewer">

      <div class="rate-toggle">
        <label class="switch">
          <input type="checkbox" id="groupRateToggle">
          <span class="slider"></span>
        </label>

        <div>
          <strong>15% 추가금 적용</strong>
          <div class="note">켜기 / 끄기는 사용자별로 따로 적용됩니다.</div>
        </div>
      </div>

      <div id="groupViewerList" class="group-list"></div>

      <div class="group-total">
        <div>
          <div class="note">총 주문 금액</div>
          <div id="groupRateText" class="note">15% 미적용</div>
        </div>

        <strong id="groupViewerTotal">0원</strong>
      </div>

    </div>

    <!-- 관리자 -->
    <div id="groupAdmin" class="hidden">

      <div class="admin-grid-wrap">
        <div id="groupOrderGrid" class="admin-grid"></div>
      </div>

      <div class="admin-buttons">
        <button class="btn btn-success" id="saveGroupOrderBtn">
          💾 단체주문 저장
        </button>

        <button class="btn btn-danger" id="clearGroupOrderBtn">
          🗑️ 전체 삭제
        </button>
      </div>

      <div id="adminStatus" class="status"></div>

    </div>

  </div>

  <!-- 로그인 -->
  <div id="loginSection" class="card group-card hidden">

    <div class="section-title">🔐 관리자 인증</div>

    <div class="login-box">

      <div class="login-row">

        <input
          type="email"
          id="emailInput"
          placeholder="관리자 이메일"
        >

        <input
          type="password"
          id="passwordInput"
          placeholder="관리자 비밀번호"
        >

        <button class="btn btn-primary" id="doLoginBtn">
          로그인
        </button>

      </div>

      <div id="loginStatus" class="status"></div>

    </div>

  </div>

</div>

/* =====================================================
   레시피 확장
===================================================== */

function expandRecipe(
  name,
  amount = 1,
  result = {}
){

  if(!all[name]){
    return result;
  }

  for(
    const [item,need]
    of Object.entries(all[name])
  ){

    const total = need * amount;

    if(all[item]){

      expandRecipe(
        item,
        total,
        result
      );

    }else{

      result[item] =
        (result[item] || 0)
        + total;

    }

  }

  return result;

}

/* =====================================================
   숫자 표시
===================================================== */

function formatNumber(n){

  return Number(n || 0)
    .toLocaleString("ko-KR");

}

function formatWon(n){

  return `${formatNumber(Math.round(n || 0))}원`;

}

function formatStack(n){

  n = Math.floor(Number(n || 0));

  const sets =
    Math.floor(n / STACK);

  const pieces =
    n % STACK;

  if(sets && pieces){
    return `${formatNumber(n)}개 (${formatNumber(sets)}세트 + ${formatNumber(pieces)}개)`;
  }

  if(sets){
    return `${formatNumber(n)}개 (${formatNumber(sets)}세트)`;
  }

  return `${formatNumber(n)}개`;

}

===================================================== */

const FISH = [
  "요정 피쉬",
  "엔젤 피쉬",
  "다크 피쉬",
  "고스트 피쉬",
  "홀로그램 피쉬"
];

const CROPS = [
  "마나블라썸",
  "피치가지",
  "젤리버섯",
  "팬텀 양배추",
  "레드펄 양파",
  "슬라임 콜라비",
  "엔더 콩",
  "초승달 무"
];

function getIngredientCategory(name){

  if(FISH.includes(name)){
    return 1;
  }

  if(CROPS.includes(name)){
    return 2;
  }

  return 3;

}

function getCategoryName(category){

  if(category === 1){
    return "🐟 피쉬";
  }

  if(category === 2){
    return "🌱 작물";
  }

  return "🧂 가공재료";

}

/* =====================================================
   안전한 HTML
===================================================== */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

/* =====================================================
   ID 생성
===================================================== */

function cssId(name){

  return btoa(
    unescape(
      encodeURIComponent(name)
    )
  ).replace(
    /[^a-zA-Z0-9]/g,
    ""
  );

}

/* =====================================================
   재료 행
===================================================== */

function createIngredientRow(name,need){

  const saved =
    ownedMaterials[name] || {
      sets:0,
      pieces:0
    };

  return `

    <tr>

      <td>
        ${escapeHtml(name)}
      </td>

      <td>
        ${formatNumber(need)}개
      </td>

      <td
        class="owned"
        id="owned-${cssId(name)}"
      >
        0개
      </td>

      <td>

        <input
          class="num set-input"
          data-name="${escapeHtml(name)}"
          type="number"
          min="0"
          value="${Math.max(0,Number(saved.sets || 0))}"
        >

      </td>

      <td>

        <input
          class="num piece-input"
          data-name="${escapeHtml(name)}"
          type="number"
          min="0"
          value="${Math.max(0,Number(saved.pieces || 0))}"
        >

      </td>

    </tr>

  `;

}

/* =====================================================
   카테고리 재료
===================================================== */

function createGroupedIngredientRows(ingredients){

  const groups = {
    1:[],
    2:[],
    3:[]
  };

  Object.entries(ingredients)
  .forEach(([name,need])=>{

    const category =
      getIngredientCategory(name);

    groups[category].push([
      name,
      need
    ]);

  });

  let html = "";

  for(
    let category = 1;
    category <= 3;
    category++
  ){

    if(!groups[category].length){
      continue;
    }

    groups[category].sort(
      ([a],[b]) =>
        a.localeCompare(b,"ko")
    );

    html += `

      <tr class="category-row">
        <td colspan="5">
          ${getCategoryName(category)}
        </td>
      </tr>

    `;

    groups[category]
    .forEach(([name,need])=>{

      html +=
        createIngredientRow(
          name,
          need
        );

    });

  }

  return html;

}

  `;

  document

/* =====================================================
   보유 재료 저장 + 계산
===================================================== */

function updateCalculation(){

  if(!selected){
    return;
  }

  const req =
    (
      selectedGrade === "전설"
      ||
      selectedGrade === "신화"
    )
    ? expandRecipe(selected)
    : all[selected];

  let possible = Infinity;

  for(
    const [name,need]
    of Object.entries(req)
  ){

    const setInput =
      document.querySelector(
        `.set-input[data-name="${CSS.escape(name)}"]`
      );

    const pieceInput =
      document.querySelector(
        `.piece-input[data-name="${CSS.escape(name)}"]`
      );

    if(!setInput || !pieceInput){
      continue;
    }

    const sets =
      Math.max(
        0,
        Math.floor(
          Number(setInput.value) || 0
        )
      );

    const pieces =
      Math.max(
        0,
        Math.floor(
          Number(pieceInput.value) || 0
        )
      );

    ownedMaterials[name] = {
      sets:sets,
      pieces:pieces
    };

    const owned =
      sets * STACK
      +
      pieces;

    possible =
      Math.min(
        possible,
        Math.floor(
          owned / need
        )
      );

    const cell =
      document.getElementById(
        "owned-"
        +
        cssId(name)
      );

    if(cell){

      cell.textContent =
        formatStack(owned);

    }

  }

  saveOwnedMaterials();

  if(possible === Infinity){
    possible = 0;
  }

  const result =
    document.getElementById("result");

  if(result){

    result.textContent =
      formatStack(possible);

  }

}

/* =====================================================
   TAB 이동
===================================================== */

function handleTab(e){

  if(e.key !== "Tab"){
    return;
  }

  const inputs = [
    ...document.querySelectorAll(
      ".set-input,.piece-input"
    )
  ];

  const index =
    inputs.indexOf(e.target);

  if(index < 0){
    return;
  }

  e.preventDefault();

  let next;

  if(e.shiftKey){

    next =
      inputs[
        Math.max(
          0,
          index - 1
        )
      ];

  }else{

    next =
      inputs[
        Math.min(
          inputs.length - 1,
          index + 1
        )
      ];

  }

  next.focus();
  next.select();

}

    try{

      clearGroupOrderBtn.disabled =
        true;

      await deleteDoc(
        groupOrderRef
      );

      groupOrders =
        createEmptyOrders();

      renderGroupOrderEditor();
      renderGroupViewer();

      adminStatus.textContent =
        "✅ 전체 단체주문 정보가 삭제되었습니다.";

    }catch(error){

      console.error(error);

      adminStatus.textContent =
        "❌ 삭제 실패: "
        +
        (
          error.message
          ||
          error
        );

    }finally{

      clearGroupOrderBtn.disabled =
        false;

    }

  }
);

/* =====================================================
   Firestore 실시간 동기화
===================================================== */

onSnapshot(
  groupOrderRef,

  snapshot=>{

    if(
      snapshot.exists()
    ){

      const data =
        snapshot.data();

      if(
        Array.isArray(
          data.orders
        )
      ){

        groupOrders =
          data.orders
          .slice(0,5)
          .map(food=>({

            name:
              String(
                food.name || ""
              ),

            price:
              Number(
                food.price || 0
              ),

            amount:
              Number(
                food.amount || 0
              )

          }));

      }

    }else{

      groupOrders =
        createEmptyOrders();

    }

    while(
      groupOrders.length < 5
    ){

      groupOrders.push({
        name:"",
        price:0,
        amount:0
      });

    }

    renderGroupOrderEditor();
    renderGroupViewer();

  },

  error=>{

    console.error(
      "Firestore 오류:",
      error
    );

    adminStatus.textContent =
      "⚠️ 단체주문 정보를 불러오지 못했습니다.";

  }

);

/* =====================================================
   관리자 로그인
===================================================== */

const loginBtn =
  document.getElementById(
    "loginBtn"
  );

const logoutBtn =
  document.getElementById(
    "logoutBtn"
  );

const loginSection =
  document.getElementById(
    "loginSection"
  );

const doLoginBtn =
  document.getElementById(
    "doLoginBtn"
  );

const emailInput =
  document.getElementById(
    "emailInput"
  );

const passwordInput =
  document.getElementById(
    "passwordInput"
  );

const loginStatus =
  document.getElementById(
    "loginStatus"
  );

const groupViewer =
  document.getElementById(
    "groupViewer"
  );

const groupAdmin =
  document.getElementById(
    "groupAdmin"
  );

loginBtn.addEventListener(
  "click",
  ()=>{

    loginSection.classList.toggle(
      "hidden"
    );

    if(
      !loginSection.classList.contains(
        "hidden"
      )
    ){

      loginSection.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

    }

  }
);

doLoginBtn.addEventListener(
  "click",
  async ()=>{

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;

    if(!email || !password){

      loginStatus.textContent =
        "이메일과 비밀번호를 입력해주세요.";

      return;

    }

    try{

      loginStatus.textContent =
        "로그인 중...";

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      passwordInput.value = "";

    }catch(error){

      console.error(error);

      loginStatus.textContent =
        "❌ 로그인 실패: "
        +
        (
          error.message
          ||
          error
        );

    }

  }
);

/* =====================================================
   인증 상태 확인
===================================================== */

onAuthStateChanged(
  auth,

  async user=>{

    if(user){

      if(
        user.uid === ADMIN_UID
      ){

        loginBtn.classList.add(
          "hidden"
        );

        logoutBtn.classList.remove(
          "hidden"
        );

        loginSection.classList.add(
          "hidden"
        );

        groupViewer.classList.add(
          "hidden"
        );

        groupAdmin.classList.remove(
          "hidden"
        );

        adminStatus.textContent =
          "✅ 관리자로 로그인되었습니다.";

        renderGroupOrderEditor();

      }else{

        await signOut(auth);

        loginStatus.textContent =
          "관리자 계정만 로그인할 수 있습니다.";

      }

    }else{

      loginBtn.classList.remove(
        "hidden"
      );

      logoutBtn.classList.add(
        "hidden"
      );

      groupViewer.classList.remove(
        "hidden"
      );

      groupAdmin.classList.add(
        "hidden"
      );

    }

  }
);

/* =====================================================
   로그아웃
===================================================== */

logoutBtn.addEventListener(
  "click",
  async ()=>{

    try{

      await signOut(auth);

    }catch(error){

      console.error(error);

    }

  }
);

/* =====================================================
   시작
===================================================== */

renderList();
renderGroupOrderEditor();
renderGroupViewer();

</script>

</body>
</html>
