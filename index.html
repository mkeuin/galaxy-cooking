<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>은하 요리 계산기</title>

<style>
:root{
  --bg:#080a1f;
  --panel:rgba(16,19,48,.88);
  --panel2:rgba(28,32,75,.82);
  --text:#f4f5ff;
  --muted:#b9bddb;
  --line:rgba(255,255,255,.13);
  --accent:#9b8cff;
  --accent2:#61d6ff;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;

  background:
    radial-gradient(circle at 15% 20%,rgba(111,76,255,.38),transparent 28%),
    radial-gradient(circle at 85% 25%,rgba(0,180,255,.23),transparent 25%),
    radial-gradient(circle at 50% 90%,rgba(180,50,255,.18),transparent 30%),
    linear-gradient(135deg,#050614,#101434 55%,#070818);
}

body:before,
body:after{
  position:fixed;
  top:0;
  width:50%;
  height:100%;
  pointer-events:none;
  opacity:.45;
  font-size:32px;
  letter-spacing:24px;
  line-height:140px;
  overflow:hidden;
  z-index:0;
}

body:before{
  content:"✦  ·  ✧     ·       ✦       ·  ✧      ·       ✦       ·    ✧";
  left:0;
}

body:after{
  content:"✧  ·  ✦     ·       ✧       ·  ✦       ·  ✧      ·       ✦";
  right:0;
  text-align:right;
}

.app{
  position:relative;
  z-index:1;
  max-width:1150px;
  margin:auto;
  padding:25px 16px 45px;
}

.hero{
  text-align:center;
  margin-bottom:18px;
}

.hero h1{
  margin:0;
  font-size:clamp(28px,5vw,48px);
  text-shadow:0 0 24px rgba(150,120,255,.7);
}

.hero p{
  color:var(--muted);
  margin:8px 0 0;
  font-size:17px;
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  backdrop-filter:blur(14px);
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.controls{
  padding:18px;
  margin-bottom:16px;
}

.search{
  width:100%;
  padding:16px 18px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#080a20;
  color:var(--text);
  font-size:19px;
  outline:none;
}

.recipe-list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:8px;
  margin-top:14px;
  max-height:300px;
  overflow:auto;
}

.recipe-btn{
  padding:15px;
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:12px;
  cursor:pointer;
  text-align:left;
  font-size:19px;
  font-weight:bold;
}

.recipe-btn:hover,
.recipe-btn.active{
  border-color:var(--accent2);
  box-shadow:0 0 16px rgba(97,214,255,.22);
}

.grade{
  font-size:14px;
  opacity:.75;
  display:block;
  margin-bottom:5px;
}

.content{
  padding:20px;
}

.selected{
  font-size:26px;
  font-weight:bold;
  margin:0 0 16px;
}

.result{
  padding:18px;
  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      rgba(110,85,255,.22),
      rgba(55,180,255,.14)
    );

  border:1px solid rgba(150,150,255,.28);
  margin-bottom:18px;
  font-size:18px;
}

.result strong{
  font-size:clamp(28px,4vw,42px);
  display:block;
  margin-top:6px;
}

.section-title{
  font-size:21px;
  font-weight:bold;
  margin:22px 0 10px;
}

.table{
  width:100%;
  border-collapse:collapse;
  overflow:hidden;
  border-radius:14px;
  font-size:16px;
}

th,
td{
  padding:13px 10px;
  border-bottom:1px solid var(--line);
  text-align:center;
}

th{
  color:#d9d7ff;
  background:rgba(255,255,255,.05);
  font-size:16px;
}

td:first-child{
  text-align:left;
  font-weight:bold;
}

input.num{
  width:90px;
  padding:11px;
  border-radius:9px;
  border:1px solid var(--line);
  background:#090b23;
  color:white;
  text-align:center;
  font-size:17px;
}

input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0;
}

input[type="number"]{
  -moz-appearance:textfield;
  appearance:textfield;
}

.owned{
  white-space:nowrap;
}

.subrecipes{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:8px;
}

.sub{
  padding:13px 14px;
  border-radius:10px;
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  font-size:16px;
}

.note{
  color:var(--muted);
  font-size:14px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px;
  font-size:18px;
}

.category-row td{
  text-align:left!important;
  font-size:18px!important;
  font-weight:bold!important;
  padding:14px 12px!important;
  background:rgba(255,255,255,.08);
  border-top:1px solid var(--line);
}


/* ==================================================
   단체주문
================================================== */

.group-order-card{
  padding:20px;
  margin-bottom:16px;
}

.group-order-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:18px;
}

.group-order-header h2{
  margin:0 0 5px;
  font-size:24px;
}

.group-order-header p{
  margin:0;
  color:var(--muted);
}

.admin-btn,
.save-btn{
  border:none;
  border-radius:10px;
  padding:12px 18px;
  cursor:pointer;
  color:white;
  font-size:16px;
  font-weight:bold;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}

.admin-btn:hover,
.save-btn:hover{
  filter:brightness(1.08);
}

.logout-btn{
  background:rgba(255,255,255,.12);
}


/* 로그인 */

.login-box{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:8px;
  margin-bottom:15px;
}

.login-box input,
.group-food input{
  width:100%;
  padding:12px;
  border-radius:9px;
  border:1px solid var(--line);
  background:#090b23;
  color:white;
  font-size:16px;
  outline:none;
}

.group-food input:focus,
.login-box input:focus{
  border-color:var(--accent2);
}


/* 관리자 음식 입력 */

.group-order-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:10px;
  margin-bottom:14px;
}

.group-food{
  padding:15px;
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(255,255,255,.04);
}

.group-food label{
  display:block;
  margin-bottom:10px;
  color:#d9d7ff;
  font-weight:bold;
  font-size:17px;
}

.group-food .input-title{
  display:block;
  margin:6px 0 5px;
  color:var(--muted);
  font-size:13px;
}

.group-food input{
  margin-bottom:7px;
}

.group-food-total{
  margin-top:6px;
  padding:10px;
  border-radius:9px;
  background:rgba(97,214,255,.08);
  border:1px solid rgba(97,214,255,.15);
  font-size:14px;
}

.group-food-total strong{
  display:block;
  margin-top:3px;
  font-size:19px;
}


/* 할인/가산율 선택 */

.price-rate-box{
  margin:15px 0;
  padding:16px;
  border-radius:14px;
  background:rgba(255,255,255,.045);
  border:1px solid var(--line);
}

.price-rate-title{
  font-size:17px;
  font-weight:bold;
  margin-bottom:10px;
}

.rate-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.rate-btn{
  min-width:80px;
  padding:11px 15px;
  border-radius:10px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.06);
  color:white;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
}

.rate-btn:hover{
  border-color:var(--accent2);
}

.rate-btn.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-color:transparent;
  box-shadow:0 0 15px rgba(97,214,255,.2);
}


/* 사용자 단체주문 표시 */

.group-order-view{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:10px;
}

.group-order-item{
  padding:16px;
  border-radius:12px;
  background:rgba(110,85,255,.14);
  border:1px solid rgba(150,150,255,.22);
}

.group-order-item strong{
  display:block;
  font-size:18px;
  margin-bottom:8px;
}

.group-order-info{
  color:var(--muted);
  font-size:14px;
  line-height:1.7;
}

.group-order-base-price{
  margin-top:8px;
  font-size:15px;
}

.group-order-final-price{
  margin-top:5px;
  font-size:22px;
  font-weight:bold;
}

.group-order-total{
  grid-column:1 / -1;
  padding:18px;
  border-radius:14px;
  margin-top:4px;
  background:
    linear-gradient(
      135deg,
      rgba(110,85,255,.25),
      rgba(55,180,255,.18)
    );
  border:1px solid rgba(150,150,255,.3);
}

.group-order-total-title{
  color:var(--muted);
  font-size:15px;
}

.group-order-total-price{
  margin-top:4px;
  font-size:32px;
  font-weight:bold;
}

.group-order-total-detail{
  margin-top:5px;
  color:var(--muted);
  font-size:14px;
}


/* 에러 */

.error-box{
  padding:15px;
  margin-top:10px;
  border-radius:12px;
  background:rgba(255,80,80,.12);
  border:1px solid rgba(255,100,100,.3);
  color:#ffb8b8;
  display:none;
}


/* 모바일 */

@media(max-width:700px){

  .app{
    padding:14px 8px 30px;
  }

  .content,
  .controls{
    padding:13px;
  }

  th:nth-child(2),
  td:nth-child(2){
    display:none;
  }

  .table{
    font-size:13px;
  }

  input.num{
    width:60px;
  }

  .recipe-btn{
    font-size:18px;
  }

  body:before,
  body:after{
    font-size:24px;
    letter-spacing:14px;
    line-height:110px;
  }

  .group-order-header{
    flex-direction:column;
    align-items:flex-start;
  }

  .login-box{
    grid-template-columns:1fr;
  }

  .rate-btn{
    flex:1;
    min-width:65px;
  }

  .group-order-total-price{
    font-size:27px;
  }
}
</style>

</head>

<body>

<div class="app">

  <div class="hero">
    <h1>🌌 은하 요리 계산기 🍳</h1>
    <p>64개 = 1세트 · 보유 재료를 세트 + 낱개로 입력하세요</p>
  </div>


  <!-- ==================================================
       단체주문
  ================================================== -->

  <div class="card group-order-card">

    <div class="group-order-header">

      <div>
        <h2>📦 단체주문</h2>
        <p id="groupOrderStatus">
          단체주문 내용을 불러오는 중...
        </p>
      </div>

      <div class="admin-area">

        <button
          id="loginBtn"
          class="admin-btn"
        >
          🔐 관리자 로그인
        </button>

        <button
          id="logoutBtn"
          class="admin-btn logout-btn"
          style="display:none"
        >
          로그아웃
        </button>

      </div>

    </div>


    <!-- 관리자 로그인 -->

    <div
      id="loginBox"
      class="login-box"
      style="display:none"
    >

      <input
        id="adminEmail"
        type="email"
        placeholder="관리자 이메일"
      >

      <input
        id="adminPassword"
        type="password"
        placeholder="비밀번호"
      >

      <button
        id="loginSubmit"
        class="save-btn"
      >
        로그인
      </button>

    </div>


    <!-- 관리자 단체주문 입력 -->

    <div
      id="groupOrderEditor"
      style="display:none"
    >

      <div
        class="group-order-grid"
        id="groupOrderGrid"
      ></div>

      <button
        id="saveGroupOrder"
        class="save-btn"
      >
        💾 단체주문 저장
      </button>

    </div>


    <!-- 사용자 할인/가산율 선택 -->

    <div class="price-rate-box">

      <div class="price-rate-title">
        💰 금액 적용률
      </div>

      <div class="rate-buttons">

        <button
          class="rate-btn active"
          data-rate="0"
        >
          0%
        </button>

        <button
          class="rate-btn"
          data-rate="5"
        >
          5%
        </button>

        <button
          class="rate-btn"
          data-rate="10"
        >
          10%
        </button>

        <button
          class="rate-btn"
          data-rate="15"
        >
          15%
        </button>

      </div>

      <div
        id="rateDescription"
        class="note"
        style="margin-top:9px"
      >
        기본 금액 그대로 표시됩니다.
      </div>

    </div>


    <!-- 단체주문 표시 -->

    <div
      id="groupOrderView"
      class="group-order-view"
    >
      불러오는 중...
    </div>


    <div
      id="firebaseError"
      class="error-box"
    ></div>

  </div>


  <!-- ==================================================
       검색 및 요리 목록
  ================================================== -->

  <div class="card controls">

    <input
      id="search"
      class="search"
      placeholder="🔎 요리 이름을 검색하세요"
    >

    <div
      id="recipeList"
      class="recipe-list"
    ></div>

  </div>


  <!-- ==================================================
       계산 화면
  ================================================== -->

  <div class="card content">

    <div
      id="appContent"
      class="empty"
    >
      위에서 요리를 선택해주세요.
    </div>

  </div>

</div>

const all = {};

  Object.assign(all,group);

/* ==================================================
   상위 요리 기본재료 계산
================================================== */

function expandRecipe(
  name,
  amount=1,
  result={}
){

  if(!all[name]){
    return result;
  }

  for(
    const [item,need]
    of Object.entries(all[name])
  ){

    const total =
      need * amount;

    if(all[item]){

      expandRecipe(
        item,
        total,
        result
      );

    }else{

      result[item] =
        (result[item] || 0)
        + total;

    }

  }

  return result;

}


/* ==================================================
   세트 표시
================================================== */

function formatStack(n){

  n = Math.max(
    0,
    Math.floor(Number(n) || 0)
  );

  const sets =
    Math.floor(n / STACK);

  const pieces =
    n % STACK;

  if(sets && pieces){

    return `${n.toLocaleString()}개 (${sets}세트 + ${pieces}개)`;

  }

  if(sets){

    return `${n.toLocaleString()}개 (${sets}세트)`;

  }

  return `${n.toLocaleString()}개`;

}

const CROPS = [

  "피치가지",

  "팬텀 양배추",

  "슬라임 콜라비",
  "엔더 콩",
  "초승달 무"
];


function getIngredientCategory(name){

  if(FISH.includes(name)){
    return 1;
  }

  if(CROPS.includes(name)){
    return 2;
  }

  return 3;

}


function getCategoryName(category){

  if(category === 1){
    return "🐟 피쉬";
  }

  if(category === 2){
    return "🌱 작물";
  }

  return "🧂 가공재료";

}


/* ==================================================
   HTML ID 생성
================================================== */

function cssId(name){

  return btoa(
    unescape(
      encodeURIComponent(name)
    )
  )
  .replace(
    /[^a-zA-Z0-9]/g,
    ""
  );

}

function createIngredientRow(
  name,
  need
){

    <tr>

      <td>${name}</td>

      <td>${need}개</td>

      <td
        class="owned"

      >

          data-name="${name}"
          type="number"
          min="0"
          value="0"
        >

      </td>

      <td>

        <input
          class="num piece-input"
          data-name="${name}"
          type="number"
          min="0"
          value="0"
        >

      </td>

    </tr>
  `;

}


/* ==================================================
   재료 그룹 생성
================================================== */

function createGroupedIngredientRows(
  ingredients
){

  const groups = {
    1:[],
    2:[],
    3:[]
  };

  Object.entries(ingredients)
    .forEach(([name,need])=>{

      groups[
        getIngredientCategory(name)
      ].push([
        name,
        need
      ]);

    });


  let html = "";


  for(
    let category=1;
    category<=3;
    category++
  ){

    if(!groups[category].length){
      continue;
    }


    groups[category].sort(
      ([a],[b]) =>
        a.localeCompare(
          b,
          "ko"
        )
    );


    html += `
      <tr class="category-row">

        <td colspan="5">
          ${getCategoryName(category)}
        </td>

      </tr>
    `;


    groups[category].forEach(
      ([name,need])=>{

        html +=
          createIngredientRow(
            name,
            need
          );

      }
    );

  }


  return html;

}

            <th>낱개</th>

        </tbody>

  `;


  document

/* ==================================================
   계산
================================================== */

function updateCalculation(){

  if(!selected){
    return;
  }


  const isHighGrade =
    selectedGrade === "전설"
    ||
    selectedGrade === "신화";


  const req =
    isHighGrade
      ? expandRecipe(selected)
      : all[selected];


  let possible =
    Infinity;


  for(
    const [name,need]
    of Object.entries(req)
  ){

    const setInput =
      document.querySelector(
        `.set-input[data-name="${CSS.escape(name)}"]`
      );


    const pieceInput =
      document.querySelector(
        `.piece-input[data-name="${CSS.escape(name)}"]`
      );


    if(!setInput || !pieceInput){
      continue;
    }


    const sets =
      Math.max(
        0,
        Number(setInput.value) || 0
      );


    const pieces =
      Math.max(
        0,
        Number(pieceInput.value) || 0
      );


    const owned =
      Math.floor(sets) * STACK
      +
      Math.floor(pieces);


    possible =
      Math.min(
        possible,
        Math.floor(
          owned / need
        )
      );


    const cell =
      document.getElementById(
        "owned-" + cssId(name)
      );


    if(cell){

      cell.textContent =
        formatStack(owned);

    }

  }


  if(possible === Infinity){
    possible = 0;
  }


  const result =
    document.getElementById(
      "result"
    );


  if(result){

    result.textContent =
      formatStack(possible);

  }

}


/* ==================================================
   TAB 이동
================================================== */

function handleTab(e){

  if(e.key !== "Tab"){
    return;
  }


  const inputs = [
    ...document.querySelectorAll(
      ".set-input,.piece-input"
    )
  ];


  const index =
    inputs.indexOf(e.target);


  if(index < 0){
    return;
  }


  e.preventDefault();


  let next;


  if(e.shiftKey){

    next =
      inputs[
        Math.max(
          0,
          index - 1
        )
      ];

  }else{

    next =
      inputs[
        Math.min(
          inputs.length - 1,
          index + 1
        )
      ];

  }


  if(next){

    next.focus();
    next.select();

  }

}

);


document.addEventListener(

        'input[type="number"]'

      if(
        e.target.value === ""

        e.target.value = "0";

      <div class="group-order-total">

        <div class="group-order-total-title">
          📦 단체주문 총 금액 · ${rateText}
        </div>


        <div class="group-order-total-price">
          ${formatWon(totalFinal)}
        </div>


        <div class="group-order-total-detail">

          기본 총액:
          ${formatWon(totalBase)}

          ${
            selectedRate === 0
              ? ""
              : ` → +${selectedRate}%`
          }

        </div>

      </div>

    `;

}


/* ==================================================
   HTML 이스케이프
================================================== */

function escapeHtml(text){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text;

  return div.innerHTML;

}


/* ==================================================
   편집창 데이터 입력
================================================== */

function fillGroupOrderEditor(){

  document
    .querySelectorAll(
      ".group-food-name"
    )
    .forEach(input=>{

      const i =
        Number(
          input.dataset.index
        );


      input.value =
        groupOrderData[i]?.name
        || "";

    });


  document
    .querySelectorAll(
      ".group-food-price"
    )
    .forEach(input=>{

      const i =
        Number(
          input.dataset.index
        );


      input.value =
        groupOrderData[i]?.price
        ?? 0;

    });


  document
    .querySelectorAll(
      ".group-food-amount"
    )
    .forEach(input=>{

      const i =
        Number(
          input.dataset.index
        );


      input.value =
        groupOrderData[i]?.amount
        ?? 0;

    });


  updateGroupEditorTotals();

}


/* ==================================================
   Firebase 데이터 감시
================================================== */

renderGroupOrderEditor();


onSnapshot(
  groupOrderRef,

  snapshot=>{

    if(snapshot.exists()){

      const data =
        snapshot.data();


      if(
        Array.isArray(
          data.foods
        )
      ){

        groupOrderData =
          Array.from(
            {length:5},
            (_,i)=>{

              const oldFood =
                data.foods[i] || {};


              /*
                새 데이터:
                name
                price
                amount


                예전 데이터:
                name
                amount

                예전 amount는 가격이 아니라
                주문수량으로 저장되어 있으므로
                가격은 0으로 처리
              */

              return {

                name:
                  oldFood.name
                  || "",

                price:
                  Number(
                    oldFood.price
                  )
                  || 0,

                amount:
                  Number(
                    oldFood.amount
                  )
                  || 0

              };

            }
          );

      }

    }


    renderGroupOrderView();


    if(isAdmin){

      fillGroupOrderEditor();

    }


    if(!isAdmin){

      document
        .getElementById(
          "groupOrderStatus"
        )
        .textContent =
          "👀 단체주문 내용을 확인할 수 있습니다.";

    }

  },

  error=>{

    console.error(
      "Firestore 오류:",
      error
    );


    document
      .getElementById(
        "groupOrderStatus"
      )
      .textContent =
        "⚠️ 단체주문을 불러오지 못했습니다.";


    const errorBox =
      document.getElementById(
        "firebaseError"
      );


    errorBox.style.display =
      "block";


    errorBox.textContent =
      "Firebase 연결 또는 Firestore 보안 규칙을 확인해주세요.";

  }

);


/* ==================================================
   관리자 로그인 버튼
================================================== */

document
  .getElementById("loginBtn")
  .addEventListener(
    "click",
    ()=>{

      const box =
        document.getElementById(
          "loginBox"
        );


      if(
        box.style.display === "none"
        ||
        box.style.display === ""
      ){

        box.style.display =
          "grid";

      }else{

        box.style.display =
          "none";

      }

    }
  );


/* ==================================================
   로그인
================================================== */

document
  .getElementById("loginSubmit")
  .addEventListener(
    "click",
    async ()=>{

      const email =
        document
          .getElementById(
            "adminEmail"
          )
          .value
          .trim();


      const password =
        document
          .getElementById(
            "adminPassword"
          )
          .value;


      if(!email || !password){

        alert(
          "이메일과 비밀번호를 입력해주세요."
        );

        return;

      }


      try{

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      }catch(error){

        console.error(
          error
        );


        alert(
          "로그인에 실패했습니다.\n이메일 또는 비밀번호를 확인해주세요."
        );

      }

    }
  );


/* ==================================================
   로그인 상태 확인
================================================== */

onAuthStateChanged(
  auth,
  user=>{

    const editor =
      document.getElementById(
        "groupOrderEditor"
      );


    const loginBtn =
      document.getElementById(
        "loginBtn"
      );


    const logoutBtn =
      document.getElementById(
        "logoutBtn"
      );


    const loginBox =
      document.getElementById(
        "loginBox"
      );


    const status =
      document.getElementById(
        "groupOrderStatus"
      );


    if(
      user &&
      user.uid === ADMIN_UID
    ){

      isAdmin = true;


      editor.style.display =
        "block";


      loginBtn.style.display =
        "none";


      logoutBtn.style.display =
        "inline-block";


      loginBox.style.display =
        "none";


      status.textContent =
        "🔓 관리자 모드 - 단체주문을 수정할 수 있습니다.";


      fillGroupOrderEditor();


    }else{

      isAdmin = false;


      editor.style.display =
        "none";


      loginBtn.style.display =
        "inline-block";


      logoutBtn.style.display =
        "none";


      loginBox.style.display =
        "none";


      status.textContent =
        "👀 단체주문 내용을 확인할 수 있습니다.";


      if(user){

        signOut(auth);

        alert(
          "관리자 계정이 아닙니다.\n보기만 가능합니다."
        );

      }

    }

  }
);


/* ==================================================
   로그아웃
================================================== */

document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    async ()=>{

      try{

        await signOut(auth);

      }catch(error){

        console.error(
          error
        );

      }

    }
  );


/* ==================================================
   단체주문 저장
================================================== */

document
  .getElementById("saveGroupOrder")
  .addEventListener(
    "click",
    async ()=>{

      if(!isAdmin){

        alert(
          "관리자만 수정할 수 있습니다."
        );

        return;

      }


      const foods = [];


      for(
        let i=0;
        i<5;
        i++
      ){

        const name =
          document
            .querySelector(
              `.group-food-name[data-index="${i}"]`
            )
            .value
            .trim();


        const price =
          Math.max(
            0,
            Math.floor(
              Number(
                document
                  .querySelector(
                    `.group-food-price[data-index="${i}"]`
                  )
                  .value
              )
              || 0
            )
          );


        const amount =
          Math.max(
            0,
            Math.floor(
              Number(
                document
                  .querySelector(
                    `.group-food-amount[data-index="${i}"]`
                  )
                  .value
              )
              || 0
            )
          );


        foods.push({

          name,

          price,

          amount

        });

      }


      try{

        await setDoc(
          groupOrderRef,
          {
            foods,

            updatedAt:
              new Date().toISOString()

          },
          {
            merge:true
          }
        );


        alert(
          "단체주문이 저장되었습니다!"
        );


      }catch(error){

        console.error(
          error
        );


        alert(
          "저장에 실패했습니다.\nFirestore 규칙과 관리자 UID를 확인해주세요."
        );

      }

    }
  );


/* ==================================================
   적용률 버튼 클릭
================================================== */

document
  .querySelectorAll(".rate-btn")
  .forEach(button=>{

    button.addEventListener(
      "click",
      ()=>{

        selectedRate =
          Number(
            button.dataset.rate
          );


        updateRateButtons();

        refreshGroupOrderPrices();

      }
    );

  });


/* ==================================================
   시작
================================================== */

updateRateButtons();

renderList();

</script>
