<style>
:root{

  --accent:#9b8cff; --accent2:#61d6ff;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  background:
    radial-gradient(circle at 15% 20%,rgba(111,76,255,.38),transparent 28%),
    radial-gradient(circle at 85% 25%,rgba(0,180,255,.23),transparent 25%),
    radial-gradient(circle at 50% 90%,rgba(180,50,255,.18),transparent 30%),
    linear-gradient(135deg,#050614,#101434 55%,#070818);
}
body:before,body:after{
  position:fixed; top:0; width:50%; height:100%; pointer-events:none;
  opacity:.45; font-size:32px; letter-spacing:24px; line-height:140px;
  overflow:hidden; z-index:0;
}
body:before{
  content:"✦  ·  ✧     ·       ✦       ·  ✧      ·       ✦       ·    ✧";
  left:0;
}
body:after{
  content:"✧  ·  ✦     ·       ✧       ·  ✦       ·  ✧      ·       ✦";
  right:0;
  text-align:right;
}
.app{
  position:relative;
  z-index:1;
  max-width:1150px;
  margin:auto;
  padding:25px 16px 45px;
}
.hero{
  text-align:center;
  margin-bottom:18px;
}
.hero h1{
  margin:0;
  font-size:clamp(28px,5vw,48px);
  text-shadow:0 0 24px rgba(150,120,255,.7);
}
.hero p{
  color:var(--muted);
  margin:8px 0 0;
  font-size:17px;
}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  backdrop-filter:blur(14px);
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.controls{
  padding:18px;
  margin-bottom:16px;
}
.search{
  width:100%;
  padding:16px 18px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#080a20;
  color:var(--text);
  font-size:19px;
  outline:none;
}
.recipe-list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:8px;
  margin-top:14px;
  max-height:300px;
  overflow:auto;
}
.recipe-btn{
  padding:15px;
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:12px;
  cursor:pointer;
  text-align:left;
  font-size:19px;
  font-weight:bold;
}
.recipe-btn:hover,
.recipe-btn.active{
  border-color:var(--accent2);
  box-shadow:0 0 16px rgba(97,214,255,.22);
}
.grade{
  font-size:14px;
  opacity:.75;
  display:block;
  margin-bottom:5px;
}
.content{
  padding:20px;
}
.selected{
  font-size:26px;
  font-weight:bold;
  margin:0 0 16px;
}
.result{
  padding:18px;
  border-radius:16px;
  background:linear-gradient(135deg,rgba(110,85,255,.22),rgba(55,180,255,.14));
  border:1px solid rgba(150,150,255,.28);
  margin-bottom:18px;
  font-size:18px;
}
.result strong{
  font-size:clamp(28px,4vw,42px);
  display:block;
  margin-top:6px;
}
.section-title{
  font-size:21px;
  font-weight:bold;
  margin:22px 0 10px;
}
.table{
  width:100%;
  border-collapse:collapse;
  overflow:hidden;
  border-radius:14px;
  font-size:16px;
}
th,td{
  padding:13px 10px;
  border-bottom:1px solid var(--line);
  text-align:center;
}
th{
  color:#d9d7ff;
  background:rgba(255,255,255,.05);
  font-size:16px;
}
td:first-child{
  text-align:left;
  font-weight:bold;
}
input.num{
  width:90px;
  padding:11px;
  border-radius:9px;
  border:1px solid var(--line);
  background:#090b23;
  color:white;
  text-align:center;
  font-size:17px;
}
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0;
}
input[type="number"]{
  -moz-appearance:textfield;
  appearance:textfield;
}
.owned{
  white-space:nowrap;
}
.subrecipes{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:8px;
}
.sub{
  padding:13px 14px;
  border-radius:10px;
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  font-size:16px;
}
.note{
  color:var(--muted);
  font-size:14px;
}
.empty{
  text-align:center;
  color:var(--muted);
  padding:30px;
  font-size:18px;
}
.category-row td{
  text-align:left!important;
  font-size:18px!important;
  font-weight:bold!important;
  padding:14px 12px!important;
  background:rgba(255,255,255,.08);
  border-top:1px solid var(--line);
}

/* 단체주문 */
.group-order-card{
  padding:20px;
  margin-bottom:16px;

.group-order-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:18px;

.group-order-header h2{

  font-size:24px;

.group-order-header p{

.admin-btn,

  font-size:16px;
  font-weight:bold;
  background:linear-gradient(135deg,var(--accent),var(--accent2));

.logout-btn{

.login-box{

  grid-template-columns:1fr 1fr auto;
  gap:8px;
  margin-bottom:15px;
}
.login-box input,

  color:white;

.group-order-grid{

.group-food{

.group-order-view{

  gap:10px;
}
.group-order-item{

  border-radius:12px;

  border:1px solid rgba(150,150,255,.22);

.group-order-item strong{

  font-size:18px;
  margin-bottom:7px;

@media(max-width:700px){
  .app{

  input.num{

const all = {};

Object.values(recipes).forEach(group=>{
  Object.assign(all,group);
});


function expandRecipe(name, visited=new Set()){

  if(visited.has(name)){
    return {};
  }

  visited.add(name);

  const recipe=all[name];

  if(!recipe){
    return {};
  }

  const result={};

  for(const [ingredient,amount] of Object.entries(recipe)){

    if(all[ingredient]){

      const expanded=expandRecipe(
        ingredient,
        new Set(visited)
      );

      for(const [subName,subAmount] of Object.entries(expanded)){
        result[subName]=(result[subName]||0)+(subAmount*amount);
      }

    }else{

      result[ingredient]=(result[ingredient]||0)+amount;

    }
  }

  return result;
}

let selectedGrade=null;


function cssId(text){
  return "id-"+btoa(
    unescape(
      encodeURIComponent(text)
    )
  ).replace(/[^a-zA-Z0-9]/g,"");
}


function formatStack(num){

  num=Math.max(0,Math.floor(num||0));

  const sets=Math.floor(num/STACK);
  const pieces=num%STACK;

  if(sets>0 && pieces>0){
    return `${sets}세트 ${pieces}개`;
  }

  if(sets>0){
    return `${sets}세트`;
  }

  return `${pieces}개`;
}


function createIngredientRow(name,need){

  const id=cssId(name);

  return `
  <tr>

    <td>${name}</td>

    <td>${need}</td>

    <td class="owned" id="owned-${id}">
      0개
    </td>

    <td>
      <input
        class="num set-input"
        type="number"
        min="0"
        value="0"
        data-name="${escapeHtml(name)}"
      >
    </td>

    <td>
      <input
        class="num piece-input"
        type="number"
        min="0"
        value="0"
        data-name="${escapeHtml(name)}"
      >
    </td>

  </tr>`;
}


function createGroupedIngredientRows(ingredients){

  let html="";

  const categories={};

  for(const [name,need] of Object.entries(ingredients)){

    const first=name.charAt(0);

    if(!categories[first]){
      categories[first]=[];
    }

    categories[first].push([name,need]);
  }

  for(const [category,items] of Object.entries(categories)){

    html+=`
    <tr class="category-row">
      <td colspan="5">
        ${category}
      </td>
    </tr>`;

    items.forEach(([name,need])=>{
      html+=createIngredientRow(name,need);
    });

  }

  return html;
}


function renderList(){

  const q=document
    .getElementById("search")
    .value
    .trim()
    .toLowerCase();

  const list=document.getElementById("recipeList");

  list.innerHTML="";

  for(const [grade,group] of Object.entries(recipes)){

    for(const name of Object.keys(group)){

      if(
        (grade+" "+name)
        .toLowerCase()
        .includes(q)
      ){

        const button=document.createElement("button");

        button.className=
          "recipe-btn"+
          (selected===name?" active":"");

        button.innerHTML=`
          <span class="grade">${grade}</span>
          ${name}
        `;

        button.onclick=()=>{
          selectRecipe(grade,name);
        };

        list.appendChild(button);
      }

    }

  }

}


function selectRecipe(grade,name){

  selected=name;
  selectedGrade=grade;

  renderList();
  renderRecipe();

}


function renderRecipe(){

  if(!selected){
    return;
  }

  const content=document.getElementById("appContent");

  const isHighGrade=
    selectedGrade==="전설" ||
    selectedGrade==="신화";

  const ingredients=
    isHighGrade
      ? expandRecipe(selected)
      : all[selected];

  const sub=
    isHighGrade
      ? all[selected]
      : null;

  let subHtml="";

  if(sub){

    subHtml=`
      <div class="section-title">
        🥘 필요한 하위 요리
      </div>

      <div class="subrecipes">

        ${
          Object.entries(sub)
          .map(
            ([name,amount])=>
              `<div class="sub">
                ${name} × ${amount}
              </div>`
          )
          .join("")
        }

      </div>

      <div class="section-title">
        📋 실제 기본 재료
      </div>
    `;
  }

  const rows=
    isHighGrade
      ? createGroupedIngredientRows(ingredients)
      : Object.entries(ingredients)
          .map(
            ([name,need])=>
              createIngredientRow(name,need)
          )
          .join("");

  content.innerHTML=`

    <div class="selected">
      [${selectedGrade}] ${selected}
    </div>

    <div class="result">

      <span>🍲 만들 수 있는 요리</span>

      <strong id="result">
        0개
      </strong>

      <div class="note">
        가장 부족한 재료를 기준으로 자동 계산됩니다.
      </div>

    </div>

    ${subHtml}

    <div style="overflow:auto">

      <table class="table">

        <thead>
          <tr>
            <th>재료</th>
            <th>요리 1개 필요량</th>
            <th>보유량</th>
            <th>세트</th>
            <th>낱개</th>
          </tr>
        </thead>

        <tbody>
          ${rows}
        </tbody>

      </table>

    </div>
  `;

  document
    .querySelectorAll(".set-input,.piece-input")
    .forEach(el=>{

      el.addEventListener(
        "input",
        updateCalculation
      );

      el.addEventListener(
        "keydown",
        handleTab
      );

    });

  updateCalculation();
}


function updateCalculation(){

  if(!selected){
    return;
  }

  const req=
    (
      selectedGrade==="전설" ||
      selectedGrade==="신화"
    )
      ? expandRecipe(selected)
      : all[selected];

  let possible=Infinity;

  for(
    const [name,need]
    of Object.entries(req)
  ){

    const setInput=document.querySelector(
      `.set-input[data-name="${CSS.escape(name)}"]`
    );

    const pieceInput=document.querySelector(
      `.piece-input[data-name="${CSS.escape(name)}"]`
    );

    if(!setInput || !pieceInput){
      continue;
    }

    const sets=Math.max(
      0,
      Number(setInput.value)||0
    );

    const pieces=Math.max(
      0,
      Number(pieceInput.value)||0
    );

    const owned=
      Math.floor(sets)*STACK+
      Math.floor(pieces);

    possible=Math.min(
      possible,
      Math.floor(owned/need)
    );

    const cell=document.getElementById(
      "owned-"+cssId(name)
    );

    if(cell){
      cell.textContent=
        formatStack(owned);
    }

  }

  if(possible===Infinity){
    possible=0;
  }

  const result=document.getElementById("result");

  if(result){
    result.textContent=
      formatStack(possible);
  }
}


function handleTab(e){

  if(e.key!=="Tab"){
    return;
  }

  const inputs=[
    ...document.querySelectorAll(
      ".set-input,.piece-input"
    )
  ];

  const index=inputs.indexOf(e.target);

  if(index<0){
    return;
  }

  e.preventDefault();

  const next=e.shiftKey
    ? inputs[Math.max(0,index-1)]
    : inputs[Math.min(inputs.length-1,index+1)];

  next.focus();
  next.select();
}


document
  .getElementById("search")
  .addEventListener(
    "input",
    renderList
  );


document
  .getElementById("search")
  .addEventListener(
    "keydown",
    e=>{

      if(e.key==="Enter"){

        const first=
          document.querySelector(".recipe-btn");

        if(first){
          first.click();
        }

      }

    }
  );


/* 숫자 입력: 0 클릭 시 바로 선택 */

document.addEventListener(
  "focusin",
  e=>{

    if(
      e.target.matches(
        'input[type="number"]'
      )
    ){

      setTimeout(()=>{

        if(
          Number(e.target.value)===0
        ){
          e.target.select();
        }

      },0);

    }

  }
);


document.addEventListener(
  "focusout",
  e=>{

    if(
      e.target.matches(
        'input[type="number"]'
      )
    ){

      if(e.target.value===""){
        e.target.value="0";
      }

      if(
        e.target.matches(
          ".set-input,.piece-input"
        )
      ){
        updateCalculation();
      }

    }

  }
);


/* =========================
   단체주문
========================= */

function renderGroupOrderEditor(){

  const grid=
    document.getElementById(
      "groupOrderGrid"
    );

  grid.innerHTML=
    Array.from(
      {length:5},
      (_,i)=>`

      <div class="group-food">

        <label>
          음식 ${i+1}
        </label>

        <input
          class="group-food-name"
          data-index="${i}"
          placeholder="음식 이름"
        >

        <input
          class="group-food-amount"
          data-index="${i}"
          type="number"
          min="0"
          value="0"
          placeholder="주문 수량"
        >

      </div>

    `
    ).join("");

  fillGroupOrderEditor();
}


function renderGroupOrderView(){

  const view=
    document.getElementById(
      "groupOrderView"
    );

  const valid=
    groupOrderData.filter(
      food=>
        food.name &&
        food.name.trim()!==""
    );

  if(!valid.length){

    view.innerHTML=`
      <div class="note">
        아직 등록된 단체주문이 없습니다.
      </div>
    `;

    return;
  }

  view.innerHTML=
    valid.map(
      food=>`

      <div class="group-order-item">

        <strong>
          🍳 ${escapeHtml(food.name)}
        </strong>

        주문 수량:
        <b>
          ${Number(food.amount||0).toLocaleString()}개
        </b>

      </div>

    `
    ).join("");
}


function escapeHtml(text){

  const div=document.createElement("div");

  div.textContent=text;

  return div.innerHTML;
}


function fillGroupOrderEditor(){

  document
    .querySelectorAll(".group-food-name")
    .forEach(input=>{

      const i=
        Number(input.dataset.index);

      input.value=
        groupOrderData[i]?.name || "";

    });

  document
    .querySelectorAll(".group-food-amount")
    .forEach(input=>{

      const i=
        Number(input.dataset.index);

      input.value=
        groupOrderData[i]?.amount ?? 0;

    });

}


function setupGroupOrderFirebase(){

  if(
    !db ||
    !doc ||
    !onSnapshot
  ){
    return;
  }

  groupOrderRef=
    doc(
      db,
      "cookingOrder",
      "main"
    );

  onSnapshot(
    groupOrderRef,
    snapshot=>{

      if(snapshot.exists()){

        const data=snapshot.data();

        if(Array.isArray(data.foods)){

          groupOrderData=
            Array.from(
              {length:5},
              (_,i)=>({

                name:
                  data.foods[i]?.name || "",

                amount:
                  Number(
                    data.foods[i]?.amount
                  ) || 0

              })
            );

        }

      }

      renderGroupOrderView();

      if(isAdmin){
        fillGroupOrderEditor();
      }

      if(!isAdmin){

        document.getElementById(
          "groupOrderStatus"
        ).textContent=
          "👀 단체주문 내용을 확인할 수 있습니다.";

      }

    },
    error=>{

      console.error(error);

      document.getElementById(
        "groupOrderStatus"
      ).textContent=
        "⚠️ 단체주문을 불러오지 못했습니다.";

      renderGroupOrderView();

    }
  );

}


/* =========================
   관리자 로그인
========================= */

document
  .getElementById("loginBtn")
  .addEventListener(
    "click",
    ()=>{

      const box=
        document.getElementById(
          "loginBox"
        );

      box.style.display=
        (
          box.style.display==="none" ||
          box.style.display===""
        )
          ? "grid"
          : "none";

    }
  );


document
  .getElementById("loginSubmit")
  .addEventListener(
    "click",
    async()=>{

      const email=
        document
          .getElementById("adminEmail")
          .value
          .trim();

      const password=
        document
          .getElementById("adminPassword")
          .value;

      if(!email || !password){

        alert(
          "이메일과 비밀번호를 입력해주세요."
        );

        return;
      }

      if(
        !auth ||
        !signInWithEmailAndPassword
      ){

        alert(
          "Firebase 연결을 기다리는 중입니다. 잠시 후 다시 시도해주세요."
        );

        return;
      }

      try{

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      }catch(error){

        console.error(error);

        alert(
          "로그인에 실패했습니다.\n이메일 또는 비밀번호를 확인해주세요."
        );

      }

    }
  );


document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    async()=>{

      if(auth && signOut){
        await signOut(auth);
      }

    }
  );


/* =========================
   단체주문 저장
========================= */

document
  .getElementById("saveGroupOrder")
  .addEventListener(
    "click",
    async()=>{

      if(!isAdmin){

        alert(
          "관리자만 수정할 수 있습니다."
        );

        return;
      }

      if(
        !groupOrderRef ||
        !setDoc
      ){

        alert(
          "Firebase 연결을 기다리는 중입니다. 잠시 후 다시 시도해주세요."
        );

        return;
      }

      const foods=[];

      for(let i=0;i<5;i++){

        const name=
          document.querySelector(
            `.group-food-name[data-index="${i}"]`
          ).value.trim();

        const amount=
          Math.max(
            0,
            Number(
              document.querySelector(
                `.group-food-amount[data-index="${i}"]`
              ).value
            ) || 0
          );

        foods.push({
          name,
          amount
        });

      }

      try{

        await setDoc(
          groupOrderRef,
          {
            foods,
            updatedAt:
              new Date().toISOString()
          },
          {
            merge:true
          }
        );

        alert(
          "단체주문이 저장되었습니다!"
        );

      }catch(error){

        console.error(error);

        alert(
          "저장에 실패했습니다.\nFirestore 규칙과 관리자 UID를 확인해주세요."
        );

      }

    }
  );


/* =========================
   Firebase 초기화
   계산기 화면이 Firebase와
   상관없이 먼저 표시되도록
   동적 import 사용
========================= */

async function initFirebase(){

  try{

    const appModule=
      await import(
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"
      );

    const authModule=
      await import(
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"
      );

    const firestoreModule=
      await import(
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
      );


    initializeApp=
      appModule.initializeApp;

    getAuth=
      authModule.getAuth;

    signInWithEmailAndPassword=
      authModule.signInWithEmailAndPassword;

    signOut=
      authModule.signOut;

    onAuthStateChanged=
      authModule.onAuthStateChanged;

    getFirestore=
      firestoreModule.getFirestore;

    doc=
      firestoreModule.doc;

    setDoc=
      firestoreModule.setDoc;

    onSnapshot=
      firestoreModule.onSnapshot;


    const firebaseApp=
      initializeApp(
        firebaseConfig
      );


    auth=
      getAuth(firebaseApp);

    db=
      getFirestore(firebaseApp);


    setupGroupOrderFirebase();


    onAuthStateChanged(
      auth,
      user=>{

        const editor=
          document.getElementById(
            "groupOrderEditor"
          );

        const loginBtn=
          document.getElementById(
            "loginBtn"
          );

        const logoutBtn=
          document.getElementById(
            "logoutBtn"
          );

        const loginBox=
          document.getElementById(
            "loginBox"
          );

        const status=
          document.getElementById(
            "groupOrderStatus"
          );


        if(
          user &&
          user.uid===ADMIN_UID
        ){

          isAdmin=true;

          editor.style.display=
            "block";

          loginBtn.style.display=
            "none";

          logoutBtn.style.display=
            "inline-block";

          loginBox.style.display=
            "none";

          status.textContent=
            "🔓 관리자 모드 - 단체주문을 수정할 수 있습니다.";

          fillGroupOrderEditor();

        }else{

          isAdmin=false;

          editor.style.display=
            "none";

          loginBtn.style.display=
            "inline-block";

          logoutBtn.style.display=
            "none";

          loginBox.style.display=
            "none";

          status.textContent=
            "👀 단체주문 내용을 확인할 수 있습니다.";

          if(user){

            alert(
              "관리자 계정이 아닙니다.\n보기만 가능합니다."
            );

          }

        }

      }
    );

  }catch(error){

    console.error(
      "Firebase 연결 오류:",
      error
    );

    document.getElementById(
      "groupOrderStatus"
    ).textContent=
      "⚠️ Firebase 연결 실패 - 계산기는 계속 사용할 수 있습니다.";

    renderGroupOrderView();

  }

}


/* =========================
   시작
========================= */

renderGroupOrderEditor();

renderList();

initFirebase();

</script>
