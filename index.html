<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>은하 요리 계산기 & 단체 주문 관리</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --border-color: #334155;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    h2, h3, h4 {
      margin-top: 0;
      color: var(--accent-color);
    }

    .hidden {
      display: none !important;
    }

    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-weight: bold;
      font-size: 0.9em;
    }

    input, select, button {
      padding: 10px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background-color: #0f172a;
      color: var(--text-color);
      font-size: 14px;
    }

    button {
      background-color: #0284c7;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #0369a1;
    }

    .btn-secondary {
      background-color: #475569;
    }

    .btn-secondary:hover {
      background-color: #334155;
    }

    .grid-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .header-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    ul {
      padding-left: 20px;
    }

    li {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 상단 헤더 & 인증 제어 -->
  <div class="card header-actions">
    <h2>🚀 은하 요리 계산기</h2>
    <div>
      <button id="loginBtn">로그인</button>
      <button id="logoutBtn" class="hidden btn-secondary">로그아웃</button>
    </div>
  </div>

  <!-- 로그인 폼 영역 -->
  <div id="loginSection" class="card hidden">
    <h3>관리자 로그인</h3>
    <div class="form-group">
      <input type="email" id="emailInput" placeholder="이메일">
    </div>
    <div class="form-group">
      <input type="password" id="passwordInput" placeholder="비밀번호">
    </div>
    <button id="doLoginBtn">로그인 확인</button>
    <p id="loginStatus"></p>
  </div>

  <!-- 단체 주문 관리자 전용 영역 -->
  <div id="groupAdmin" class="card hidden">
    <h3>⚙️ 단체 주문 설정 (관리자 전용)</h3>
    <div class="grid-inputs">
      <div class="form-group">
        <label for="groupOrderDate">주문 날짜</label>
        <input type="date" id="groupOrderDate">
      </div>
      <div class="form-group">
        <label for="boostCategory">협동 부스트 종목</label>
        <select id="boostCategory">
          <option value="낚시">낚시</option>
          <option value="채집">채집</option>
          <option value="채광">채광</option>
          <option value="전투">전투</option>
        </select>
      </div>
    </div>

    <h4>주문 항목 (최대 5개)</h4>
    <div id="groupOrderEditor"></div>
    <br>
    <button id="saveGroupOrderBtn">설정 저장하기</button>
  </div>

  <!-- 단체 주문 현황 (모든 사용자 표시) -->
  <div id="groupViewer" class="card">
    <!-- 동적 렌더링 영역 -->
  </div>

  <!-- 액션 버튼 -->
  <div class="card header-actions">
    <button id="sendGroupDiscordBtn" class="hidden">📢 디스코드 전송</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
  import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

  // Firebase 설정
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const ADMIN_UID = "YOUR_ADMIN_UID_HERE"; 
  const DISCORD_WEBHOOK_URL = "YOUR_DISCORD_WEBHOOK_URL_HERE";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  let groupOrders = createEmptyOrders();
  let currentGroupDate = "";
  let currentBoostCategory = "낚시";

  function createEmptyOrders() {
    return Array.from({ length: 5 }, () => ({ name: "", price: 0 }));
  }

  function renderGroupOrderEditor() {
    const container = document.getElementById("groupOrderEditor");
    if (!container) return;
    container.innerHTML = "";
    groupOrders.forEach((item, index) => {
      const div = document.createElement("div");
      div.className = "grid-inputs";
      div.innerHTML = `
        <input type="text" value="${item.name}" placeholder="음식/재료명 ${index + 1}" data-index="${index}" class="order-name">
        <input type="number" value="${item.price || ''}" placeholder="가격" data-index="${index}" class="order-price">
      `;
      container.appendChild(div);
    });

    container.querySelectorAll('.order-name').forEach(input => {
      input.addEventListener('input', (e) => {
        const idx = e.target.dataset.index;
        groupOrders[idx].name = e.target.value;
      });
    });

    container.querySelectorAll('.order-price').forEach(input => {
      input.addEventListener('input', (e) => {
        const idx = e.target.dataset.index;
        groupOrders[idx].price = Number(e.target.value) || 0;
      });
    });
  }

  function renderGroupViewer() {
    const container = document.getElementById("groupViewer");
    if (!container) return;
    
    let html = `<h3>📋 단체 주문 및 부스트 현황</h3>`;
    html += `<p><strong>날짜:</strong> ${currentGroupDate || '미정'}</p>`;
    html += `<p><strong>협동 부스트:</strong> ${currentBoostCategory}</p>`;
    html += `<h4>주문 목록:</h4><ul>`;
    
    let hasItems = false;
    groupOrders.forEach(item => {
      if (item.name) {
        hasItems = true;
        html += `<li>${item.name} - ${item.price ? item.price.toLocaleString() + '원' : '가격 미정'}</li>`;
      }
    });

    if (!hasItems) {
      html += `<li>등록된 주문 항목이 없습니다.</li>`;
    }
    
    html += `</ul>`;
    container.innerHTML = html;
  }

  function updateCalculation() {
    // 계산기 연동 로직 구현 영역
  }

  function renderRecipe() {
    // 레시피 UI 업데이트 로직 구현 영역
  }

  function renderList() {
    // 기본 목록 렌더링 로직
  }

  // Firebase 실시간 동기화
  const groupOrderRef = ref(db, "groupOrders/latest");
  onValue(groupOrderRef, (snapshot) => {
    const data = snapshot.val();
    if (data) {
      if (Array.isArray(data.items)) {
        groupOrders = data.items.slice(0, 5).map(food => ({
          name: food.name || "",
          price: Number(food.price || 0)
        }));
        while (groupOrders.length < 5) {
          groupOrders.push({ name: "", price: 0 });
        }
      } else {
        groupOrders = createEmptyOrders();
      }
      currentGroupDate = data.date || "";
      currentBoostCategory = data.boost || "낚시";

      const orderDateInput = document.getElementById("groupOrderDate");
      if (orderDateInput && !orderDateInput.value) {
        orderDateInput.value = currentGroupDate;
      }
      const boostSelect = document.getElementById("boostCategory");
      if (boostSelect) {
        boostSelect.value = currentBoostCategory;
      }
    } else {
      groupOrders = createEmptyOrders();
      currentGroupDate = "";
      currentBoostCategory = "낚시";
    }
    renderGroupOrderEditor();
    renderGroupViewer();
    updateCalculation();
  });

  // 관리자 설정 저장 버튼
  document.getElementById("saveGroupOrderBtn").addEventListener("click", async () => {
    const dateVal = document.getElementById("groupOrderDate").value;
    const boostVal = document.getElementById("boostCategory").value;

    try {
      await set(groupOrderRef, {
        date: dateVal,
        boost: boostVal,
        items: groupOrders
      });
      alert("단체 주문 설정이 성공적으로 저장되었습니다!");
    } catch (err) {
      console.error(err);
      alert("저장 실패: " + err.message);
    }
  });

  // 디스코드 전송
  document.getElementById("sendGroupDiscordBtn").addEventListener("click", async () => {
    if (!DISCORD_WEBHOOK_URL || DISCORD_WEBHOOK_URL.includes("YOUR_DISCORD")) {
      alert("디스코드 웹훅 URL을 설정해주세요.");
      return;
    }

    let itemsText = groupOrders
      .filter(item => item.name)
      .map(item => `• ${item.name}: ${item.price ? item.price.toLocaleString() + '원' : '가격 미정'}`)
      .join("\n");

    const message = {
      content: `📢 **[단체 주문 및 협동 부스트 안내]**\n\n📅 **날짜:** ${currentGroupDate || '미정'}\n🎯 **협동 부스트:** ${currentBoostCategory}\n\n📝 **주문 목록:**\n${itemsText || "없음"}`
    };

    try {
      const response = await fetch(DISCORD_WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(message)
      });
      if (response.ok) {
        alert("디스코드 메시지가 성공적으로 발송되었습니다!");
      } else {
        alert("디스코드 전송 실패");
      }
    } catch (err) {
      console.error(err);
      alert("전송 중 오류 발생: " + err.message);
    }
  });

  // Auth UI 이벤트
  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const loginSection = document.getElementById("loginSection");
  const groupAdmin = document.getElementById("groupAdmin");
  const sendGroupDiscordBtn = document.getElementById("sendGroupDiscordBtn");

  loginBtn.addEventListener("click", () => {
    loginSection.classList.toggle("hidden");
    if (!loginSection.classList.contains("hidden")) {
      loginSection.scrollIntoView({ behavior: 'smooth' });
    }
  });

  document.getElementById("doLoginBtn").addEventListener("click", async () => {
    const email = document.getElementById("emailInput").value.trim();
    const password = document.getElementById("passwordInput").value;
    const loginStatus = document.getElementById("loginStatus");

    try {
      loginStatus.textContent = "로그인 중...";
      await signInWithEmailAndPassword(auth, email, password);
      loginStatus.textContent = "✅ 로그인 성공!";
      document.getElementById("emailInput").value = "";
      document.getElementById("passwordInput").value = "";
      loginSection.classList.add("hidden");
    } catch (error) {
      console.error(error);
      loginStatus.textContent = "❌ 로그인 실패: " + (error.message || error);
    }
  });

  logoutBtn.addEventListener("click", async () => {
    try {
      await signOut(auth);
      alert("로그아웃 되었습니다.");
    } catch (error) {
      console.error(error);
    }
  });

  onAuthStateChanged(auth, user => {
    if (user && user.uid === ADMIN_UID) {
      loginBtn.classList.add("hidden");
      logoutBtn.classList.remove("hidden");
      groupAdmin.classList.remove("hidden");
      sendGroupDiscordBtn.classList.remove("hidden");
    } else {
      loginBtn.classList.remove("hidden");
      logoutBtn.classList.add("hidden");
      groupAdmin.classList.add("hidden");
      sendGroupDiscordBtn.classList.add("hidden");
    }
    renderRecipe();
  });

  renderList();
</script>
</body>
</html>
