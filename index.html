<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>은하 요리 계산기</title>
<style>
:root{
  --bg:#080a1f;
  --panel:rgba(16,19,48,.88);
  --panel2:rgba(28,32,75,.82);
  --text:#f4f5ff;
  --muted:#b9bddb;
  --line:rgba(255,255,255,.13);
  --accent:#9b8cff;
  --accent2:#61d6ff;
  --success:#68e0a0;
  --danger:#ff647c;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  background:
    radial-gradient(circle at 15% 20%,rgba(111,76,255,.38),transparent 28%),
    radial-gradient(circle at 85% 25%,rgba(0,180,255,.23),transparent 25%),
    radial-gradient(circle at 50% 90%,rgba(180,50,255,.18),transparent 30%),
    linear-gradient(135deg,#050614,#101434 55%,#070818);
}
body:before{
  content:"✦ · ✧        ·        ✦        · ✧     ·       ✦        · ✧";
  position:fixed;
  left:0;
  top:0;
  width:50%;
  height:100%;
  pointer-events:none;
  opacity:.45;
  font-size:32px;
  letter-spacing:24px;
  line-height:140px;
  overflow:hidden;
  z-index:0;
}
body:after{
  content:"✧ · ✦        ·        ✧        · ✦        · ✧     ·       ✦";
  position:fixed;
  right:0;
  top:0;
  width:50%;
  height:100%;
  pointer-events:none;
  opacity:.45;
  font-size:32px;
  letter-spacing:24px;
  line-height:140px;
  overflow:hidden;
  text-align:right;
  z-index:0;
}
.app{
  position:relative;
  z-index:1;
  max-width:1150px;
  margin:auto;
  padding:25px 16px 45px;
}
.hero{
  text-align:center;
  margin-bottom:18px;
}
.hero h1{
  margin:0;
  font-size:clamp(28px,5vw,48px);
  text-shadow:0 0 24px rgba(150,120,255,.7);
}
.hero p{
  color:var(--muted);
  margin:8px 0 0;
  font-size:17px;
}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  backdrop-filter:blur(14px);
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.controls{
  padding:18px;
  margin-bottom:16px;
}
.search{
  width:100%;
  padding:16px 18px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#080a20;
  color:var(--text);
  font-size:19px;
  outline:none;
}
.recipe-list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:8px;
  margin-top:14px;
  max-height:300px;
  overflow:auto;
}
.recipe-btn{
  padding:15px;
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:12px;
  cursor:pointer;
  text-align:left;
  font-size:19px;
  font-weight:bold;
}
.recipe-btn:hover,
.recipe-btn.active{
  border-color:var(--accent2);
  box-shadow:0 0 16px rgba(97,214,255,.22);
}
.grade{
  font-size:14px;
  opacity:.75;
  display:block;
  margin-bottom:5px;
}
.content{padding:20px}
.selected{
  font-size:26px;
  font-weight:bold;
  margin:0 0 16px;
}
.result{
  padding:18px;
  border-radius:16px;
  background:linear-gradient(135deg,rgba(110,85,255,.22),rgba(55,180,255,.14));
  border:1px solid rgba(150,150,255,.28);
  margin-bottom:18px;
  font-size:18px;
}
.result strong{
  font-size:clamp(28px,4vw,42px);
  display:block;
  margin-top:6px;
}
.section-title{
  font-size:21px;
  font-weight:bold;
  margin:22px 0 10px;
}
.table{
  width:100%;
  border-collapse:collapse;
  overflow:hidden;
  border-radius:14px;
  font-size:16px;
}
th,td{
  padding:13px 10px;
  border-bottom:1px solid var(--line);
  text-align:center;
}
th{
  color:#d9d7ff;
  background:rgba(255,255,255,.05);
}
td:first-child{
  text-align:left;
  font-weight:bold;
}
input.num{
  width:90px;
  padding:11px;
  border-radius:9px;
  border:1px solid var(--line);
  background:#090b23;
  color:white;
  text-align:center;
  font-size:17px;
}
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0;
}
input[type="number"]{
  -moz-appearance:textfield;
  appearance:textfield;
}
.owned{white-space:nowrap}
.note{
  color:var(--muted);
  font-size:14px;
}
.empty{
  text-align:center;
  color:var(--muted);
  padding:30px;
  font-size:18px;
}
.top-actions{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:15px;
  flex-wrap:wrap;
}
.btn{
  border:1px solid var(--line);
  background:rgba(255,255,255,.07);
  color:white;
  padding:11px 16px;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
}
.btn:hover{filter:brightness(1.15)}
.btn-primary{
  background:rgba(155,140,255,.25);
  border-color:rgba(155,140,255,.6);
}
.btn-success{
  background:rgba(104,224,160,.14);
  border-color:rgba(104,224,160,.4);
}
.btn-danger{
  background:rgba(255,100,124,.14);
  border-color:rgba(255,100,124,.4);
}
.btn-discord{
  background:rgba(88,101,242,.3);
  border-color:rgba(88,101,242,.7);
  color:#fff;
  font-weight:bold;
}
.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}
.group-card{
  padding:20px;
  margin-top:16px;
}
.group-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.group-title{
  font-size:23px;
  font-weight:bold;
}
.group-note{
  color:var(--muted);
  font-size:14px;
  margin-top:5px;
}
.group-date-display{
  color:var(--accent2);
  font-weight:bold;
  font-size:16px;
  margin-top:6px;
}
.group-list{
  margin-top:15px;
}
.group-item{
  padding:15px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  border-radius:13px;
  margin-bottom:9px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}
.group-item-name{
  font-size:18px;
  font-weight:bold;
}
.group-item-info{
  color:var(--muted);
  font-size:14px;
  margin-top:5px;
}
.group-price{
  text-align:right;
  white-space:nowrap;
}
.group-price .base{
  color:var(--muted);
  font-size:12px;
}
.group-price strong{
  display:block;
  margin-top:4px;
  font-size:19px;
}
.rate-toggle{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:15px;
  padding:13px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);
  border-radius:12px;
}
.switch{
  position:relative;
  width:52px;
  height:28px;
}
.switch input{
  opacity:0;
  width:0;
  height:0;
}
.slider{
  position:absolute;
  inset:0;
  background:#303555;
  border-radius:30px;
  cursor:pointer;
  transition:.2s;
}
.slider:before{
  content:"";
  position:absolute;
  width:20px;
  height:20px;
  left:4px;
  top:4px;
  background:white;
  border-radius:50%;
  transition:.2s;
}
.switch input:checked + .slider{
  background:#8b7cff;
}
.switch input:checked + .slider:before{
  transform:translateX(24px);
}
.admin-grid-wrap{
  overflow-x:auto;
  margin-top:15px;
}
.admin-grid{
  display:grid;
  grid-template-columns:repeat(5,200px);
  gap:10px;
  min-width:1040px;
}
.admin-food{
  padding:14px;
  border-radius:14px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);
}
.admin-food-title{
  font-size:16px;
  font-weight:bold;
  margin-bottom:12px;
}
.field{margin-bottom:10px}
.field label{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:5px;
}
.field input, .field select{
  width:100%;
  padding:10px;
  background:#090b23;
  border:1px solid var(--line);
  border-radius:9px;
  color:white;
}
.admin-total{
  padding-top:10px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:12px;
}
.admin-total strong{
  display:block;
  color:white;
  font-size:16px;
  margin-top:5px;
}
.admin-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
}
.status{
  min-height:20px;
  color:var(--muted);
  margin-top:10px;
  font-size:14px;
}
.login-box{
  margin-top:15px;
  padding:16px;
  border-radius:14px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);
}
.login-row{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:10px;
}
.login-row input{
  width:100%;
  padding:12px;
  background:#090b23;
  border:1px solid var(--line);
  border-radius:9px;
  color:white;
}
.hidden{display:none!important}

/* 전설/신화 레이아웃 */
.high-grade-layout{
  display:flex;
  flex-direction:column;
  gap:18px;
}
.high-grade-section-title{
  font-size:22px;
  font-weight:bold;
  margin:0 0 10px;
}
.high-grade-main-card{
  padding:18px;
  border-radius:16px;
  background:linear-gradient(135deg,rgba(155,140,255,.22),rgba(97,214,255,.12));
  border:1px solid rgba(150,150,255,.28);
}
.high-grade-main-grade{
  color:var(--muted);
  font-size:14px;
  margin-bottom:5px;
}
.high-grade-main-name{
  font-size:25px;
  font-weight:bold;
}
.high-grade-sub-box{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.high-grade-sub-item-card{
  padding:16px;
  border-radius:14px;
  background:rgba(255,255,255,.035);
  border:1px solid var(--line);
}
.high-grade-sub-header{
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
  color:var(--accent2);
}
.high-grade-total-category{
  margin-bottom:14px;
  padding:13px;
  border-radius:14px;
  background:rgba(255,255,255,.025);
  border:1px solid var(--line);
}
.high-grade-category-title{
  font-size:19px;
  font-weight:bold;
  margin-bottom:8px;
}

@media(max-width:700px){
  .app{padding:14px 8px 30px}
  .content,.controls,.group-card{padding:13px}
  th:nth-child(2),td:nth-child(2){display:none}
  .table{font-size:13px}
  input.num{width:60px}
  .recipe-btn{font-size:18px}
  body:before,body:after{
    font-size:24px;
    letter-spacing:14px;
    line-height:110px;
  }
  .login-row{grid-template-columns:1fr}
  .group-item{align-items:flex-start;flex-direction:column}
  .group-price{text-align:left}
  .high-grade-main-name{font-size:21px}
}
</style>
</head>

<body>
<div class="app">

  <div class="hero">
    <h1>🌌 은하 요리 계산기 🍳</h1>
    <p>64개 = 1세트 · 보유 재료를 세트 + 낱개로 입력하세요</p>

    <div class="top-actions">
      <button class="btn btn-primary" id="loginBtn">🔐 관리자 로그인</button>
      <button class="btn btn-danger hidden" id="logoutBtn">로그아웃</button>
    </div>
  </div>

  <div class="card controls">
    <input
      id="search"
      class="search"
      placeholder="🔎 요리 이름을 검색하세요"
    >
    <div id="recipeList" class="recipe-list"></div>
  </div>

  <div class="card content">
    <div id="appContent" class="empty">
      위에서 요리를 선택해주세요.
    </div>
  </div>

  <div class="card group-card">
    <div class="group-header">
      <div>
        <div class="group-title">📋 단체주문 및 협동 목록</div>
        <div class="group-note">
          등록된 단체주문 및 협동 요리 정보를 확인할 수 있습니다.
        </div>
        <div id="groupDateDisplay" class="group-date-display"></div>
      </div>

      <button
        class="btn btn-discord hidden"
        id="sendGroupDiscordBtn"
      >
        📢 디스코드 전송
      </button>
    </div>

    <div id="groupViewer">

      <div class="rate-toggle">
        <label class="switch">
          <input type="checkbox" id="groupRateToggle">
          <span class="slider"></span>
        </label>

        <div>
          <strong>15% 추가금 적용</strong>
          <div class="note">
            켜기 / 끄기는 사용자별로 따로 적용됩니다.
          </div>
        </div>
      </div>

      <div id="groupViewerList" class="group-list"></div>
    </div>

    <div id="groupAdmin" class="hidden">

      <div style="display:flex; gap:15px; flex-wrap:wrap; margin-top:15px;">

        <div class="field" style="flex:1; min-width:200px;">
          <label>📅 날짜 (예: 9월 7일)</label>
          <input
            type="text"
            id="groupOrderDate"
            placeholder="예: 9월 7일"
          >
        </div>

        <div class="field" style="flex:1; min-width:200px;">
          <label>⚡ 부스트 종목 (협동)</label>
          <select id="boostCategory">
            <option value="채광">채광</option>
            <option value="벌목">벌목</option>
            <option value="농사">농사</option>
            <option value="낚시" selected>낚시</option>
          </select>
        </div>

      </div>

      <div class="admin-grid-wrap">
        <div id="groupOrderGrid" class="admin-grid"></div>
      </div>

      <div class="admin-buttons">
        <button class="btn btn-success" id="saveGroupOrderBtn">
          💾 정보 저장
        </button>

        <button class="btn btn-danger" id="clearGroupOrderBtn">
          🗑️ 전체 삭제
        </button>
      </div>

      <div id="adminStatus" class="status"></div>
    </div>
  </div>

  <div id="loginSection" class="card group-card hidden">

    <div class="section-title">🔐 관리자 인증</div>

    <div class="login-box">

      <div class="login-row">

        <input
          type="email"
          id="emailInput"
          placeholder="관리자 이메일"
        >

        <input
          type="password"
          id="passwordInput"
          placeholder="관리자 비밀번호"
        >

        <button class="btn btn-primary" id="doLoginBtn">
          로그인
        </button>

      </div>

      <div id="loginStatus" class="status"></div>

    </div>
  </div>

</div>

function loadOwnedMaterials(){
  try{
    return JSON.parse(
      localStorage.getItem(OWNED_STORAGE_KEY)
    ) || {};
  }catch{
    return {};
  }
}

let ownedMaterials = loadOwnedMaterials();


function saveOwnedMaterials(){
  localStorage.setItem(
    OWNED_STORAGE_KEY,
    JSON.stringify(ownedMaterials)
  );
}


/* ================================
   레시피 확장 (최종 기본 재료 추출용)
   ================================ */

function expandRecipe(
  name,
  amount = 1,
  result = {}
){

  if(!all[name]) return result;

  for(const [item,need] of Object.entries(all[name])){

    const total = need * amount;

    if(all[item]){
      expandRecipe(
        item,
        total,
        result
      );
    }else{
      result[item] =
        (result[item] || 0) + total;
    }
  }

  return result;
}


/* ================================
   숫자 포맷팅
   ================================ */

function formatNumber(n){
  return Number(n || 0).toLocaleString("ko-KR");
}


function formatWon(n){
  return `${formatNumber(Math.round(n || 0))}크론`;
}


function formatStack(n){

  n = Math.floor(Number(n || 0));

  const sets = Math.floor(n / STACK);
  const pieces = n % STACK;

  if(sets && pieces){
    return `${formatNumber(n)}개 (${formatNumber(sets)}세트 + ${formatNumber(pieces)}개)`;
  }

  if(sets){
    return `${formatNumber(n)}개 (${formatNumber(sets)}세트)`;
  }

  return `${formatNumber(n)}개`;
}

/* ================================
   HTML 안전 처리
   ================================ */

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#39;");
}


function cssId(name){
  return btoa(
    unescape(
      encodeURIComponent(name)
    )
  ).replace(
    /[^a-zA-Z0-9]/g,
    ""
  );
}


/* ================================
   Discord 연동
   ================================ */

async function postToDiscord(message){

  if(!DISCORD_WEBHOOK_URL){
    alert("디스코드 웹훅 URL이 설정되지 않았습니다.");
    return false;
  }

  try{
    const res = await fetch(
      DISCORD_WEBHOOK_URL,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          username:"단체주문 및 협동",
          content:message
        })
      }
    );

    if(res.ok){
      alert("디스코드로 성공적으로 전송되었습니다!");
      return true;
    }else{
      alert("디스코드 전송 실패: " + res.statusText);
      return false;
    }
  }catch(err){
    console.error(err);
    alert("전송 중 에러가 발생했습니다.");
    return false;
  }
}


async function sendSingleRecipeToDiscord(){
  if(
    !auth.currentUser ||
    auth.currentUser.uid !== ADMIN_UID
  ){

    alert("전설 및 신화 등급 요리만 디스코드로 전송할 수 있습니다.");
    return;
  }

  const message =
    `🌌 **[요리 수량 정보]**\n` +
    `🍳 **요리명:** [${selectedGrade}] ${selected}\n` +
    `🍲 **제작 가능 수량:** ${formatStack(currentPossibleCount)}`;

  await postToDiscord(message);
}


async function sendGroupOrderToDiscord(){
  if(
    !auth.currentUser ||
    auth.currentUser.uid !== ADMIN_UID
  ){
    alert("관리자만 디스코드 전송을 사용할 수 있습니다.");
    return;
  }

  const validOrders =
    groupOrders.filter(
      food =>
        String(food.name || "").trim() &&
        Number(food.price || 0) > 0
    );

  if(!validOrders.length){
    alert("전송할 내역이 없습니다.");
    return;
  }

  let dateVal =
    document.getElementById("groupOrderDate").value.trim() ||
    currentGroupDate ||
    getFormattedToday();

  let boostVal =
    document.getElementById("boostCategory").value ||
    currentBoostCategory ||
    "낚시";

  let messageLines = [
    `${dateVal}`,
    `부스트 종목은`,
    `${boostVal}!!(납품 점수 3배 적용!)`,
    `--------------------------------------------------`
  ];

  validOrders.forEach(food=>{
    const foodName = food.name.trim();
    const basePrice = Math.round(Number(food.price));
    const multiplierText = food.multiplier ? ` (${food.multiplier.trim()})` : "";

    let lines = [`${foodName} : ${formatNumber(basePrice)}크론${multiplierText}`];

    if(recipes["전설"][foodName] || recipes["신화"][foodName]){
      const sub = recipes["전설"][foodName] || recipes["신화"][foodName];
      
      for(const [subName, amount] of Object.entries(sub)){
        const subIngs = all[subName] || {};
        const subIngsStr = Object.entries(subIngs)
          .map(([matName, matNeed])=>{
            let prefix = "";
            if(FISH.includes(matName)){
              prefix = "[A]";
            }
            return `${prefix}${matName} ${matNeed * amount}개`;
          })
          .join(", ");

        lines.push(`• ${subName}(40초 3200크론): ${subIngsStr}`);
      }
    }

    messageLines.push(
      lines.join("\n") + `\n--------------------------------------------------`
    );
  });

  const msg = messageLines.join("\n").trim();
  const success = await postToDiscord(msg);

  if(success){
    document.getElementById("groupOrderDate").value = dateVal;
    await setDoc(
      groupOrderRef,
      {
        orders:groupOrders,
        date:dateVal,
        boost:boostVal,
        updatedAt:Date.now()
      },
      { merge:true }
    );
  }
}

function createHighGradeMaterialTable(ingredients){
  const groups = {
    1: [], // 피쉬
    3: [], // 가공재료
    2: []  // 커스텀 농작물
  };

  Object.entries(ingredients).forEach(([name, need])=>{
    groups[getIngredientCategory(name)].push([name, need]);
  });

  let html = "";

  [1, 3, 2].forEach(category=>{
    if(!groups[category].length) return;

    groups[category].sort(([a], [b])=> a.localeCompare(b, "ko"));

    html += `
      <div class="high-grade-total-category">
        <div class="high-grade-category-title">
          ${getCategoryName(category)}
        </div>
        <div style="overflow:auto">
          <table class="table">
            <thead>
              <tr>
                <th>재료</th>
                <th>총 필요량</th>
                <th>보유량</th>
                <th>세트</th>
                <th>낱개</th>
              </tr>
            </thead>
            <tbody>
              ${
                groups[category]
                  .map(([name, need])=>{
                    const saved =
                      ownedMaterials[name] ||
                      { sets:0, pieces:0 };

                    return `
                      <tr>
                        <td>${escapeHtml(displayIngredientName(name))}</td>
                        <td>${formatNumber(need)}개</td>
                        <td class="owned" id="owned-${cssId(name)}">0개</td>
                        <td>
                          <input
                            class="num set-input"
                            data-name="${escapeHtml(name)}"
                            type="number"
                            min="0"
                            value="${Math.max(0, Number(saved.sets || 0))}"
                          >
                        </td>
                        <td>
                          <input
                            class="num piece-input"
                            data-name="${escapeHtml(name)}"
                            type="number"
                            min="0"
                            value="${Math.max(0, Number(saved.pieces || 0))}"
                          >
                        </td>
                      </tr>`;
                  })
                  .join("")
              }
            </tbody>
          </table>
        </div>
      </div>
    `;
  });

  return html;
}

/* ================================
   계산 로직
   ================================ */

function calculate(){
  if(!selected) return;

  const isHighGrade =
    selectedGrade === "전설" ||
    selectedGrade === "신화";

  const ingredients =
    isHighGrade
      ? expandRecipe(selected)
      : all[selected];

  let minCount = Infinity;

  for(const [name, need] of Object.entries(ingredients)){
    const saved = ownedMaterials[name] || { sets:0, pieces:0 };
    const totalOwned =
      Number(saved.sets || 0) * STACK +
      Number(saved.pieces || 0);

    const possible = Math.floor(totalOwned / need);
    if(possible < minCount){
      minCount = possible;
    }

    const ownedEl = document.getElementById(`owned-${cssId(name)}`);
    if(ownedEl){
      ownedEl.innerText = formatStack(totalOwned);
    }
  }

  if(minCount === Infinity){
    minCount = 0;
  }

  currentPossibleCount = minCount;

  const countEl = document.getElementById("possibleCount");
  if(countEl){
    countEl.innerText = formatStack(minCount);
  }
}


function bindInputs(){
  document.querySelectorAll(".set-input, .piece-input").forEach(input=>{
    input.oninput = (e)=>{
      const name = e.target.dataset.name;
      const tr = e.target.closest("tr");
      if(!tr) return;

      const setInput = tr.querySelector(".set-input");
      const pieceInput = tr.querySelector(".piece-input");

      const sets = Math.max(0, parseInt(setInput?.value || 0));
      const pieces = Math.max(0, parseInt(pieceInput?.value || 0));

      if(!ownedMaterials[name]){
        ownedMaterials[name] = {};
      }

      ownedMaterials[name].sets = sets;
      ownedMaterials[name].pieces = pieces;

      saveOwnedMaterials();
      calculate();
    };
  });
}


/* ================================
   단체주문 관리 (관리자 UI용 데이터 구조)
   ================================ */

let groupOrders = [];
let currentGroupDate = "";
let currentBoostCategory = "낚시";


function renderGroupViewer(orders){
  const viewerList = document.getElementById("groupViewerList");
  viewerList.innerHTML = "";

  const isRateChecked =
    document.getElementById("groupRateToggle")?.checked || false;

  orders.forEach((food, index)=>{
    const foodName = food.name || "";
    const basePrice = Number(food.price || 0);
    const multiplier = food.multiplier || "";

    if(!foodName && basePrice === 0) return;

    let finalPrice = basePrice;
    if(isRateChecked){
      finalPrice = basePrice * 1.15;
    }

    const div = document.createElement("div");
    div.className = "group-item";

    div.innerHTML = `
      <div>
        <div class="group-item-name">${index + 1}. ${escapeHtml(foodName)}</div>
        <div class="group-item-info">
          ${multiplier ? `배율: ${escapeHtml(multiplier)}` : "기본 주문"}
        </div>
      </div>
      <div class="group-price">
        <span class="base">기본: ${formatWon(basePrice)}</span>
        <strong>${formatWon(finalPrice)}</strong>
      </div>
    `;

    viewerList.appendChild(div);
  });
}


function renderGroupAdminGrid(orders){
  const grid = document.getElementById("groupOrderGrid");
  grid.innerHTML = "";

  for(let i=0; i<5; i++){
    const food = orders[i] || { name:"", price:"", multiplier:"" };

    const div = document.createElement("div");
    div.className = "admin-food";

    div.innerHTML = `
      <div class="admin-food-title">요리 #${i + 1}</div>
      <div class="field">
        <label>요리 이름</label>
        <input type="text" class="admin-name" data-index="${i}" value="${escapeHtml(food.name || "")}">
      </div>
      <div class="field">
        <label>기준 가격 (크론)</label>
        <input type="number" class="admin-price" data-index="${i}" value="${food.price !== undefined ? food.price : ""}">
      </div>
      <div class="field">
        <label>배율 표시 (예: (x2.03))</label>
        <input type="text" class="admin-multiplier" data-index="${i}" value="${escapeHtml(food.multiplier || "")}">
      </div>
    `;

    grid.appendChild(div);
  }
}


/* ================================
   Firebase 실시간 동기화
   ================================ */

onSnapshot(groupOrderRef, (docSnap)=>{
  if(docSnap.exists()){
    const data = docSnap.data();
    groupOrders = data.orders || [];
    currentGroupDate = data.date || getFormattedToday();
    currentBoostCategory = data.boost || "낚시";

    document.getElementById("groupDateDisplay").innerText =
      `${currentGroupDate} · 부스트: ${currentBoostCategory} (3배)`;

    document.getElementById("groupOrderDate").value = currentGroupDate;
    document.getElementById("boostCategory").value = currentBoostCategory;
  }else{
    groupOrders = [];
    currentGroupDate = getFormattedToday();
    currentBoostCategory = "낚시";
    document.getElementById("groupDateDisplay").innerText = "";
  }

  renderGroupViewer(groupOrders);
  renderGroupAdminGrid(groupOrders);
});


/* ================================
   이벤트 바인딩 및 인증 관리
   ================================ */

document.getElementById("search").oninput = renderList;

document.getElementById("groupRateToggle").onchange = (e)=>{
  localStorage.setItem(RATE_STORAGE_KEY, e.target.checked);
  renderGroupViewer(groupOrders);
};

const savedRate = localStorage.getItem(RATE_STORAGE_KEY) === "true";
document.getElementById("groupRateToggle").checked = savedRate;


const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const loginSection = document.getElementById("loginSection");
const groupAdmin = document.getElementById("groupAdmin");
const sendGroupDiscordBtn = document.getElementById("sendGroupDiscordBtn");

loginBtn.onclick = ()=>{
  loginSection.classList.toggle("hidden");
};

logoutBtn.onclick = async ()=>{
  await signOut(auth);
};

document.getElementById("doLoginBtn").onclick = async ()=>{
  const email = document.getElementById("emailInput").value.trim();
  const password = document.getElementById("passwordInput").value;
  const status = document.getElementById("loginStatus");

  if(!email || !password){
    status.innerText = "이메일과 비밀번호를 입력해주세요.";
    return;
  }

  try{
    status.innerText = "로그인 중...";
    await signInWithEmailAndPassword(auth, email, password);
    status.innerText = "로그인 성공!";
    loginSection.classList.add("hidden");
  }catch(err){
    status.innerText = "로그인 실패: " + err.message;
  }
};


onAuthStateChanged(auth, (user)=>{
  const isAdmin = user && user.uid === ADMIN_UID;

  if(isAdmin){
    loginBtn.classList.add("hidden");
    logoutBtn.classList.remove("hidden");
    groupAdmin.classList.remove("hidden");
    sendGroupDiscordBtn.classList.remove("hidden");
  }else{
    loginBtn.classList.remove("hidden");
    logoutBtn.classList.add("hidden");
    groupAdmin.classList.add("hidden");
    sendGroupDiscordBtn.classList.add("hidden");
    loginSection.classList.add("hidden");
  }

  if(selected){
    renderRecipe();
  }
});


document.getElementById("saveGroupOrderBtn").onclick = async ()=>{
  const grid = document.getElementById("groupOrderGrid");
  const items = grid.querySelectorAll(".admin-food");
  const newOrders = [];

  items.forEach((item, index)=>{
    const name = item.querySelector(".admin-name").value.trim();
    const price = Number(item.querySelector(".admin-price").value || 0);
    const multiplier = item.querySelector(".admin-multiplier").value.trim();

    newOrders[index] = { name, price, multiplier };
  });

  const dateVal =
    document.getElementById("groupOrderDate").value.trim() ||
    getFormattedToday();

  const boostVal = document.getElementById("boostCategory").value;

  try{
    await setDoc(
      groupOrderRef,
      {
        orders: newOrders,
        date: dateVal,
        boost: boostVal,
        updatedAt: Date.now()
      },
      { merge: true }
    );
    document.getElementById("adminStatus").innerText = "저장되었습니다.";
  }catch(err){
    document.getElementById("adminStatus").innerText = "저장 실패: " + err.message;
  }
};


document.getElementById("clearGroupOrderBtn").onclick = async ()=>{
  if(!confirm("정말 전체 삭제하시겠습니까?")) return;

  try{
    await setDoc(
      groupOrderRef,
      {
        orders: [],
        date: getFormattedToday(),
        boost: "낚시",
        updatedAt: Date.now()
      },
      { merge: true }
    );
    document.getElementById("adminStatus").innerText = "삭제되었습니다.";
  }catch(err){
    document.getElementById("adminStatus").innerText = "삭제 실패: " + err.message;
  }
};


sendGroupDiscordBtn.onclick = sendGroupOrderToDiscord;


renderList();

</script>
